/* ==================== 研发中心 ==================== */
function getShopRows() {
  const rows = [];
  const y0 = 104, h = 58, gap = 6;
  for (let i = 0; i < META_DEFS.length; i++) {
    const d = META_DEFS[i];
    const y = y0 + i * (h + gap);
    rows.push({
      x: 20, y: y, w: W - 40, h: h, def: d,
      bx: W - 20 - 92, by: y + (h - 34) / 2, bw: 92, bh: 34
    });
  }
  return rows;
}
function getShopBack() { return { x: W / 2 - 90, y: H - 62, w: 180, h: 44 }; }

function drawShop() {
  ctx.fillStyle = 'rgba(3,8,18,0.95)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText('研发中心', W / 2, 52);

  ctx.fillStyle = 'rgba(200,225,255,0.8)';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillText('金币  ' + SAVE.coins, W / 2, 80);

  const rows = getShopRows();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], d = r.def;
    const lv = mLv(d.key);
    const maxed = lv >= d.max;
    const cost = mCost(d);
    const can = !maxed && SAVE.coins >= cost;

    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    roundRect(ctx, r.x, r.y, r.w, r.h, 8); ctx.fill();
    ctx.strokeStyle = maxed ? 'rgba(120,255,180,0.5)' : 'rgba(120,200,255,0.22)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, r.x, r.y, r.w, r.h, 8); ctx.stroke();

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#dff3ff';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText(d.name, r.x + 14, r.y + 24);

    ctx.fillStyle = 'rgba(180,210,240,0.6)';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText(d.desc, r.x + 14, r.y + 42);

    for (let k = 0; k < d.max; k++) {
      const px = r.x + 14 + k * 12;
      const py = r.y + 50;
      ctx.beginPath();
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = k < lv ? '#4ade80' : 'rgba(255,255,255,0.15)';
      ctx.fill();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (maxed) {
      ctx.fillStyle = 'rgba(120,255,180,0.15)';
      roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(120,255,180,0.6)'; ctx.lineWidth = 1.5;
      roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.stroke();
      ctx.fillStyle = '#7fffb4';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText('已满级', r.bx + r.bw / 2, r.by + r.bh / 2);
    } else {
      ctx.fillStyle = can ? 'rgba(255,210,74,0.14)' : 'rgba(255,255,255,0.05)';
      roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.fill();
      ctx.strokeStyle = can ? '#ffd24a' : 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.stroke();
      ctx.fillStyle = can ? '#ffd24a' : 'rgba(255,255,255,0.3)';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText('◈ ' + cost, r.bx + r.bw / 2, r.by + r.bh / 2);
    }
  }

  const bb = getShopBack();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRect(ctx, bb.x, bb.y, bb.w, bb.h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(140,220,255,0.6)'; ctx.lineWidth = 1.5;
  roundRect(ctx, bb.x, bb.y, bb.w, bb.h, 8); ctx.stroke();
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('返回', W / 2, bb.y + bb.h / 2);
}

/* ==================== 升级界面 ==================== */
function getLevelCards() {
  const list = [];
  const n = levelChoices.length;
  if (!n) return list;
  const cw = 140, ch = 196, gap = 10;
  const totalW = cw * n + gap * (n - 1);
  const x0 = (W - totalW) / 2;
  const y0 = 244;
  for (let i = 0; i < n; i++) {
    list.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch, c: levelChoices[i] });
  }
  return list;
}

function drawLevelUp() {
  ctx.fillStyle = 'rgba(3,8,18,0.82)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const treasureMode = treasureRewardsRemaining > 0;
  ctx.fillStyle = treasureMode ? '#ffd84d' : '#7fe9ff';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(treasureMode ? '大  秘  宝' : '升  级', W / 2, 130);
  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText(treasureMode
    ? '第 ' + (treasureRewardsTotal - treasureRewardsRemaining + 1) + ' / ' + treasureRewardsTotal + ' 次三选一'
    : '选择一项强化 · Lv.' + player.level, W / 2, 162);
  ctx.fillStyle = 'rgba(160,200,240,0.45)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText(treasureMode
    ? '秘宝强化 · 每次仍为三选一'
    : '武器槽 ' + player.weapons.length + ' / ' + MAX_SLOTS +
      (mobileMode ? '' : '   （按 1 / 2 / 3 快速选择）'), W / 2, 188);

  const cards = getLevelCards();
  for (let i = 0; i < cards.length; i++) {
    const cd = cards[i];
    const info = choiceInfo(cd.c);
    const hot = hotCard === i;
    const isFuse = cd.c.kind === 'fuse';

    ctx.fillStyle = hot ? 'rgba(255,255,255,0.10)' : 'rgba(10,24,44,0.92)';
    roundRect(ctx, cd.x, cd.y, cd.w, cd.h, 12); ctx.fill();

    if (isFuse) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 4);
      ctx.save();
      ctx.globalAlpha = 0.3 + pulse * 0.4;
      ctx.fillStyle = '#ff44aa';
      roundRect(ctx, cd.x - 3, cd.y - 3, cd.w + 6, cd.h + 6, 14); ctx.fill();
      ctx.restore();
    }

    ctx.strokeStyle = info.color;
    ctx.lineWidth = hot ? 3 : 2;
    roundRect(ctx, cd.x, cd.y, cd.w, cd.h, 12); ctx.stroke();

    ctx.fillStyle = info.color;
    roundRect(ctx, cd.x, cd.y, cd.w, 6, 3); ctx.fill();

    ctx.beginPath();
    ctx.arc(cd.x + cd.w / 2, cd.y + 58, 26, 0, Math.PI * 2);
    ctx.fillStyle = info.color + '22'; ctx.fill();
    ctx.strokeStyle = info.color + '99'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = info.color;
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(info.icon, cd.x + cd.w / 2, cd.y + 59);

    ctx.fillStyle = 'rgba(180,210,240,0.6)';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.fillText(info.sub, cd.x + cd.w / 2, cd.y + 100);

    ctx.fillStyle = info.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText(info.title, cd.x + cd.w / 2, cd.y + 124);

    ctx.fillStyle = 'rgba(200,225,255,0.72)';
    ctx.font = '11px system-ui, sans-serif';
    wrapText(info.desc, cd.x + cd.w / 2, cd.y + 150, cd.w - 20, 15);

    if (!mobileMode) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.fillText('[' + (i + 1) + ']', cd.x + cd.w / 2, cd.y + cd.h - 12);
    }
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function wrapText(text, cx, y, maxW, lh) {
  const chars = String(text).split('');
  let line = '', lines = [];
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line); line = chars[i];
    } else line = test;
  }
  if (line) lines.push(line);
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], cx, y + i * lh);
  }
}

/* ==================== 暂停 / 结束 ==================== */
function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(3,8,18,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillText('已暂停', W / 2, H / 2);
  ctx.fillStyle = 'rgba(200,225,255,0.8)';
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillText(mobileMode ? '点击屏幕任意处继续' : '按 P 或 Esc 继续', W / 2, H / 2 + 36);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(3,8,18,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#ff5a6e';
  ctx.font = 'bold 42px system-ui, sans-serif';
  ctx.fillText('游戏结束', W / 2, H / 2 - 100);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillText('最终得分：' + score, W / 2, H / 2 - 34);

  ctx.fillStyle = 'rgba(190,220,255,0.85)';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText('最高得分：' + SAVE.best, W / 2, H / 2 + 2);

  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillText('获得金币 +' + gainCoins, W / 2, H / 2 + 40);

  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText('抵达等级 Lv.' + player.level + ' · 难度 ' + currentDiff.label, W / 2, H / 2 + 70);

  if (Math.floor(time * 2) % 2 === 0) {
    ctx.fillStyle = '#7fe9ff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText(mobileMode ? '点击屏幕重新开始' : '点击画面 或 按 R 键 重新开始', W / 2, H / 2 + 128);
  }

  ctx.fillStyle = 'rgba(150,180,215,0.5)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('金币可在主菜单「研发中心」购买永久强化', W / 2, H - 30);
}

/* ==================== 渲染主函数 ==================== */
let hotCard = -1;

function render() {
  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawBackground();
  drawOrbs();
  drawPickups();
  drawEnemies();
  drawBullets();
  drawEnemyBullets();
  drawWeaponFx();
  drawPlayer();
  drawParticles();
  drawBombRings();

  ctx.restore();

  if (state === 'playing') drawBossEntranceOverlay();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, flash) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (state !== 'menu' && state !== 'shop') drawHUD();
  if (state === 'playing' || state === 'paused') drawMobileControls();

  if (state === 'menu')     drawMenu();
  if (state === 'shop')     drawShop();
  if (state === 'levelup')  drawLevelUp();
  if (state === 'paused')   drawPauseOverlay();
  if (state === 'gameover') drawGameOver();
}

/* ==================== 输入 ==================== */
function handlePointerDown(x, y) {
  initAudio();
  hotCard = -1;

  if (state === 'menu') {
    const btns = getMenuButtons();
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        currentDiff = b.diff;
        resetGame();
        return true;
      }
    }
    const sb = getShopBtn();
    if (x >= sb.x && x <= sb.x + sb.w && y >= sb.y && y <= sb.y + sb.h) {
      state = 'shop';
      return true;
    }
    return false;
  }

  if (state === 'shop') {
    const rows = getShopRows();
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (x >= r.bx && x <= r.bx + r.bw && y >= r.by && y <= r.by + r.bh) {
        const d = r.def, lv = mLv(d.key), cost = mCost(d);
        if (lv < d.max && SAVE.coins >= cost) {
          SAVE.coins -= cost;
          SAVE.meta[d.key] = lv + 1;
          persist();
          sfx('pickup');
        } else sfx('deny');
        return true;
      }
    }
    const bb = getShopBack();
    if (x >= bb.x && x <= bb.x + bb.w && y >= bb.y && y <= bb.y + bb.h) {
      state = 'menu';
      return true;
    }
    return false;
  }

  if (state === 'levelup') {
    const cards = getLevelCards();
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        pickChoice(c.c);
        return true;
      }
    }
    return false;
  }

  if (state === 'gameover') { resetGame(); return true; }
  if (state === 'paused')   { state = 'playing'; return true; }

  return false;
}

/* ---- 鼠标 ---- */
canvas.addEventListener('mousemove', function (e) {
  const p = toGame(e.clientX, e.clientY);
  if (state === 'playing') { player.tx = p.x; player.ty = p.y; }
  else if (state === 'levelup') {
    hotCard = -1;
    const cards = getLevelCards();
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) { hotCard = i; break; }
    }
  }
});

canvas.addEventListener('mousedown', function (e) {
  initAudio();
  const p = toGame(e.clientX, e.clientY);
  if (state === 'playing') {
    if (e.button === 2) { useBomb(); return; }
    return;
  }
  handlePointerDown(p.x, p.y);
});

canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---- 触摸 ---- */
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  initAudio();
  mobileMode = true;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = toGame(t.clientX, t.clientY);

    if (state === 'playing') {
      const btn = hitMobileButton(p.x, p.y);
      if (btn) { doMobileButton(btn.id); continue; }

      if (!touchCtrl.active) {
        let offX = player.x - p.x;
        let offY = player.y - p.y;
        const d = Math.sqrt(offX * offX + offY * offY);
        const MAX_OFF = 130;
        if (d > MAX_OFF) { offX = 0; offY = -52; }
        touchCtrl.offsetX = offX;
        touchCtrl.offsetY = offY;
        touchCtrl.active = true;
        touchCtrl.id = t.identifier;
      }
      continue;
    }

    if (handlePointerDown(p.x, p.y)) return;
  }
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (state !== 'playing' || !touchCtrl.active) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchCtrl.id) {
      const p = toGame(t.clientX, t.clientY);
      player.tx = p.x + touchCtrl.offsetX;
      player.ty = p.y + touchCtrl.offsetY;
      break;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchCtrl.id) {
      touchCtrl.active = false;
      touchCtrl.id = null;
    }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

/* ---- 键盘 ---- */
window.addEventListener('keydown', function (e) {
  initAudio();
  const k = e.key.toLowerCase();

  if (state === 'levelup') {
    if (k === '1' || k === '2' || k === '3') {
      const idx = parseInt(k, 10) - 1;
      if (levelChoices[idx]) pickChoice(levelChoices[idx]);
    }
    return;
  }
  if (state === 'shop') {
    if (k === 'escape') state = 'menu';
    return;
  }
  if (k === ' ' || k === 'spacebar') { e.preventDefault(); useBomb(); }
  else if (k === 'p' || k === 'escape') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  else if (k === 'm') muted = !muted;
  else if (k === 'r') { if (state === 'gameover') resetGame(); }
});

/* ==================== 主循环 ==================== */
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 1 / 30) dt = 1 / 30;

  time += dt;

  if (state === 'playing') updateGame(dt);
  updateEffects(dt);

  render();
  requestAnimationFrame(loop);
}

/* ==================== 启动 ==================== */
clouds.length = 0;
for (let i = 0; i < 16; i++) clouds.push(newCloud(true));

requestAnimationFrame(loop);

})();
</script>
