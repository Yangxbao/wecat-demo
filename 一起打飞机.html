   - 调试「屏蔽掉落」加强：同时屏蔽经验珠，杀敌不再弹升级三选一

   ========================================================= */

/* ==================== 工具 ==================== */
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function circleHit(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, rr = a.r + b.r;
  return dx * dx + dy * dy < rr * rr;
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let mobileMode = isTouchDevice;

/* ==================== 音频 ==================== */
let actx = null, muted = false, lastShotSound = 0;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  if (actx && actx.state === 'suspended') actx.resume();
}

function tone(type, f0, f1, dur, vol) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}

function noise(dur, vol, cutoff, exp) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  try {
    const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, exp);
    const src = actx.createBufferSource(); src.buffer = buf;
    const flt = actx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = cutoff;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(actx.destination);
    src.start(t);
  } catch (e) {}
}

function sfx(type) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  switch (type) {
    case 'shoot':
      if (t - lastShotSound < 0.06) return;
      lastShotSound = t;
      tone('square', 900, 430, 0.05, 0.014);
      break;
    case 'explode':  noise(0.22, 0.085, 1100, 2); break;
    case 'bigboom':  noise(0.55, 0.13, 900, 1.4); break;
    case 'nuke':
      noise(0.9, 0.15, 700, 1.2);
      tone('triangle', 120, 40, 0.7, 0.055);
      break;
    case 'hit':      tone('sawtooth', 220, 70, 0.18, 0.05); break;
    case 'pickup':   tone('sine', 620, 1180, 0.12, 0.045); break;
    case 'levelup':  tone('sine', 520, 1560, 0.35, 0.06); break;
    case 'fuse':     tone('sine', 400, 1800, 0.6, 0.08); break;
    case 'warn':     tone('square', 320, 470, 0.24, 0.035); break;
    case 'over':     tone('triangle', 400, 80, 0.9, 0.07); break;
    case 'deny':     tone('square', 200, 140, 0.12, 0.04); break;
    case 'ghost':    tone('sine', 700, 1400, 0.4, 0.05); break;
    case 'evolution':tone('sine', 300, 2200, 1.1, 0.09); break;
    case 'dragon':   tone('sawtooth', 140, 380, 0.35, 0.06); break;
    case 'lasercannon': tone('sine', 700, 180, 0.35, 0.028); break;
    case 'thunder':  noise(0.18, 0.08, 1400, 2); tone('sawtooth', 180, 60, 0.2, 0.05); break;
    case 'peace':    tone('sine', 440, 880, 0.9, 0.07); break;
    case 'cyber':    tone('sawtooth', 300, 1400, 0.9, 0.085); break;
    case 'ascend':   tone('sine', 220, 2600, 1.6, 0.1); break;
  }
}

  saw:0, scythe:0, aura:0,

/* ==================== 局外成长 ==================== */
const SAVE = (function () {
  let coins = +(localStorage.getItem('t2_coins') || 0);
  let meta = null;
  try { meta = JSON.parse(localStorage.getItem('t2_meta') || 'null'); } catch (e) { meta = null; }
  if (!meta && coins < 500) {
    coins = 500;
    try { localStorage.setItem('t2_coins', '500'); } catch (e) {}
  }
  return {
    best: +(localStorage.getItem('t2_best') || 0),
    coins: coins,
    meta: meta || {}
  };
})();
function persist() {
  try {
    localStorage.setItem('t2_best', String(SAVE.best));
    localStorage.setItem('t2_coins', String(SAVE.coins));

}

const META_DEFS = [

function mLv(k) { return SAVE.meta[k] || 0; }
function mCost(d) { return Math.floor(d.cost * (1 + mLv(d.key) * 0.9)); }
const bonusHp        = () => mLv('hp') * 25;
const bonusDmg       = () => 1 + mLv('dmg') * 0.10;
const bonusSpd       = () => mLv('speed') * 0.06;
const bonusXp        = () => 1 + mLv('xp') * 0.15;
const bonusCoin      = () => (1 + mLv('coin') * 0.20) * (1 + mLv('wealth') * 0.30) * (1 + mLv('salvage') * 0.08);
const bonusMag       = () => mLv('magnet') * 0.30;
const bonusLuck      = () => mLv('luck') * 0.12;
const bonusArmor     = () => mLv('armor') * 0.04;
const bonusCrit      = () => mLv('crit') * 0.03;
const bonusRegen     = () => mLv('regen') * 0.8;
const bonusFireRate  = () => Math.max(0.58, 1 - mLv('overdrive') * 0.035);
const bonusFusionDmg = () => 1 + mLv('fusioncore') * 0.07;
const bonusVamp      = () => 1 + mLv('siphon') * 0.05;
const bonusShield    = () => mLv('shieldcore') * 1.5;
const bonusDR        = () => Math.min(0.30, mLv('plating') * 0.03);
const bonusCoreBoost = () => mLv('coreboost') * 0.025;

function fusionPen(wOrKey, level) {
  const key = typeof wOrKey === 'string' ? wOrKey : (wOrKey && wOrKey.key);
  if (FUSION_KEYS.indexOf(key) < 0) return bonusArmor();
  const lv = Math.max(1, level || (wOrKey && wOrKey.level) || 1);
  return Math.min(0.97, 0.14 + (lv - 1) * 0.068 + bonusArmor() + bonusCoreBoost());
}

// 融合武器专属伤害成长：每次升级不仅提升基础/等级倍率，
// 还会额外获得稳定的等级成长；研发中心的「融合反应堆」再做乘算。
function fusionDamageRaw(wOrKey, base, perLevel) {
  const lv = Math.max(1, typeof wOrKey === 'number' ? wOrKey : ((wOrKey && wOrKey.level) || 1));
  const levelGrowth = 1 + (lv - 1) * 0.085 + (lv >= 12 ? 0.10 : 0);
  return (base + perLevel * lv) * levelGrowth * bonusFusionDmg();
}

function applyDamageToEnemy(e, rawDamage, armorPen) {
  if (!e) return 0;
  const pen = Math.max(0, armorPen || 0);
  const armor = Math.max(0, e.armor || 0);
  const reduction = clamp(armor - pen, 0, 0.85);
  const dealt = rawDamage * (1 - reduction);
  e.hp -= dealt;
  return dealt;
}
function rollWeaponCrit(rawDamage) {
  return Math.random() < Math.min(0.45, bonusCrit()) ? rawDamage * 2 : rawDamage;
}

};
const XP_GAIN_MUL = 1.12;
function curDmg() { return player.dmgMul * (player.buffs.rage > 0 ? 2 : 1); }

function xpNeedFor(lv) {
  return Math.floor(7 + lv * 4.5 + Math.pow(lv, 1.7) * 1.4);
}

function getEnemyScale() {
  if (player.level < 20) return { hp: 1, dmg: 1, count: 1 };
  const lv = player.level - 20;
  return {
    hp:    1.5 + lv * 0.14,
    dmg:   1.4 + lv * 0.09,
    count: 1.3 + lv * 0.035
  };
}

/* ==================== 子弹工厂 ==================== */
function newBullet(x, y, vx, vy, o) {
  if (bullets.length >= MAX_PLAYER_BULLETS) return null;
  const b = {
    x: x, y: y, vx: vx, vy: vy, r: 4, dmg: 1,
    bounces: 0, pierce: 0, life: 3,
    color: '#eaffff', glow: 'rgba(120,235,255,0.35)',
    laser: false, laserCannon: false, fireball: false,
    rot: false, angle: 0,
    homing: false, boomer: false, bt: 0, cool: 0, dmgTick: 0, armorPen: 0
  };
  if (o) for (const k in o) b[k] = o[k];
  b.dmg *= curDmg();
  if (player.buffs.bounce > 0) b.bounces = Math.max(b.bounces, 2);
  return b;
}
function pushBullet(x, y, vx, vy, o) {
  const b = newBullet(x, y, vx, vy, o);
  if (b) bullets.push(b);
}

  player.spd = 1 + bonusSpd();
  player.magnet = 90 * bonusMag();
  player.bombs = 1 + mLv('bomb');
  player.shield = bonusShield(); player.invuln = 0;
  player.combo = 0; player.comboTimer = 0;
  player.buffs = { bounce: 0, rage: 0, rapid: 0 };
  player.evolveFlash = 0;
  player.lastForm = 'base';
  treasureRewardsRemaining = 0;
  treasureRewardsTotal = 0;
  bossSerial = 0;
  fusedWeaponLocks = {};
  player.weapons = [{ key: 'mg', level: 1, cd: 0, angle: 0, orbs: [], tick: 0 }];

  clouds.length = 0;
  for (let i = 0; i < 16; i++) clouds.push(newCloud(true));
}

/* ==================== 坐标 ==================== */
function toGame(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) * (W / r.width), y: (cy - r.top) * (H / r.height) };
}

/* ==================== 核爆 ==================== */
let lastNukeSound = -1;
function nukeExplosion(x, y, isWhite, radius, dmg, armorPen) {
  if (time - lastNukeSound > 0.12) { lastNukeSound = time; sfx('nuke'); }
  addExplosion(x, y, isWhite ? 14 : 18, isWhite ? '#ffffff' : '#3a0a4a', isWhite ? 1.0 : 1.4);
  if (bombRings.length < MAX_BOMB_RINGS - 1) {
    bombRings.push({ x, y, r: 0, life: 0.55, max: 0.55, color: isWhite ? '190,235,245' : '80,0,120', thick: isWhite ? 3 : 8, maxR: radius * 0.85 });
  }
  const finalDmg = dmg * curDmg();
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) continue;
    const dx = e.x - x, dy = e.y - y;
    const rr = radius + e.r;
    if (dx * dx + dy * dy < rr * rr) {
      applyDamageToEnemy(e, finalDmg, armorPen || bonusArmor()); e.hitFlash = 0.2;
      if (e.hp <= 0) killEnemy(i);
    }
  }
  shake = Math.max(shake, isWhite ? 2 : 4);
  flash = Math.max(flash, isWhite ? 0.04 : 0.06);
}

/* ==================== 雷电天降 ==================== */
function spawnLightningBolt(tx) {
  const pts = [];
  const segs = 10;
  let cx = tx;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const y = -20 + t * (player.y + 30);
    const off = (Math.random() - 0.5) * 36 * (1 - t * 0.4);
    pts.push({ x: cx + off, y: y });
  }
  lightningBolts.push({
    x: tx, t: 0, life: 0.45, max: 0.45,
    pts: pts, dmg: 40 * curDmg(), hitRadius: 48
  });

  const dmg = 40 * curDmg();
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (!e) continue;
    if (Math.abs(e.x - tx) < e.r + 46) {
      applyDamageToEnemy(e, dmg, bonusArmor());
      e.hitFlash = 0.12;
      addSparks(e.x, e.y, 6);
      if (e.hp <= 0) killEnemy(j);
    }
  }
  sfx('thunder');
  shake = Math.max(shake, 4);
}

function updateLightningBolts(dt) {
  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    const lb = lightningBolts[i];
    lb.t += dt;
    lb.life -= dt;
    if (lb.life <= 0) lightningBolts.splice(i, 1);
  }
}

function drawLightningBolts() {
  for (let i = 0; i < lightningBolts.length; i++) {
    const lb = lightningBolts[i];
    const a = lb.life / lb.max;
    const pulse = 0.6 + 0.4 * Math.sin(time * 40 + i);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.strokeStyle = 'rgba(150,220,255,' + (0.5 * pulse) + ')';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(lb.pts[0].x, lb.pts[0].y);
    for (let k = 1; k < lb.pts.length; k++) ctx.lineTo(lb.pts[k].x, lb.pts[k].y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(220,240,255,' + (0.85 * pulse) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(lb.pts[0].x, lb.pts[0].y);
    for (let k = 1; k < lb.pts.length; k++) ctx.lineTo(lb.pts[k].x, lb.pts[k].y);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * pulse) + ')';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(lb.pts[0].x, lb.pts[0].y);
    for (let k = 1; k < lb.pts.length; k++) ctx.lineTo(lb.pts[k].x, lb.pts[k].y);
    ctx.stroke();

    const last = lb.pts[lb.pts.length - 1];
    const rp = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 60);
    rp.addColorStop(0, 'rgba(220,240,255,' + (0.85 * pulse) + ')');
    rp.addColorStop(0.4, 'rgba(140,200,255,' + (0.4 * pulse) + ')');
    rp.addColorStop(1, 'rgba(100,180,255,0)');
    ctx.fillStyle = rp;
    ctx.beginPath(); ctx.arc(last.x, last.y, 60, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

/* ==================== 玩家武器开火 ==================== */
function fireWeapon(w) {
  const p = player, lv = w.level;
  const bx = p.x, by = p.y - 22;

  switch (w.key) {
    case 'mg': {
      const n = Math.min(lv, 6);
      const spread = 0.075;
      const dmg = 0.42 + (lv > 8 ? (lv - 8) * 0.05 : 0);
      const isFireball = lv >= 12;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * spread;
        pushBullet(bx, by, Math.cos(a) * 780, Math.sin(a) * 780, {
          r: isFireball ? 8 : 4,
          dmg: isFireball ? dmg * 1.8 : dmg,
          life: 2.2,
          fireball: isFireball,
          color: isFireball ? '#ff9030' : '#eaffff',
          glow: isFireball ? 'rgba(255,120,40,0.5)' : 'rgba(120,235,255,0.35)'
        });
      }
      break;
    }
    case 'laser': {
      if (lv >= 12) {
        pushBullet(bx, by, 0, 0, {
          r: 14, dmg: 3.2, pierce: 999,
          laser: true, laserCannon: true, life: 2.2,
          color: '#ffd0ff', glow: 'rgba(255,120,255,0.55)'
        });
      } else {
        const n = Math.min(1 + Math.floor(lv / 3), 4);
        const dmg = 0.85 + lv * 0.09;
        for (let i = 0; i < n; i++) {
          const off = (i - (n - 1) / 2) * 12;
          pushBullet(bx + off, by, 0, -1400,
            { r: 3, dmg: dmg, pierce: lv, laser: true, life: 1.6,
              color: '#ff5aff', glow: 'rgba(255,120,255,0.45)' });
        }
      }
      break;
    }
    case 'spiral': {
      w.angle = (w.angle || 0) + 0.9;
      const n = Math.min(2 + Math.floor(lv * 0.4), 6);
      const dmg = 0.42 + (lv > 6 ? (lv - 6) * 0.05 : 0);
      for (let i = 0; i < n; i++) {
        const off = Math.sin(w.angle + i * 0.7) * 0.6;
        const a = -Math.PI / 2 + off;
        pushBullet(bx, by, Math.cos(a) * 680, Math.sin(a) * 680,
          { r: 4, dmg: dmg, life: 2.4, color: '#a0ffb0', glow: 'rgba(120,255,150,0.4)' });
      }
      break;
    }
    case 'spread': {
      const n = Math.min(3 + Math.floor(lv * 0.7), 8);
      const dmg = 0.42 + (lv > 8 ? (lv - 8) * 0.08 : 0);
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.13;
        const sp = 480 + Math.random() * 90;
        pushBullet(bx, by, Math.cos(a) * sp, Math.sin(a) * sp,
          { r: 5, dmg: dmg, life: 1.05, color: '#ffd24a', glow: 'rgba(255,220,120,0.4)' });
      }
      break;
    }
    case 'homing': {
      const n = Math.min(1 + Math.floor((lv + 1) / 3), 4);
      const dmg = 0.85 + lv * 0.07;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.8;
        pushBullet(bx, by, Math.cos(a) * 360, Math.sin(a) * 360,
          { r: 5, dmg: dmg, homing: true, life: 3.2, color: '#7fd1ff', glow: 'rgba(120,200,255,0.45)' });
      }
      break;
    }
    case 'boomer': {
      const n = Math.min(1 + Math.floor(lv / 3), 4);
      const dmg = 0.9 + lv * 0.45;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.5;
        pushBullet(bx, by, Math.cos(a) * 560, Math.sin(a) * 560,
          { r: 9, dmg: dmg, boomer: true, rot: true, pierce: 4, life: 3, color: '#c08aff', glow: 'rgba(190,140,255,0.4)' });
      }
      break;
    }
    case 'littleboy': {
      if (lv >= 12) {
        const boltCount = 6 + Math.floor(lv * 0.4);
        if (enemies.length > 0) {
          for (let i = 0; i < boltCount; i++) {
            const target = enemies[Math.floor(Math.random() * enemies.length)];
            if (!target) break;
            spawnLightningBolt(target.x);
          }
        } else {
          for (let i = 0; i < 3; i++) spawnLightningBolt(rand(40, W - 40));
        }
      } else {
        const n = Math.min(2 + Math.floor(lv * 0.3), 5);
        const dmg = 6 + lv * 1.1;
        const radius = 105 + lv * 8;
        for (let i = 0; i < n; i++) nukeExplosion(rand(20, W - 20), rand(20, H - 80), true, radius, dmg);
      }
      break;
    }
    case 'fatman': {
      const n = Math.min(2 + Math.floor(lv / 3.5), 5);
      const dmg = 14 + lv * 2.0;
      const radius = 150 + lv * 13;
      for (let i = 0; i < n; i++) nukeExplosion(rand(40, W - 40), rand(40, H - 100), false, radius, dmg);
      break;
    }
    case 'nukepiece': {
      const n = 2 + Math.floor(lv / 3);
      for (let i = 0; i < n; i++) nukeExplosion(rand(20, W - 20), rand(20, H - 80), Math.random() < 0.5, 130 + lv * 10 + Math.random() * 70, fusionDamageRaw(w, 18, 5.4) + Math.random() * 16, fusionPen(w, lv));
      /* 「世界和平万岁」改由 updateGame 中的 15 秒循环计时触发 */
      break;
    }
    case 'judgment': {
      const n = Math.min(10, 5 + Math.floor((lv - 1) / 2));
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + i * (Math.PI * 2 / n);
        pushBullet(bx, p.y - 6, Math.cos(a) * (350 + lv * 24), Math.sin(a) * (350 + lv * 24), {
          r: 20 + lv * 1.7, dmg: fusionDamageRaw(w, 10, 2.7), pierce: 34 + lv * 3, armorPen: fusionPen(w, lv), sword: true, rot: true, angle: a, life: 3.55,
          color: '#ffe66d', glow: 'rgba(255,240,150,0.50)', alpha: 0.68
        });
      }
      break;
    }
    case 'atombreath': { w.beam = true; break; }
    case 'tenyuan': { w.beam = true; break; }
  }
}

/* ==================== 电锯 ==================== */
function updateSaw(w, dt) {
  const lv = w.level;
  const isDragon = lv >= 12;

  if (isDragon) {
    w.len = 460;
    w.halfW = 46;
    w.tick = (w.tick || 0) - dt;
    if (w.tick > 0) return;
    w.tick = 0.08;
    if (Math.random() < 0.7) sfx('dragon');
    const dmg = (12 + lv * 1.4) * curDmg();
    const topY = player.y - 22 - w.len;
    const bottomY = player.y - 22;
    const x = player.x;
    const hw = w.halfW;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e || (e.type === 'boss' && e.intro > 0)) continue;
      if (e.x + e.r > x - hw && e.x - e.r < x + hw &&
          e.y + e.r > topY && e.y - e.r < bottomY) {
        applyDamageToEnemy(e, dmg, bonusArmor()); e.hitFlash = 0.1;
        addSparks(e.x, e.y, 8);
        if (e.hp <= 0) killEnemy(j);
      }
    }
    return;
  }

  w.len = 90 + lv * 22;
  w.halfW = 12 + lv * 1.1;
  w.tick = (w.tick || 0) - dt;
  if (w.tick > 0) return;
  w.tick = 0.055;
  const dmg = (2.2 + lv * 0.7) * curDmg();
  const topY = player.y - 22 - w.len;
  const bottomY = player.y - 22;
  const x = player.x;
  const hw = w.halfW;
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (!e || (e.type === 'boss' && e.intro > 0)) continue;
    if (e.x + e.r > x - hw && e.x - e.r < x + hw &&
        e.y + e.r > topY && e.y - e.r < bottomY) {
      applyDamageToEnemy(e, dmg, bonusArmor()); e.hitFlash = 0.06;
      if (Math.random() < 0.45) addSparks(e.x, e.y, 2);
      if (e.hp <= 0) killEnemy(j);
    }
  }
}

/* ==================== 刀镰 ==================== */
function updateScythe(w, dt) {
  if (!w.orbs) w.orbs = [];
  const lv = w.level;
  const want = Math.min(3 + Math.floor(lv * 0.6), 10);
  const distTarget = 74 + lv * 8.8;
  const rTarget = 16 + lv * 2.1;
  while (w.orbs.length < want) w.orbs.push({ a: Math.random() * Math.PI * 2, dist: distTarget, r: rTarget, x: player.x, y: player.y });
  while (w.orbs.length > want) w.orbs.pop();
  const dmg = (2 + lv * 0.7) * curDmg();
  const spin = 12.8 + lv * 0.15;
  for (let k = 0; k < w.orbs.length; k++) {
    const o = w.orbs[k];
    o.dist = distTarget; o.r = rTarget;
    o.a += spin * dt;
    o.x = player.x + Math.cos(o.a) * o.dist;
    o.y = player.y + Math.sin(o.a) * o.dist;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e) continue;
      if (!circleHit(o, e)) continue;
      if (!e.bladeCd) e.bladeCd = 0;
      if (time - e.bladeCd > 0.065) {
        applyDamageToEnemy(e, dmg, fusionPen(w, lv)); e.hitFlash = 0.08; e.bladeCd = time;
        addSparks(o.x, o.y, 5);
        if (e.hp <= 0) killEnemy(j);
      }
    }
  }
}

/* ==================== 光环 ==================== */
function updateAura(w, dt) {
  const R = 60 + w.level * 14;
  w.R = R;
  w.tick = (w.tick || 0) - dt;
  if (w.tick > 0) return;
  w.tick = 0.4;
  const dmg = (0.5 + w.level * 0.4) * curDmg();
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    const dx = e.x - player.x, dy = e.y - player.y;
    const rr = R + e.r;
    if (dx * dx + dy * dy < rr * rr) {
      applyDamageToEnemy(e, dmg, bonusArmor()); e.hitFlash = 0.06;
      if (e.hp <= 0) killEnemy(j);
    }
  }
}

/* ==================== 原子吐息 ==================== */
function updateAtomBreath(w, dt) {
  w.beam = true;
  w.beamTick = (w.beamTick || 0) - dt;
  if (w.beamTick > 0) return;
  w.beamTick = 0.045;
  const lv = w.level;
  const width = 56 + lv * 3.9;
  const reach = player.y + 20;
  const damagePerSecond = fusionDamageRaw(w, 28, 10.2) * curDmg();
  const damageStep = damagePerSecond * w.beamTick;
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (!e || (e.type === 'boss' && e.intro > 0) || e.y >= reach) continue;
    if (Math.abs(e.x - player.x) < width + e.r) {
      applyDamageToEnemy(e, damageStep, fusionPen(w, lv));
      e.hitFlash = 0.05;
      if (e.hp <= 0) killEnemy(j);
    }
  }
}

/* ==================== 天元突破 ==================== */
function updateTenyuan(w, dt) {
  w.beam = true;
  w.tick = (w.tick || 0) - dt;
  if (w.tick > 0) return;
  w.tick = 0.02; // 超高帧伤：50 次/秒判定
  const lv = w.level;
  const topY = 18, baseY = player.y - 28;
  const reach = baseY - topY;
  const halfW = 18 + lv * 1.9;
  const dps = fusionDamageRaw(w, 160, 46) * curDmg();
  const slow = Math.max(0.18, 0.72 - lv * 0.035);
  const paths = [0];

  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (!e || (e.type === 'boss' && e.intro > 0)) continue;
    if (e.y > baseY + 30 || e.y < topY - 30) continue;
    const t = clamp((baseY - e.y) / reach, 0, 1);
    let hit = false;
    for (let p = 0; p < paths.length; p++) {
      const side = paths[p];
      const pathX = player.x + side * t * (62 + lv * 5.5);
      if (Math.abs(e.x - pathX) < halfW + e.r) { hit = true; break; }
    }
    if (hit) {
      applyDamageToEnemy(e, dps * 0.02, fusionPen(w, lv));
      e.hitFlash = 0.08;
      e.slowUntil = time + 0.12;
      e.slowFactor = Math.min(e.slowFactor || 1, slow);
      if (Math.random() < 0.22) addSparks(e.x, e.y, 3);
      if (e.hp <= 0) killEnemy(j);
    }
  }
  w.sfxTick = (w.sfxTick || 0) - 0.02;
  if (w.sfxTick <= 0) {
    w.sfxTick = 0.32;
    sfx('dragon');
  }
}

/* ==================== 镰刀风暴（范围扩大至刀镰 12 级同等） ==================== */
function updateBladeStorm(w, dt) {
  if (!w.blades) w.blades = [];
  const lv = w.level;
  const want = Math.min(10, 4 + Math.floor(lv / 2));
  /* ---- 关键改动：范围与 Lv.12 刀镰相同 ---- */
  const DIST = 74 + lv * 8.8;
  const BLADE_R = 16 + lv * 2.1;
  while (w.blades.length < want) {
    w.blades.push({
      a: Math.random() * Math.PI * 2,
      dist: DIST,
      r: BLADE_R,
      x: player.x, y: player.y
    });
  }
  while (w.blades.length > want) w.blades.pop();

  const spin = 9.5 + lv * 0.45;
  const dmg = fusionDamageRaw(w, 22, 3.8) * curDmg();
  for (let k = 0; k < w.blades.length; k++) {
    const b = w.blades[k];
    b.dist = DIST;
    b.r = BLADE_R;
    b.a += spin * dt;
    b.x = player.x + Math.cos(b.a) * b.dist;
    b.y = player.y + Math.sin(b.a) * b.dist;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e || (e.type === 'boss' && e.intro > 0)) continue;
      if (!circleHit(b, e)) continue;
      if (!e.bladeCd) e.bladeCd = 0;
      if (time - e.bladeCd > 0.07) {
        applyDamageToEnemy(e, dmg, fusionPen(w, lv)); e.hitFlash = 0.08; e.bladeCd = time;
        addSparks(b.x, b.y, 6);
        if (e.hp <= 0) killEnemy(j);
      }
    }
  }
}

/* ==================== 地狱锁链（血红锁链持续吸血） ==================== */
function updateLinkBeam(w, dt) {
  if (!w.links) w.links = [];
  w.tick = (w.tick || 0) - dt;
  w.pulse = (w.pulse || 0) + dt;
  const lv = w.level;
  const range = 255 + lv * 13;
  const maxLinks = Math.min(12, 8 + Math.floor(lv / 3));
  if (w.tick <= 0) {
    w.tick = 0.08;
    const candidates = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e || (e.type === 'boss' && e.intro > 0)) continue;
      const dx = e.x - player.x, dy = e.y - player.y;
      const d2 = dx * dx + dy * dy;
      if (d2 <= range * range) candidates.push({ e, d2 });
    }
    candidates.sort(function (a, b) { return a.d2 - b.d2; });
    w.links = candidates.slice(0, maxLinks).map(function (x) { return x.e; });
  }
  const tickDamage = fusionDamageRaw(w, 2.45, 0.82) * curDmg() * dt;
  const drainRatio = Math.min(0.98, (0.62 + lv * 0.025) * bonusVamp());
  for (let i = w.links.length - 1; i >= 0; i--) {
    const e = w.links[i];
    if (!e || !enemies.includes(e)) { w.links.splice(i, 1); continue; }
    const dx = e.x - player.x, dy = e.y - player.y;
    if (dx * dx + dy * dy > range * range) { w.links.splice(i, 1); continue; }
    applyDamageToEnemy(e, tickDamage, fusionPen(w, lv));
    e.hitFlash = 0.035;
    player.hp = Math.min(player.maxHp, player.hp + tickDamage * drainRatio);
    if (e.hp <= 0) killEnemy(enemies.indexOf(e));
  }
}

function updateWeapons(dt) {
  const rapid = (player.buffs.rapid > 0 ? 0.55 : 1) * bonusFireRate();
  for (let i = 0; i < player.weapons.length; i++) {
    const w = player.weapons[i];
    if (w.key === 'saw')        { updateSaw(w, dt); continue; }
    if (w.key === 'scythe')    { updateScythe(w, dt); continue; }
    if (w.key === 'aura')      { updateAura(w, dt); continue; }
    if (w.key === 'atombreath') { updateAtomBreath(w, dt); continue; }
    if (w.key === 'linkbeam') { updateLinkBeam(w, dt); continue; }
    if (w.key === 'tenyuan') { updateTenyuan(w, dt); continue; }
    if (w.key === 'bladestorm') { updateBladeStorm(w, dt); continue; }

    w.cd -= dt;
    if (w.cd <= 0) {
      fireWeapon(w);
      if (w.key === 'laser' && w.level >= 12) {
        sfx('lasercannon');
        w.cd = 1.6;
      } else {
        if (w.key !== 'littleboy' && w.key !== 'fatman' && w.key !== 'nukepiece') {
          sfx('shoot');
        }
        w.cd = WEAPON_CD[w.key] * rapid * Math.max(0.6, 1 - w.level * 0.035);
      }
    }
  }
}

/* ==================== 敌方模拟战机 ==================== */
function spawnEnemySim() {
  enemySims.push({
    x: clamp(player.x + rand(-150, 150), 50, W - 50),
    y: -80, vx: rand(-30, 30), vy: rand(50, 90),
    t: 0, life: 22, maxLife: 22, cd: {}, spiralAngle: 0,
    hovered: false, hoverY: rand(90, 200), alpha: 0
  });
  toast = { text: '敌方模拟战机', sub: '携带着你的技能来袭', timer: 1.8, color: '#ff9090' };
  sfx('ghost');
}

function fireEnemySimWeapon(g, w) {
  const lv = w.level;
  const bx = g.x, by = g.y + 22;
  const dmgScale = 0.6 + Math.max(0, player.level - 20) * 0.08;
  const aimAngle = Math.atan2(player.y - by, player.x - bx);

  switch (w.key) {
    case 'mg': {
      const n = Math.min(4, lv);
      for (let i = 0; i < n; i++) {
        const a = aimAngle + (i - (n - 1) / 2) * 0.08;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 4, dmg: 5 * dmgScale, color: '#ff9090' });
      }
      break;
    }
    case 'laser': {
      const n = Math.min(2, 1 + Math.floor(lv / 6));
      for (let i = 0; i < n; i++) {
        const a = aimAngle + (i - (n - 1) / 2) * 0.05;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, r: 3, dmg: 7 * dmgScale, color: '#ff70ff' });
      }
      break;
    }
    case 'spiral': {
      g.spiralAngle = (g.spiralAngle || 0) + 0.9;
      for (let i = 0; i < 3; i++) {
        const a = aimAngle + Math.sin(g.spiralAngle + i * 0.7) * 0.4;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * 340, vy: Math.sin(a) * 340, r: 4, dmg: 4 * dmgScale, color: '#b8ffb8' });
      }
      break;
    }
    case 'spread': {
      const n = Math.min(5, 3 + Math.floor(lv * 0.25));
      for (let i = 0; i < n; i++) {
        const a = aimAngle + (i - (n - 1) / 2) * 0.14;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, r: 5, dmg: 5 * dmgScale, color: '#ffd24a' });
      }
      break;
    }
    case 'homing': {
      for (let i = 0; i < 2; i++) {
        const a = aimAngle + (i - 0.5) * 0.4;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 5, dmg: 7 * dmgScale, color: '#7fd1ff', homing: true, homingTarget: 'player' });
      }
      break;
    }
    case 'boomer': {
      for (let i = 0; i < 2; i++) {
        const a = aimAngle + (i - 0.5) * 0.5;
        ebullets.push({ x: bx, y: by, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 8, dmg: 8 * dmgScale, color: '#c08aff' });
      }
      break;
    }
  }
}

function updateEnemySims(dt) {
  if (player.level >= 20) {
    enemySimTimer -= dt;
    if (enemySimTimer <= 0 && enemySims.length < 3) {
      spawnEnemySim();
      enemySimTimer = rand(9, 16);
    }
  }
  for (let i = enemySims.length - 1; i >= 0; i--) {
    const g = enemySims[i];
    g.t += dt;
    g.life -= dt;
    const fadeIn = Math.min(1, g.t * 2);
    const fadeOut = Math.min(1, Math.max(0, g.life * 1.5));
    g.alpha = 0.95 * fadeIn * fadeOut;
    if (!g.hovered) {
      g.y += g.vy * dt;
      g.x += g.vx * dt;
      if (g.y >= g.hoverY) g.hovered = true;
    } else {
      g.x += Math.sin(g.t * 1.6 + i) * 90 * dt;
      g.y += Math.cos(g.t * 1.2 + i) * 25 * dt;
    }
    g.x = clamp(g.x, 40, W - 40);
    g.y = clamp(g.y, 60, H - 200);
    for (let wi = 0; wi < player.weapons.length; wi++) {
      const w = player.weapons[wi];
      if (['saw','scythe','aura','atombreath','linkbeam','littleboy','fatman','nukepiece','tenyuan','bladestorm'].indexOf(w.key) >= 0) continue;
      if (g.cd[w.key] === undefined) g.cd[w.key] = rand(0.2, 0.8);
      g.cd[w.key] -= dt;
      if (g.cd[w.key] <= 0) {
        fireEnemySimWeapon(g, w);
        g.cd[w.key] = WEAPON_CD[w.key] * 1.7;
      }
    }
    if (g.life <= 0) {
      addExplosion(g.x, g.y, 16, '#ff8080', 0.85);
      enemySims.splice(i, 1);
    }
  }
}

/* ==================== 粒子 ==================== */
function addExplosion(x, y, count, color, scale) {
  const room = MAX_PARTICLES - particles.length;
  if (room <= 0) return;
  count = Math.min(count, room);
  scale = scale || 1;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(40, 290) * scale;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.8), max: 0.8, r: rand(1.5, 4.5), color });
  }
}
function addSparks(x, y, count) {
  const room = MAX_PARTICLES - particles.length;
  if (room <= 0) return;
  count = Math.min(count, room);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(30, 130);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.1, 0.3), max: 0.3, r: rand(1, 2.5), color: '#bff6ff' });
  }
}

const ELITE_TYPES = ['gunner', 'tank', 'swift', 'guardian'];
function makeElite(e) {
  const t = ELITE_TYPES[Math.floor(Math.random() * ELITE_TYPES.length)];
  e.isElite = true;
  e.elite = t;
  if (t === 'gunner') { e.r *= 1.25; e.hp = Math.ceil(e.hp * 2.4); e.shootInterval *= 0.62; e.eliteColor = '#ffb03a'; e.eliteName = '精英·枪手'; }
  else if (t === 'tank') { e.r *= 1.5; e.armor = Math.min(0.65, (e.armor || 0) + 0.16); e.hp = Math.ceil(e.hp * 3.8); e.vy *= 0.72; e.shootInterval *= 1.25; e.eliteColor = '#a0ffb0'; e.eliteName = '精英·重装'; }
  else if (t === 'swift') { e.r *= 1.15; e.hp = Math.ceil(e.hp * 1.8); e.vy *= 1.45; e.vx = (e.vx || 0) * 1.6; e.shootInterval *= 0.55; e.eliteColor = '#ff5aff'; e.eliteName = '精英·迅捷'; }
  else { e.r *= 1.4; e.hp = Math.ceil(e.hp * 3.0); e.shootInterval *= 0.9; e.eliteColor = '#8fe3ff'; e.eliteName = '精英·守护'; }
  e.maxHp = e.hp; e.score *= 3; e.xpv *= 4;
}

/* ==================== 敌机 ==================== */
function findNearestEnemy(x, y, exclude) {
  let target = null, best = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e === exclude) continue;
    const dx = e.x - x, dy = e.y - y;
    const d = dx * dx + dy * dy;
    if (d < best) { best = d; target = e; }
  }
  return target;
}

function spawnEnemy() {
  if (enemies.length > MAX_ENEMIES - 1) return;
  const d = difficulty, dm = currentDiff;
  const sc = getEnemyScale();
  const r = Math.random();
  let type;
  if (r < 0.62 - d * 0.26)      type = 'small';
  else if (r < 0.90 - d * 0.05) type = 'medium';
  else                          type = 'heavy';

  const e = {
    type, x: rand(50, W - 50), y: -60,
    vx: 0, vy: 0, t: 0, hitFlash: 0, bladeCd: 0,
    shootCd: rand(0.5, 1.6), shootInterval: 2,
    behavior: 'straight', hoverY: 200, isElite: false, rotAngle: Math.PI,
    armor: 0
  };

  if (type === 'small') {
    e.r = 12;
    e.armor = 0.02;
    e.hp = Math.ceil(1.4 * (1 + d * 0.5) * dm.hp * sc.hp);
    e.vy = (rand(110, 165) + d * 40) * dm.speed;
    e.vx = rand(-45, 45);
    e.score = 10; e.xpv = 1;
    e.shootInterval = rand(1.6, 3.0);
    e.behavior = Math.random() < 0.5 ? 'sine' : 'straight';
    e.modelForm = 'base'; e.modelScale = 0.55;
  } else if (type === 'medium') {
    e.r = 20;
    e.armor = 0.08;
    e.hp = Math.ceil(5.5 * (1 + d * 0.6) * dm.hp * sc.hp);
    e.vy = (rand(70, 105) + d * 25) * dm.speed;
    e.vx = rand(-55, 55);
    e.score = 30; e.xpv = 3;
    e.shootInterval = rand(1.2, 2.0);
    e.behavior = Math.random() < 0.4 ? 'hover' : 'straight';
    e.hoverY = rand(120, 300);
    e.modelForm = 'elite'; e.modelScale = 0.8;
  } else {
    e.r = 30;
    e.armor = 0.20;
    e.hp = Math.ceil(16 * (1 + d * 0.65) * dm.hp * sc.hp);
    e.vy = (rand(45, 68) + d * 15) * dm.speed;
    e.vx = rand(-30, 30);
    e.score = 80; e.xpv = 8;
    e.shootInterval = rand(1.4, 2.2);
    e.behavior = 'straight';
    e.modelForm = 'advanced'; e.modelScale = 1.1;
  }
  e.maxHp = e.hp;

  const eliteChance = 0.04 + d * 0.07;
  if (Math.random() < eliteChance && enemies.length < MAX_ENEMIES - 2) makeElite(e);
  enemies.push(e);

  if (d > 0.65 && Math.random() < 0.34 && enemies.length < MAX_ENEMIES - 2) {
    const e2 = Object.assign({}, e);
    e2.x = clamp(e.x + rand(-70, 70), 40, W - 40);
    e2.y = e.y - rand(30, 80);
    e2.hp = e2.maxHp = e.maxHp;
    e2.shootCd = rand(0.5, 1.6);
    e2.bladeCd = 0;
    if (!e2.isElite && Math.random() < eliteChance * 0.5) makeElite(e2);
    enemies.push(e2);
  }
}

function makeEB(x, y, angle, speed, dmg, color) {
  if (ebullets.length >= MAX_ENEMY_BULLETS) return null;
  const sc = getEnemyScale();
  return {
    x, y,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: 6, dmg: dmg * (currentDiff.dmgMul || 1) * sc.dmg,
    color: color || '#ff4d6d'
  };
}
function pushEB(x, y, angle, speed, dmg, color) {
  const b = makeEB(x, y, angle, speed, dmg, color);
  if (b) ebullets.push(b);
}

function enemyShoot(e) {
  if (ebullets.length >= MAX_ENEMY_BULLETS - 8) return;
  const sm = currentDiff.speed * (e.enraged ? 1.18 : 1);
  const base = Math.atan2(player.y - e.y, player.x - e.x);

  if (e.isElite) {
    if (e.elite === 'gunner') for (let i = -2; i <= 2; i++) pushEB(e.x, e.y + 16, base + i * 0.18, 240 * sm, 6, e.eliteColor);
    else if (e.elite === 'tank') for (let i = -1; i <= 1; i++) pushEB(e.x, e.y + 22, base + i * 0.14, 300 * sm, 8, e.eliteColor);
    else if (e.elite === 'swift') pushEB(e.x, e.y + 12, base, 380 * sm, 6, e.eliteColor);
    else for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + e.t * 1.2; pushEB(e.x, e.y, a, 150 * sm, 6, e.eliteColor); }
    return;
  }

  if (e.type === 'boss') {
    const zi = e.zodiacIdx || 0;
    const grp = zi % 4;
    if (grp === 0) {
      for (let i=-6;i<=6;i++) pushEB(e.x,e.y+44,base+i*0.11,235*sm,8,e.bossAccent);
      for (let i=0;i<10;i++) { const a=i*Math.PI/5+e.t*0.35; pushEB(e.x,e.y,a,155*sm,6,e.bossAccent); }
      pushEB(e.x, e.y + 30, base, 400*sm, 10, e.bossColor);
    } else if (grp === 1) {
      for (let i=0;i<15;i++) { const a=i*Math.PI*2/15 + e.t*1.2; pushEB(e.x,e.y,a,175*sm,7,e.bossAccent); }
      pushEB(e.x,e.y,base,360*sm,10,e.bossColor);
      for (let i=0;i<8;i++) { const a=i*Math.PI/4 - e.t*1.6; pushEB(e.x,e.y,a,220*sm,7,e.bossAccent); }
    } else if (grp === 2) {
      for (let i=-2;i<=2;i++) pushEB(e.x,e.y+42,base+i*0.24,265*sm,10,e.bossAccent);
      for (let i=0;i<8;i++) { const a=i*Math.PI/4 + 0.392; pushEB(e.x,e.y,a,125*sm,9,e.bossColor); }
      pushEB(e.x, e.y + 20, base + 0.08, 420*sm, 11, e.bossAccent);
      pushEB(e.x, e.y + 20, base - 0.08, 420*sm, 11, e.bossAccent);
    } else {
      for (let i=0;i<9;i++) { const a=base + (i-4)*0.14; pushEB(e.x,e.y,a,215*sm,8,e.bossAccent); }
      pushEB(e.x, e.y, base + Math.sin(e.t * 3) * 0.18, 430*sm, 11, e.bossColor);
      for (let i=0;i<10;i++) { const a=i*Math.PI/5 + e.t*0.8; pushEB(e.x,e.y,a,140*sm,7,e.bossColor); }
    }
    return;
  }

  if (e.type === 'heavy') for (let i=-1;i<=1;i++) pushEB(e.x,e.y+20,base+i*0.24,235*sm,8,'#c07aff');
  else if (e.type === 'medium') pushEB(e.x,e.y+16,base+rand(-0.1,0.1),255*sm,6,'#ffb03a');
  else pushEB(e.x,e.y+12,base+rand(-0.2,0.2),240*sm,5,'#ff5a8a');
}

/* ==================== 掉落 ==================== */
const PICKS = [
  { k:'heal',   w:30, color:'#ff9ad5', label:'+' },
  { k:'bomb',   w:16, color:'#ff6b6b', label:'B' },
  { k:'shield', w:20, color:'#5ad1ff', label:'S' },
  { k:'bounce', w:24, color:'#a0ffb0', label:'R' },
  { k:'rage',   w:18, color:'#ff8a4a', label:'X' },
  { k:'rapid',  w:18, color:'#ffd24a', label:'F' }
];
const TREASURE_PICK = { k:'treasure', color:'#ffd84d', label:'宝' };
const PICK_TOTAL = PICKS.reduce(function (s, p) { return s + p.w; }, 0);
function randomPick() {
  let r = Math.random() * PICK_TOTAL;
  for (let i = 0; i < PICKS.length; i++) { r -= PICKS[i].w; if (r <= 0) return PICKS[i]; }
  return PICKS[0];
}
function spawnPickup(x, y, force) {
  if (debugNoDrops) return; // 调试开关开启时不生成任何掉落物
  pickups.push({ x, y, vy: 76, r: 15, t: 0, p: force || randomPick() });
}
function chooseTreasureRewardCount() {
  const r = Math.random();
  if (r < 0.62) return 1;
  if (r < 0.90) return 3;
  return 5;
}
function openTreasureRewards(count) {
  treasureRewardsRemaining = count;
  treasureRewardsTotal = count;
  state = 'levelup';
  levelChoices = buildChoices();

}
function applyPickup(p) {
  sfx('pickup');
  const k = p.k;
  if (k === 'treasure') openTreasureRewards(chooseTreasureRewardCount());
  else if (k === 'heal') player.hp = Math.min(player.maxHp, player.hp + 25);
  else if (k === 'bomb') player.bombs = Math.min(9, player.bombs + 1);
  else if (k === 'shield') player.shield = Math.min(12, player.shield + 6 + bonusShield());

function maybeDrop(e) {

/* ==================== 炸弹 ==================== */
function useBomb() {
  if (state !== 'playing' || player.bombs <= 0) return;
  player.bombs--;
  sfx('bigboom');
  for (let i = 0; i < ebullets.length; i++) addExplosion(ebullets[i].x, ebullets[i].y, 3, '#ffee88', 0.5);
  ebullets.length = 0;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 30; e.hitFlash = 0.15;
    if (e.hp <= 0) killEnemy(i);
  }
  for (let i = enemySims.length - 1; i >= 0; i--) {
    const g = enemySims[i];
    g.life -= 8;
    if (g.life <= 0) { addExplosion(g.x, g.y, 20, '#ff8080', 1); enemySims.splice(i, 1); }
  }
  bombRings.push({ x: player.x, y: player.y, r: 0, life: 0.55, max: 0.55 });
  flash = 0.6; shake = 14;
}

/* ==================== 击杀 ==================== */
function killEnemy(idx) {
  const e = enemies[idx];
  if (!e) return;
  enemies.splice(idx, 1);
  player.combo++;
  player.comboTimer = 2.2;
  const mult = 1 + Math.min(player.combo / 10, 2.5);
  score += Math.floor(e.score * mult * currentDiff.scoreMul);

  const isBoss = e.type === 'boss';
  addExplosion(e.x, e.y, isBoss ? 70 : (e.type === 'heavy' ? 30 : 15), isBoss ? '#ffd36b' : '#ffb03a', isBoss ? 2.0 : 1);
  shake = Math.max(shake, isBoss ? 16 : (e.type === 'heavy' ? 6 : 3));
  sfx('explode');

  if (!debugNoDrops) {
    orbs.push({
      x: e.x, y: e.y,
      vx: rand(-50, 50), vy: rand(-70, -20),
      val: Math.max(1, Math.round((e.xpv || 1) * 1.05 * currentDiff.xpMul)),
      t: 0, r: 4 + Math.min(7, (e.xpv || 1) * 0.5)
    });
  }

  if (isBoss) {
    spawnPickup(e.x - 50, e.y, PICKS[3]);
    spawnPickup(e.x,      e.y, PICKS[0]);
    spawnPickup(e.x + 50, e.y, PICKS[1]);
    spawnPickup(e.x, e.y - 40, PICKS[2]);
    spawnPickup(e.x, e.y - 68, TREASURE_PICK);
    flash = 0.5;
  } else if (e.isElite) {
    spawnPickup(e.x, e.y, PICKS[Math.floor(Math.random() * PICKS.length)]);
  } else {
    maybeDrop(e);
  }
}

/* ==================== 玩家受伤 ==================== */
function damagePlayer(dmg) {
  if (player.invuln > 0) return;
  if (player.shield > 0) {
    player.shield = Math.max(0, player.shield - 2.5);
    player.invuln = 0.5;
    addExplosion(player.x, player.y, 10, '#6ce8ff', 0.8);
    return;
  }
  const finalDmg = dmg * (currentDiff.dmgMul || 1) * (1 - bonusDR());
  player.hp -= finalDmg;
  player.invuln = 1.2;
  addExplosion(player.x, player.y, 16, '#ff9a5a');
  shake = Math.max(shake, 10);
  sfx('hit');
  player.combo = 0; player.comboTimer = 0;
  if (player.hp <= 0) { player.hp = 0; gameOver(); }
}

function gameOver() {
  state = 'gameover';
  touchCtrl.active = false; touchCtrl.id = null;
  addExplosion(player.x, player.y, 50, '#ffd36b', 1.6);
  shake = 20;
  sfx('over');
  gainCoins = Math.floor(score / 80 * bonusCoin());
  SAVE.coins += gainCoins;
  if (score > SAVE.best) SAVE.best = score;
  persist();
}

/* ==================== 经验 / 升级 ==================== */
function gainXp(v) {
  if (debugNoDrops) return; // 调试屏蔽时不积累经验，避免升级三选一打断测试
  const oldLevel = player.level;
  player.xp += v * XP_GAIN_MUL * bonusXp();
  let leveled = false;
  while (player.xp >= player.xpNeed) {
    player.xp -= player.xpNeed;
    player.level++;
    player.xpNeed = xpNeedFor(player.level);
    pendingLevels++;
    leveled = true;
  }
  if (oldLevel < 20 && player.level >= 20) {
    toast = { text: '20 级 · 第一次进化', sub: '模拟战机来袭 · 敌方强化', timer: 2.8, color: '#ffd24a' };
    player.evolveFlash = 1.5; flash = Math.max(flash, 0.35);
    sfx('evolution');
    addExplosion(player.x, player.y, 30, '#ffe066', 1.4);
    enemySimTimer = 4;
  }
  if (oldLevel < 30 && player.level >= 30) {
    toast = { text: '30 级 · 第二次进化', sub: '进阶形态 · 紫电装甲', timer: 2.8, color: '#ff8af0' };
    player.evolveFlash = 1.6; flash = Math.max(flash, 0.4);
    sfx('evolution');
    addExplosion(player.x, player.y, 34, '#ff8af0', 1.4);
  }
  if (oldLevel < 40 && player.level >= 40) {
    toast = { text: '40 级 · 机甲形态', sub: '变形金刚 · 机械战士', timer: 3.2, color: '#a0ffa0' };
    player.evolveFlash = 1.8; flash = Math.max(flash, 0.5);
    sfx('evolution');
    addExplosion(player.x, player.y, 40, '#a0ffa0', 1.5);
  }
  if (oldLevel < 50 && player.level >= 50) {
    toast = { text: '50 级 · 超级赛博机器人', sub: '多重装甲 · 能量炮塔', timer: 3.4, color: '#7fffff' };
    player.evolveFlash = 2.0; flash = Math.max(flash, 0.55);
    sfx('cyber');
    addExplosion(player.x, player.y, 50, '#7fffff', 1.6);
  }
  if (oldLevel < 100 && player.level >= 100) {
    toast = { text: '100 级 · 终极进化', sub: '超超超级赛博进化人', timer: 4.0, color: '#ffd24a' };
    player.evolveFlash = 2.4; flash = Math.max(flash, 0.7);
    sfx('ascend');
    addExplosion(player.x, player.y, 70, '#ffd24a', 1.8);
  }
  if (leveled && state === 'playing') openLevelUp();
}

function buildChoices() {
  const pool = [];
  const owned = {};
  player.weapons.forEach(function (w) { owned[w.key] = w; });
  if (player.weapons.length < MAX_SLOTS) {
    for (const k in WEAPON_DEFS) {
      if (FUSION_KEYS.indexOf(k) >= 0) continue;
      if (!owned[k] && !fusedWeaponLocks[k]) pool.push({ kind: 'new', key: k, w: 110 });
    }
  }
  player.weapons.forEach(function (w) {
    if (w.level < WEAPON_DEFS[w.key].max) pool.push({ kind: 'up', key: w.key, w: 100 });
  });
  if (player.hp < player.maxHp) pool.push({ kind: 'heal', w: 72 });
  pool.push({ kind: 'maxhp',  w: 52 });
  pool.push({ kind: 'bomb',   w: 40 });
  if (player.shield <= 0) pool.push({ kind: 'shield', w: 46 });
  pool.push({ kind: 'speed',  w: 40 });
  pool.push({ kind: 'magnet', w: 36 });

  const has = function (key) { return player.weapons.some(function (w) { return w.key === key && w.level >= 12; }); };
  const hasAny = function (key) { return player.weapons.some(function (w) { return w.key === key; }); };
  const fusions = [];

  if (has('littleboy') && has('fatman') && !hasAny('nukepiece'))
    fusions.push({ kind: 'fuse', key: 'nukepiece', w: 999 });
  if (has('mg') && has('scythe') && !hasAny('judgment'))
    fusions.push({ kind: 'fuse', key: 'judgment', w: 1000 });
  if (has('laser') && has('spread') && !hasAny('atombreath'))
    fusions.push({ kind: 'fuse', key: 'atombreath', w: 1001 });
  if (has('aura') && has('homing') && !hasAny('linkbeam'))
    fusions.push({ kind: 'fuse', key: 'linkbeam', w: 1002 });
  if (has('saw') && has('mg') && !hasAny('tenyuan'))
    fusions.push({ kind: 'fuse', key: 'tenyuan', w: 1100 });
  if (has('boomer') && has('scythe') && !hasAny('bladestorm'))
    fusions.push({ kind: 'fuse', key: 'bladestorm', w: 1101 });

  fusions.forEach(function (f) { pool.push(f); });

  const picks = [];
  const p = pool.slice();
  while (picks.length < 3 && p.length) {
    let total = 0;
    for (let i = 0; i < p.length; i++) total += p[i].w;
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < p.length; i++) { r -= p[i].w; if (r <= 0) { idx = i; break; } }
    picks.push(p.splice(idx, 1)[0]);
  }
  return picks;
}

/* ==================== 主更新 ==================== */
function updateGame(dt) {
  difficulty = Math.min(2.2, score / 1400);
  const follow = mobileMode ? 0.5 : 0.72;
  const k = 1 - Math.pow(follow, dt * 60 * player.spd);
  player.x += (player.tx - player.x) * k;
  player.y += (player.ty - player.y) * k;
  player.x = clamp(player.x, player.r + 8, W - player.r - 8);
  player.y = clamp(player.y, player.r + 8, H - player.r - 8);

  if (player.invuln > 0) player.invuln -= dt;
  if (player.shield > 0) player.shield -= dt;
  if (player.comboTimer > 0) { player.comboTimer -= dt; if (player.comboTimer <= 0) player.combo = 0; }
  if (bonusRegen() > 0 && player.hp > 0) player.hp = Math.min(player.maxHp, player.hp + bonusRegen() * dt);
  for (const k2 in player.buffs) if (player.buffs[k2] > 0) player.buffs[k2] -= dt;
  if (player.evolveFlash > 0) player.evolveFlash -= dt;
  if (toast) { toast.timer -= dt; if (toast.timer <= 0) toast = null; }
  if (btnFlash) { btnFlash.timer -= dt; if (btnFlash.timer <= 0) btnFlash = null; }
  if (peaceBannerTimer > 0) peaceBannerTimer -= dt;

  /* ---- 胖子 Lv.12：弹出「日本投降」事件（每次游戏仅一次） ---- */
  if (!fatmanSurrenderShown &&
      player.weapons.some(function (w) { return w.key === 'fatman' && w.level >= 12; })) {
    fatmanSurrenderShown = true;
    toast = { text: '日本无条件投降！', sub: '远离帝国主义 · 世界和平万岁', timer: 3.5, color: '#ffd24a' };
    flash = Math.max(flash, 0.3);
    sfx('peace');
  }

  updateWeapons(dt);
  updateEnemySims(dt);
  updateLightningBolts(dt);

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    const sc = getEnemyScale();
    const base = Math.max(0.22, (0.70 - difficulty * 0.22)) * currentDiff.spawn / sc.count;
    spawnTimer = base * rand(0.7, 1.35);
  }

  const hasBoss = enemies.some(function (e) { return e.type === 'boss'; });
  if (!hasBoss) {
    bossTimer -= dt;
    if (bossTimer > 0 && bossTimer < 3 && Math.floor(bossTimer * 2) !== Math.floor((bossTimer + dt) * 2)) sfx('warn');
    if (bossTimer <= 0) { spawnBoss(); bossTimer = 45 + rand(0, 15); }
  }

  updateBullets(dt);
  updateEnemies(dt);
  updateEnemyBullets(dt);
  updatePickups(dt);
  updateOrbs(dt);

  for (let i = bombRings.length - 1; i >= 0; i--) {
    const r = bombRings[i];
    r.life -= dt;
    const maxR = r.maxR || 620;
    r.r = (1 - r.life / r.max) * maxR;
    if (r.life <= 0) bombRings.splice(i, 1);
  }
  handleCollisions(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.cool > 0) b.cool -= dt;

    if (b.laserCannon) {
      b.x = player.x;
      b.y = player.y - 22;
      b.life -= dt;
      if (b.life <= 0) bullets.splice(i, 1);
      continue;
    }

    if (b.fireball && Math.random() < 0.65) {
      const room = MAX_PARTICLES - particles.length;
      if (room > 0) {
        particles.push({
          x: b.x + (Math.random() - 0.5) * 8,
          y: b.y + 6,
          vx: (Math.random() - 0.5) * 40,
          vy: 25 + Math.random() * 40,
          life: 0.35, max: 0.35,
          r: 2 + Math.random() * 2.2,
          color: Math.random() < 0.5 ? '#ff6020' : '#ffd060'
        });
      }
    }

    if (b.homing) {
      const t = findNearestEnemy(b.x, b.y);
      if (t) {
        const sp = Math.hypot(b.vx, b.vy) || 400;
        const ca = Math.atan2(b.vy, b.vx);
        let da = Math.atan2(t.y - b.y, t.x - b.x) - ca;
        while (da > Math.PI) da -= 6.283185;
        while (da < -Math.PI) da += 6.283185;
        const na = ca + clamp(da, -5 * dt, 5 * dt);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }
    if (b.boomer) {
      b.bt += dt;
      if (b.bt > 0.5) {
        const a = Math.atan2(player.y - b.y, player.x - b.x);
        const sp = 660;
        b.vx += (Math.cos(a) * sp - b.vx) * Math.min(1, dt * 6);
        b.vy += (Math.sin(a) * sp - b.vy) * Math.min(1, dt * 6);
        if (b.bt > 0.75 && Math.hypot(b.x - player.x, b.y - player.y) < 28) { bullets.splice(i, 1); continue; }
      }
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.rot) b.angle += dt * (b.sword ? 16 : 12);
    if (b.bounces > 0) {
      if (b.x - b.r < 0)      { b.x = b.r;     b.vx = Math.abs(b.vx);  b.bounces--; }
      else if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); b.bounces--; }
      if (b.y - b.r < 0)      { b.y = b.r;     b.vy = Math.abs(b.vy);  b.bounces--; }
      else if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy); b.bounces--; }
    }
    if (b.x < -90 || b.x > W + 90 || b.y < -140 || b.y > H + 90 || b.life <= 0) bullets.splice(i, 1);
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const slowMul = (e.slowUntil && e.slowUntil > time) ? (e.slowFactor || 1) : 1;

    if (e.type === 'boss') {
      const hpRatio = e.hp / e.maxHp;
      if (!e.enraged && hpRatio < 0.50) {
        e.enraged = true; e.phase = 2; e.vx *= 1.35; e.shootInterval *= 0.7;
        toast = { text:'BOSS 狂暴阶段', sub:e.bossName + ' 进入第二阶段', timer:1.8, color:e.bossAccent };
        flash = Math.max(flash,0.15);
        for (let q=0;q<18;q++) { const a=q*Math.PI*2/18; pushEB(e.x,e.y,a,150*currentDiff.speed,8,e.bossAccent); }
      }
      if (e.intro > 0) {
        e.intro -= dt;
        const prog = clamp(1 - e.intro / e.introTotal, 0, 1);
        const ease = 1 - Math.pow(1 - prog, 3);
        e.y = -160 + 278 * ease;
        e.hovering = false;
        e.shootCd = Math.max(e.shootCd, 0.35);
      } else if (!e.hovering) {
        e.y += e.vy * dt * slowMul;
        if (e.y >= 118) { e.y = 118; e.hovering = true; }
      } else {
        if (e.zodiacIdx === 2 && e.dashCd <= 0) {
          e.vx = (player.x < e.x ? -1 : 1) * (260 + (e.enraged?100:0));
          e.y += Math.sin(e.t*4)*35*dt*slowMul;
          e.dashCd = e.enraged ? 3.8 : 5.5;
        } else {
          e.x += e.vx * dt * slowMul;
        }
        if (e.x < 90) { e.x=90; e.vx=Math.abs(e.vx); }
        if (e.x > W-90) { e.x=W-90; e.vx=-Math.abs(e.vx); }
        if (e.zodiacIdx === 6) e.y = 118 + Math.sin(e.t*2.2)*28;
        else if (e.zodiacIdx === 4) e.y = 128 + Math.sin(e.t*1.4)*20;
        else e.y = 118 + Math.sin(e.t*1.2)*12;
      }
      if (e.intro > 0) continue;
      e.skillCd -= dt; e.summonCd -= dt; e.dashCd -= dt;
      if (e.skillCd <= 0) {
        const zi = e.zodiacIdx || 0;
        const grp = zi % 4;
        if (grp === 0) {
          for (let q=0;q<22;q++) { const a=q*Math.PI*2/22 + e.t*0.8; pushEB(e.x,e.y,a,120*currentDiff.speed,8,e.bossColor); }
        } else if (grp === 1) {
          for (let q=0;q<6;q++) { const px=clamp(player.x+rand(-120,120),30,W-30); pushEB(px,92+q*18,Math.PI/2,80*currentDiff.speed,11,e.bossAccent); }
        } else if (grp === 2) {
          for (let q=0;q<5;q++) pushEB(e.x,e.y,Math.atan2(player.y-e.y,player.x-e.x)+(q-2)*0.34,330*currentDiff.speed,12,e.bossAccent);
        } else {
          for (let q=0;q<18;q++) { const a=q*Math.PI*2/18 + e.t*0.3; pushEB(e.x,e.y,a,145*currentDiff.speed,7,e.bossAccent); }
        }
        e.skillCd = e.enraged ? 2.2 : 3.5;
      }
      if (e.summonCd <= 0 && enemies.length < MAX_ENEMIES - 3) {
        for (let q=0;q<(e.enraged?3:2);q++) spawnEnemy();
        e.summonCd = e.enraged ? 6 : 9;
      }
    } else {
      if (e.behavior === 'sine') { e.x += (e.vx * slowMul + Math.sin(e.t * 4) * 70) * dt; e.y += e.vy * dt * slowMul; }
      else if (e.behavior === 'hover') { if (e.y < e.hoverY) e.y += e.vy * dt * slowMul; else e.x += Math.sin(e.t * 1.6) * 60 * dt * slowMul; }
      else { e.x += e.vx * dt * slowMul; e.y += e.vy * dt * slowMul; }
      if (e.x < e.r)     { e.x = e.r;     e.vx = Math.abs(e.vx); }
      if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); }
    }
    if (e.y > 0 && e.y < H - 60) {
      e.shootCd -= dt;
      if (e.shootCd <= 0) { enemyShoot(e); e.shootCd = e.shootInterval * rand(0.75, 1.25); }
    }
    if (e.y > H + 90 || e.x < -140 || e.x > W + 140) enemies.splice(i, 1);
  }
}

function updateEnemyBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (b.homing && b.homingTarget === 'player') {
      const sp = Math.hypot(b.vx, b.vy) || 260;
      const ca = Math.atan2(b.vy, b.vx);
      let da = Math.atan2(player.y - b.y, player.x - b.x) - ca;
      while (da > Math.PI) da -= 6.283185;
      while (da < -Math.PI) da += 6.283185;
      const na = ca + clamp(da, -3 * dt, 3 * dt);
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) ebullets.splice(i, 1);
  }
}

function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt;
    const dx = player.x - p.x, dy = player.y - p.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < 130 * 130) {
      const d = Math.sqrt(d2) || 1;
      const pull = 340 * dt;
      p.x += (dx / d) * pull; p.y += (dy / d) * pull;
    } else {
      p.y += p.vy * dt;
      p.x += Math.sin(p.t * 2) * 30 * dt;
    }
    if (p.y > H + 40) pickups.splice(i, 1);
  }
}

function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt;
    const dx = player.x - o.x, dy = player.y - o.y;
    const d = Math.hypot(dx, dy) || 1;
    const sp = d < player.magnet ? 460 : 70;
    o.x += (dx / d) * sp * dt;
    o.y += (dy / d) * sp * dt;
    if (d < 20) { orbs.splice(i, 1); gainXp(o.val); }
  }
}

/* ==================== 碰撞 ==================== */
function handleCollisions(dt) {
  /* 激光炮垂直光束持续伤害 */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b || !b.laserCannon) continue;
    b.dmgTick -= dt;
    if (b.dmgTick > 0) continue;
    b.dmgTick = 0.08;
    const halfW = 26;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e || (e.type === 'boss' && e.intro > 0)) continue;
      if (e.x + e.r > b.x - halfW && e.x - e.r < b.x + halfW && e.y - e.r < b.y) {
        applyDamageToEnemy(e, rollWeaponCrit(b.dmg), b.armorPen || bonusArmor());
        e.hitFlash = 0.06;
        addSparks(e.x, e.y, 3);
        if (e.hp <= 0) killEnemy(j);
      }
    }
  }

  /* 普通子弹 vs 敌机 */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b || b.cool > 0 || b.laserCannon) continue;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e || (e.type === 'boss' && e.intro > 0) || !circleHit(b, e)) continue;
      applyDamageToEnemy(e, rollWeaponCrit(b.dmg), b.armorPen || bonusArmor());
      e.hitFlash = 0.08;
      addSparks(b.x, b.y, 3);
      if (b.fireball) {
        for (let f = 0; f < 6; f++) {
          const fa = Math.random() * Math.PI * 2;
          const fs = rand(60, 180);
          particles.push({
            x: e.x, y: e.y,
            vx: Math.cos(fa) * fs, vy: Math.sin(fa) * fs,
            life: 0.4, max: 0.4, r: 2 + Math.random() * 2.5,
            color: Math.random() < 0.5 ? '#ff6020' : '#ffd060'
          });
        }
      }
      if (e.hp <= 0) killEnemy(j);
      if (b.pierce > 0) { b.pierce--; b.cool = 0.05; }
      else if (b.bounces > 0) {
        b.bounces--; b.cool = 0.07;
        const t = findNearestEnemy(b.x, b.y, e);
        const sp = Math.hypot(b.vx, b.vy) || 600;
        if (t) { const a = Math.atan2(t.y - b.y, t.x - b.x); b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; }
        else { b.vx = -b.vx; b.vy = -b.vy; }
      } else { bullets.splice(i, 1); break; }
    }
  }

  /* 子弹 vs 敌方模拟机 */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b || b.cool > 0) continue;
    for (let j = enemySims.length - 1; j >= 0; j--) {
      const g = enemySims[j];
      const hitR = b.laserCannon ? 26 : (b.r + 22);
      if (Math.abs(b.x - g.x) < hitR && b.y - 22 > g.y - 22) {
        g.life -= 0.6;
        addSparks(b.x, b.y, 3);
        if (g.life <= 0) { addExplosion(g.x, g.y, 20, '#ff8080', 1); enemySims.splice(j, 1); }
        if (b.laserCannon) continue;
        if (b.pierce > 0) b.pierce--;
        else { bullets.splice(i, 1); break; }
      }
    }
  }

  /* 子弹 vs 敌弹 */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b || b.laserCannon) continue;
    for (let j = ebullets.length - 1; j >= 0; j--) {
      const eb = ebullets[j];
      if (!circleHit(b, eb)) continue;
      addSparks(eb.x, eb.y, 4);
      score += 2;
      ebullets.splice(j, 1);
      if (b.pierce > 0) b.pierce--;
      else { bullets.splice(i, 1); break; }
    }
  }

  /* 敌机 vs 玩家 */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) continue;
    if (e.type === 'boss' && e.intro > 0) continue;
    if (circleHit(e, player)) {
      const dmg = e.type === 'boss' ? (e.enraged ? 40 : 32) : (e.type === 'heavy' ? 15 : 8);
      damagePlayer(dmg);
      if (e.type !== 'boss') { e.hp -= 20; if (e.hp <= 0) killEnemy(i); }
    }
  }

  /* 敌方模拟机 vs 玩家 */
  for (let i = enemySims.length - 1; i >= 0; i--) {
    const g = enemySims[i];
    if (Math.hypot(g.x - player.x, g.y - player.y) < 22 + player.r) {
      damagePlayer(20);
      g.life -= 4;
      if (g.life <= 0) { addExplosion(g.x, g.y, 20, '#ff8080', 1); enemySims.splice(i, 1); }
    }
  }

  /* 敌弹 vs 玩家 */
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (circleHit(b, player)) { damagePlayer(b.dmg); ebullets.splice(i, 1); }
  }

  /* 道具 vs 玩家 */
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (circleHit(p, player)) { applyPickup(p.p); pickups.splice(i, 1); }
  }
}

/* ==================== 特效更新 ==================== */
function updateEffects(dt) {
  if (state === 'playing') {
    const speedUp = 1 + Math.min(1, score / 6000);
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.y += c.sp * dt * speedUp;
      if (c.y - c.r > H + 80) clouds[i] = newCloud(false);
    }
  }
  if (state === 'paused' || state === 'levelup' || state === 'shop' || debugMode) return;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const damp = Math.pow(0.9, dt * 60);
    p.vx *= damp; p.vy *= damp;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ==================== 背景 ==================== */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#0a1c3d');
  g.addColorStop(0.45, '#123a63');
  g.addColorStop(1,    '#2a6a9a');
  ctx.fillStyle = g;
  ctx.fillRect(-40, -40, W + 80, H + 80);
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    const rg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    rg.addColorStop(0,   'rgba(205,232,255,' + c.a + ')');
    rg.addColorStop(0.6, 'rgba(180,215,250,' + (c.a * 0.5) + ')');
    rg.addColorStop(1,   'rgba(180,215,250,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
  }
}

  } else if (form === 'cyber') {

    ctx.beginPath(); ctx.moveTo(46, -18); ctx.lineTo(28, -30); ctx.lineTo(24, 8); ctx.lineTo(40, 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.accent; ctx.lineWidth = 2;

    // 躯干
    ctx.beginPath();
    ctx.moveTo(-26, -32); ctx.lineTo(26, -32); ctx.lineTo(30, -6);

    ctx.strokeStyle = pal.stroke; ctx.lineWidth = 2.8; ctx.stroke();

    // 胸部装甲

    // 双核心

      ctx.beginPath(); ctx.arc(s * 10, -18, 7 + pulse * 2, 0, Math.PI * 2);

    // 躯干发光纹路
    ctx.strokeStyle = pal.accent; ctx.lineWidth = 1.2;

    // 腰带
    ctx.fillStyle = pal.stroke;
    ctx.fillRect(-14, 18, 28, 5);
    ctx.fillStyle = pal.core;
    ctx.fillRect(-12, 19, 24, 3);

    // 手臂
    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.moveTo(-30, -22); ctx.lineTo(-40, -12); ctx.lineTo(-38, 26); ctx.lineTo(-28, 22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.stroke; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, -22); ctx.lineTo(40, -12); ctx.lineTo(38, 26); ctx.lineTo(28, 22); ctx.closePath(); ctx.fill();
    ctx.stroke();

    // 手臂发光关节
    ctx.beginPath(); ctx.arc(-34, -6, 5, 0, Math.PI * 2); ctx.fillStyle = pal.core; ctx.fill();

    // 前臂炮口

    ctx.fillStyle = pal.core;

    // 头部（大型机械头）
    ctx.beginPath();

    ctx.closePath();
    ctx.fillStyle = pal.body; ctx.fill();
    ctx.strokeStyle = pal.stroke; ctx.lineWidth = 2.4; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-17, -42); ctx.lineTo(17, -42); ctx.lineTo(15, -34); ctx.lineTo(-15, -34);

    // 头冠发光
    ctx.fillStyle = pal.core;

  }

  ctx.restore();
}

function getPlayerForm() {
  if (player.level >= 100) return 'ultra';
  if (player.level >= 50) return 'cyber';
  if (player.level >= 40) return 'robot';
  if (player.level >= 30) return 'advanced';
  if (player.level >= 20) return 'elite';
  return 'base';
}

function drawPlayer() {
  if (player.hp <= 0) return;
  const p = player;
  const form = getPlayerForm();
  const pal = FORM_PALETTES[form];
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.invuln > 0 && Math.floor(time * 20) % 2 === 0) ctx.globalAlpha = 0.35;
  if (p.evolveFlash > 0) {
    const k = p.evolveFlash / 2.4;
    const R = 60 + (1 - k) * 140;
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    rg.addColorStop(0, 'rgba(255,240,150,' + (0.75 * k) + ')');
    rg.addColorStop(0.6, 'rgba(255,180,80,' + (0.35 * k) + ')');
    rg.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  }
  drawPlaneModel(form, pal, 0);
  if (p.shield > 0) {
    const a = 0.25 + 0.2 * Math.sin(time * 12);
    ctx.beginPath(); ctx.arc(0, 0, p.r + 16, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,220,255,' + (a * 0.4) + ')'; ctx.fill();
    ctx.strokeStyle = 'rgba(120,235,255,' + (a + 0.35) + ')'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}

function drawEnemySims() {
  for (let i = 0; i < enemySims.length; i++) {
    const g = enemySims[i];
    if (g.alpha <= 0.02) continue;
    const form = getPlayerForm();
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.globalAlpha = g.alpha;
    const glowR = 40;
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    glow.addColorStop(0, 'rgba(255,80,80,0.35)');
    glow.addColorStop(0.5, 'rgba(255,60,60,0.15)');
    glow.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();
    drawPlaneModel(form, ENEMY_SIM_PAL, Math.PI);
    ctx.globalAlpha = g.alpha * (0.6 + 0.4 * Math.sin(time * 8));
    ctx.fillStyle = '#ff4040';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, -40);
    ctx.restore();
  }
}

    case 4:

      ctx.beginPath(); ctx.moveTo(38, -38); ctx.quadraticCurveTo(56, -76, 26, -84);
      ctx.quadraticCurveTo(42, -58, 28, -42); ctx.closePath();
      ctx.fillStyle = '#ffd080'; ctx.fill(); ctx.strokeStyle = ac; ctx.stroke();

      ctx.beginPath(); ctx.moveTo(52, 10); ctx.quadraticCurveTo(82, 20, 94, -2); ctx.stroke();
      for (let s = 0; s < 7; s++) {
        const a = Math.PI + (s - 3) * Math.PI / 7;

    case 5:
      ctx.beginPath();
      ctx.moveTo(0, -62); ctx.lineTo(-20, -74); ctx.lineTo(-10, -84);
      ctx.lineTo(0, -80); ctx.lineTo(10, -84); ctx.lineTo(20, -74);
      ctx.closePath();
      ctx.fillStyle = '#ff4060'; ctx.fill(); ctx.strokeStyle = ac; ctx.stroke();
      break;
    case 6:
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 24, -42); ctx.lineTo(s * 34, -66); ctx.lineTo(s * 12, -54); ctx.closePath();
        ctx.fillStyle = bc; ctx.fill(); ctx.strokeStyle = ac; ctx.stroke();
      }
      ctx.strokeStyle = '#3a1e00'; ctx.lineWidth = 8;
      ctx.beginPath();
      for (let s = 0; s <= 10; s++) {
        const t = s / 10;
        const x = -64 + t * 128;
        const y = -46 - Math.sin(t * Math.PI) * 30 + Math.sin(time * 3 + t * 5) * 4;
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      break;
    case 7:
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(s * 52, -32, 24, 0, Math.PI * 1.8, s < 0);
        ctx.strokeStyle = '#f0e0b0'; ctx.lineWidth = 9; ctx.stroke();
        ctx.strokeStyle = ac; ctx.lineWidth = 2.5; ctx.stroke();
      }
      break;
    case 8:
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(s * 50, -22, 22, 0, Math.PI * 2);
        ctx.fillStyle = bc; ctx.fill(); ctx.strokeStyle = ac; ctx.stroke();
        ctx.beginPath(); ctx.arc(s * 50, -22, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe0c0'; ctx.fill();
      }
      break;
    case 9:
      ctx.beginPath();
      ctx.moveTo(-34, -56);
      ctx.quadraticCurveTo(-20, -96, -6, -60);
      ctx.quadraticCurveTo(2, -100, 14, -58);
      ctx.quadraticCurveTo(26, -92, 34, -54);
      ctx.quadraticCurveTo(0, -74, -34, -56);
      ctx.closePath();
      ctx.fillStyle = '#ff4020'; ctx.fill();
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2; ctx.stroke();
      break;
    case 10:
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(s * 54, -6, 17, 32, s * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = bc; ctx.fill(); ctx.strokeStyle = ac; ctx.stroke();
      }
      break;
    case 11:
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 40, -38); ctx.lineTo(s * 60, -64); ctx.lineTo(s * 20, -54); ctx.closePath();
        ctx.fillStyle = bc; ctx.fill(); ctx.strokeStyle = ac; ctx.stroke();
      }
      break;
  }

  ctx.beginPath();
  ctx.ellipse(0, -4, 58, 52, 0, 0, Math.PI * 2);
  ctx.fillStyle = bc;
  ctx.fill();
  ctx.strokeStyle = ac;
  ctx.lineWidth = 3.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, 4, 44, 36, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fill();

  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * 22, -8, 12, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 22, -8, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3030';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 22, -8, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,80,80,' + eyeGlow + ')';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 22 - 2, -10, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  if (zi === 11) {
    ctx.beginPath();
    ctx.ellipse(0, 22, 14, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ff80a0'; ctx.fill();
    ctx.strokeStyle = ac; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(-4, 22, 2, 0, Math.PI * 2); ctx.fillStyle = '#5a0000'; ctx.fill();
    ctx.beginPath(); ctx.arc(4, 22, 2, 0, Math.PI * 2); ctx.fillStyle = '#5a0000'; ctx.fill();
  } else if (zi === 9) {
    ctx.beginPath();
    ctx.moveTo(-12, 18); ctx.lineTo(12, 18); ctx.lineTo(0, 34); ctx.closePath();
    ctx.fillStyle = '#ffa020'; ctx.fill();
    ctx.strokeStyle = '#a05000'; ctx.lineWidth = 1.5; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, 16, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#102028'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-14, 30); ctx.quadraticCurveTo(0, 42, 14, 30);
    ctx.strokeStyle = '#102028'; ctx.lineWidth = 2.5; ctx.stroke();
  }

  if (zi === 4) {
    ctx.strokeStyle = '#ffd080'; ctx.lineWidth = 2;
    for (let s = -1; s <= 1; s += 2) {
      for (let w = 0; w < 3; w++) {
        ctx.beginPath();
        ctx.moveTo(s * 40, 6 + w * 4);
        ctx.quadraticCurveTo(s * 70, 16 + w * 6, s * 90, 8 + w * 4);
        ctx.stroke();
      }
    }
  }

  ctx.beginPath(); ctx.arc(-36, 16, 8 + pulse * 3, 0, Math.PI * 2);
  ctx.fillStyle = ac + '88'; ctx.fill();
  ctx.beginPath(); ctx.arc(36, 16, 8 + pulse * 3, 0, Math.PI * 2);
  ctx.fillStyle = ac + '88'; ctx.fill();

  ctx.textAlign = 'center';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('生肖·' + z.name + '  ·  PHASE ' + e.phase, 0, -118);

  const ratio = Math.max(0, e.hp / e.maxHp);
  const segW = 86, segGap = 8, barY = -108, barX = -90;
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(barX, barY, 180, 12);
  ctx.fillStyle = e.phase === 1 ? bc : 'rgba(255,255,255,0.16)';
  ctx.fillRect(barX + 1, barY + 1, segW * Math.min(1, ratio / 0.5), 10);
  ctx.fillStyle = e.phase === 2 ? ac : 'rgba(255,255,255,0.16)';
  const phase2Ratio = Math.max(0, (ratio - 0.5) / 0.5);
  ctx.fillRect(barX + segW + segGap + 1, barY + 1, segW * phase2Ratio, 10);
  ctx.strokeStyle = 'rgba(255,255,255,0.78)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, 180, 12);
}
