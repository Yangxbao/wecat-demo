/* ==================== 天元突破：机械钻头绘制 ==================== */
function drawTenyuanDrill(cx, cy, scale, angle, rot, len) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  // 真实工业钻头思路：后端驱动座 + 粗重主轴 + 锥形钻体 + 深凹槽 + 硬质合金刀尖。
  // 不使用霓虹、发光或 lighter 合成，仅靠金属明暗表现体积。
  const baseR = 36;
  const bodyTop = 5;
  const tipY = -len;
  const shaftLen = 22;

  // 后端驱动轴
  ctx.fillStyle = '#171b1f';
  ctx.fillRect(-14, -2, 28, shaftLen + 8);
  ctx.fillStyle = '#596168';
  ctx.fillRect(-11, 3, 22, 4);
  ctx.fillStyle = '#aeb5ba';
  ctx.fillRect(-9, 11, 18, 2);
  ctx.fillStyle = '#252b30';
  ctx.fillRect(-12, 17, 24, 7);

  // 厚重法兰 / 轴承座
  ctx.fillStyle = '#111518';
  ctx.beginPath(); ctx.ellipse(0, 0, baseR + 8, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7d858b'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(0, 0, baseR + 2, 9, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#2b3136';
  ctx.beginPath(); ctx.ellipse(0, 0, baseR - 7, 6.5, 0, 0, Math.PI * 2); ctx.fill();

  // 锥形钢体：六段金属面，制造真实机械加工的硬边反光。
  const bodyGrad = ctx.createLinearGradient(-baseR, 0, baseR, 0);
  bodyGrad.addColorStop(0.00, '#181d21');
  bodyGrad.addColorStop(0.14, '#4d555c');
  bodyGrad.addColorStop(0.28, '#a7afb4');
  bodyGrad.addColorStop(0.43, '#e0e3e5');
  bodyGrad.addColorStop(0.52, '#757e85');
  bodyGrad.addColorStop(0.68, '#333a40');
  bodyGrad.addColorStop(0.86, '#8b949a');
  bodyGrad.addColorStop(1.00, '#161a1e');
  ctx.beginPath();
  ctx.moveTo(-baseR + 2, bodyTop);
  ctx.lineTo(baseR - 2, bodyTop);
  ctx.lineTo(0, tipY);
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  ctx.strokeStyle = '#0d1013';
  ctx.lineWidth = 2.8;
  ctx.stroke();

  // 五条深凹螺旋槽：暗面与亮面交替，形成车削/铣削后的金属层次。
  const fluteCount = 5;
  const steps = 30;
  for (let k = 0; k < fluteCount; k++) {
    const phase0 = rot * 0.95 + k * Math.PI * 2 / fluteCount;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const y = bodyTop - t * (len - 8);
      const r = Math.max(2.8, (baseR - 3) * (1 - t));
      const x = Math.sin(phase0 + t * Math.PI * 2.35) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = (k % 2 === 0) ? 'rgba(16,20,23,0.88)' : 'rgba(216,221,224,0.68)';
    ctx.lineWidth = 8.5;
    ctx.lineCap = 'butt';
    ctx.stroke();

    // 刀背细亮边
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const y = bodyTop - t * (len - 8);
      const r = Math.max(2.2, (baseR - 3) * (1 - t));
      const x = Math.sin(phase0 + t * Math.PI * 2.35 + 0.08) * (r + 2.2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(238,241,243,0.50)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  // 靠近根部的切削环：更像工业钻头的真实阶梯加工。
  for (let i = 0; i < 4; i++) {
    const y = -8 - i * 9;
    const rr = Math.max(6, baseR - i * 3.2);
    ctx.strokeStyle = i % 2 ? '#4b5359' : '#c2c8cc';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(0, y, rr, 3.2, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 三组加工面分界线：让钻体更像真正的多刃金属铣削件。
  for (let band = 1; band <= 3; band++) {
    const t = band / 4;
    const y = bodyTop - t * (len - 14);
    const rr = Math.max(5, (baseR - 4) * (1 - t));
    ctx.strokeStyle = 'rgba(240,243,244,0.34)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, y, rr, 2.2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(8,11,13,0.62)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(0, y + 1.4, rr * 0.96, 2.0, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 钻尖前端的四面研磨面。
  const tipBase = Math.max(14, Math.min(26, len * 0.075));
  const tipPhase = rot * 0.7;
  for (let q = 0; q < 4; q++) {
    const a = tipPhase + q * Math.PI / 2;
    const ex = Math.cos(a) * 11, ey = tipY + Math.sin(a) * 2;
    ctx.strokeStyle = q % 2 ? '#eef1f2' : '#626a70';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, tipY + 2);
    ctx.lineTo(ex, ey + tipBase * 0.52);
    ctx.stroke();
  }

  // 硬质合金十字刀尖
  ctx.fillStyle = '#d5dadc';
  ctx.beginPath();
  ctx.moveTo(0, tipY - 3);
  ctx.lineTo(-8, tipY + tipBase * 0.62);
  ctx.lineTo(0, tipY + tipBase * 0.32);
  ctx.lineTo(8, tipY + tipBase * 0.62);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4f575e';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // 中心刀尖压接环与螺栓
  ctx.fillStyle = '#252b30';
  ctx.beginPath(); ctx.arc(0, tipY + 10, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a8b0b5';
  ctx.beginPath(); ctx.arc(0, tipY + 10, 1.7, 0, Math.PI * 2); ctx.fill();

  // 根部四颗真实机械固定螺栓
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2 + Math.PI / 4;
    const bx = Math.cos(a) * (baseR - 13);
    const by = Math.sin(a) * 5.6;
    ctx.fillStyle = '#14181b';
    ctx.beginPath(); ctx.arc(bx, by, 3.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b8bec2';
    ctx.beginPath(); ctx.arc(bx, by, 1.4, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}


/* ==================== 天使虚影（光环 12 级） ==================== */
function drawAngel(cx, cy) {
  const pulse = 0.6 + 0.4 * Math.sin(time * 3);
  const breath = 0.75 + 0.25 * Math.sin(time * 2.2);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalCompositeOperation = 'lighter';

  // 柔和光晕
  const glow = ctx.createRadialGradient(0, -10, 0, 0, -10, 90);
  glow.addColorStop(0, 'rgba(255, 250, 200, ' + (0.32 * breath) + ')');
  glow.addColorStop(0.5, 'rgba(255, 220, 120, ' + (0.16 * breath) + ')');
  glow.addColorStop(1, 'rgba(255, 200, 80, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, -10, 90, 0, Math.PI * 2); ctx.fill();

  // 天使光环（头顶）
  ctx.strokeStyle = 'rgba(255, 240, 180, ' + (0.85 * breath) + ')';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.ellipse(0, -72, 22, 6, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 255, 220, ' + (0.5 * breath) + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(0, -72, 26, 8, 0, 0, Math.PI * 2);
  ctx.stroke();

  // 双翼（六翼分层）
  for (const s of [-1, 1]) {
    for (let layer = 0; layer < 3; layer++) {
      const lw = 54 - layer * 10;
      const lh = 78 - layer * 14;
      const alpha = 0.55 - layer * 0.14;
      const flap = Math.sin(time * 2.4 + layer * 0.6) * 4;

      ctx.beginPath();
      ctx.moveTo(s * 6, -34);
      ctx.quadraticCurveTo(s * (lw * 0.7), -46 + flap, s * lw, -18 + flap);
      ctx.quadraticCurveTo(s * (lw * 0.85), 4 + flap, s * (lw * 0.55), 20 + flap);
      ctx.quadraticCurveTo(s * (lw * 0.4), 4 + flap, s * 6, 8);
      ctx.closePath();
      const wg = ctx.createLinearGradient(s * 6, -34, s * lw, 20);
      wg.addColorStop(0, 'rgba(255, 255, 240, ' + (alpha * 0.35 * breath) + ')');
      wg.addColorStop(0.5, 'rgba(255, 245, 200, ' + (alpha * 0.5 * breath) + ')');
      wg.addColorStop(1, 'rgba(255, 220, 130, ' + (alpha * 0.15 * breath) + ')');
      ctx.fillStyle = wg;
      ctx.fill();

      // 翼缘描线
      ctx.strokeStyle = 'rgba(255, 250, 210, ' + (alpha * 0.7 * breath) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(s * 6, -34);
      ctx.quadraticCurveTo(s * (lw * 0.7), -46 + flap, s * lw, -18 + flap);
      ctx.stroke();
    }
  }

  // 天使身躯（半透明发光）
  ctx.fillStyle = 'rgba(255, 250, 220, ' + (0.35 * breath) + ')';
  ctx.beginPath();
  ctx.moveTo(-14, -32);
  ctx.lineTo(14, -32);
  ctx.lineTo(18, 30);
  ctx.lineTo(0, 46);
  ctx.lineTo(-18, 30);
  ctx.closePath();
  ctx.fill();

  // 身躯高光
  ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.55 * breath) + ')';
  ctx.beginPath();
  ctx.moveTo(-6, -30);
  ctx.lineTo(6, -30);
  ctx.lineTo(8, 26);
  ctx.lineTo(0, 40);
  ctx.lineTo(-8, 26);
  ctx.closePath();
  ctx.fill();

  // 头部
  ctx.fillStyle = 'rgba(255, 255, 240, ' + (0.75 * breath) + ')';
  ctx.beginPath();
  ctx.arc(0, -46, 12, 0, Math.PI * 2);
  ctx.fill();

  // 头部光晕
  const hg = ctx.createRadialGradient(0, -46, 0, 0, -46, 22);
  hg.addColorStop(0, 'rgba(255, 255, 220, ' + (0.7 * breath) + ')');
  hg.addColorStop(1, 'rgba(255, 220, 120, 0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, -46, 22, 0, Math.PI * 2); ctx.fill();

  // 双臂（祈祷手势）
  for (const s of [-1, 1]) {
    ctx.strokeStyle = 'rgba(255, 250, 210, ' + (0.6 * breath) + ')';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s * 12, -22);
    ctx.quadraticCurveTo(s * 22, -8 + pulse * 2, s * 10, 10);
    ctx.stroke();
  }

  // 光点尘埃
  for (let i = 0; i < 8; i++) {
    const a = time * 1.5 + i * 0.9;
    const R = 40 + Math.sin(time * 2 + i) * 14;
    const ox = Math.cos(a) * R;
    const oy = Math.sin(a) * R - 10;
    ctx.fillStyle = 'rgba(255, 250, 200, ' + (0.55 * breath) + ')';
    ctx.beginPath();
    ctx.arc(ox, oy, 1.6 + Math.sin(time * 4 + i) * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ==================== 黑色镰刀绘制 ==================== */
function drawScytheBlade(cx, cy, r, rot, glowColor, big) {
  ctx.save();
  ctx.translate(cx, cy);

  const glowR = r * 2.4;
  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
  glow.addColorStop(0, 'rgba(90, 0, 30, 0.5)');
  glow.addColorStop(0.4, 'rgba(50, 0, 20, 0.28)');
  glow.addColorStop(0.75,'rgba(20, 0, 10, 0.12)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();

  ctx.rotate(rot);
  const bladeR = r * 1.5;

  ctx.beginPath();
  ctx.arc(0, 0, bladeR, -Math.PI * 0.78, Math.PI * 0.16);
  ctx.arc(r * 0.35, -r * 0.15, bladeR * 0.78, Math.PI * 0.16, -Math.PI * 0.78, true);
  ctx.closePath();
  const bladeGrad = ctx.createLinearGradient(-bladeR, -bladeR, bladeR, bladeR);
  bladeGrad.addColorStop(0,    '#000000');
  bladeGrad.addColorStop(0.35, '#0a0010');
  bladeGrad.addColorStop(0.65, '#2a0018');
  bladeGrad.addColorStop(0.9,  '#a00030');
  bladeGrad.addColorStop(1,    '#ff4060');
  ctx.fillStyle = bladeGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 60, 120, 0.85)';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, bladeR * 0.96, -Math.PI * 0.76, Math.PI * 0.14);
  ctx.strokeStyle = 'rgba(255, 100, 160, 0.9)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(r * 0.3, -r * 0.15, bladeR * 0.6, -Math.PI * 0.7, Math.PI * 0.05);
  ctx.strokeStyle = 'rgba(255, 80, 140, 0.5)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  ctx.beginPath(); ctx.arc(0, 0, r * 0.52, 0, Math.PI * 2);
  const coreGrad = ctx.createRadialGradient(-r*0.1, -r*0.1, 0, 0, 0, r * 0.52);
  coreGrad.addColorStop(0,    '#3a0010');
  coreGrad.addColorStop(0.35, '#1a0008');
  coreGrad.addColorStop(0.75, '#000000');
  coreGrad.addColorStop(1,    '#000000');
  ctx.fillStyle = coreGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 80, 140, 0.9)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 60, 100, 0.95)';
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 220, 240, 0.95)';
  ctx.fill();

  if (big) {
    for (let i = 0; i < 6; i++) {
      const t = i / 5;
      const a = -Math.PI * 0.7 + t * Math.PI * 0.8;
      const rr = bladeR * (0.73 + 0.08 * Math.sin(rot * 2 + i * 1.7));
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      ctx.beginPath(); ctx.arc(px, py, 2 + 0.8 * (0.5 + 0.5 * Math.sin(time * 7 + i)), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 100, 160, ' + (0.62 + 0.28 * (0.5 + 0.5 * Math.sin(time * 5 + i))) + ')';
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawHellChain(x1, y1, x2, y2, phase, alpha, level) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);
  const count = Math.max(7, Math.min(19, Math.floor(dist / 18)));
  const sag = Math.min(22, 7 + level * 0.9);
  const lift = 3.5 + level * 0.25;

  function pathPoint(t) {
    const x = t * dist;
    const y = Math.sin(phase * 1.25 + t * Math.PI * 3.2) * sag * (0.32 + 0.68 * (1 - Math.abs(t * 2 - 1)));
    return { x, y };
  }

  function pathTangent(t) {
    const e = 0.012;
    const a = pathPoint(Math.max(0, t - e));
    const b = pathPoint(Math.min(1, t + e));
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  ctx.save();
  ctx.translate(x1, y1);
  ctx.rotate(ang);
  ctx.globalAlpha = alpha;

  // 链条阴影与贯穿的暗色连接芯。
  ctx.strokeStyle = 'rgba(5, 4, 9, 0.9)';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 28; i++) {
    const p = pathPoint(i / 28);
    if (i === 0) ctx.moveTo(p.x, p.y + 2.5); else ctx.lineTo(p.x, p.y + 2.5);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(46, 20, 58, 0.85)';
  ctx.lineWidth = 4.2;
  ctx.beginPath();
  for (let i = 0; i <= 28; i++) {
    const p = pathPoint(i / 28);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // 真实链环：相邻链环互相穿插，正面/侧面交替。
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const p = pathPoint(t);
    const tangent = pathTangent(t);
    const cross = (i % 2 === 0 ? 1 : -1);
    const roll = cross * 0.66 + Math.sin(phase * 0.9 + i * 0.7) * 0.07;
    const rx = 10.8 + level * 0.16;
    const ry = 5.4 + level * 0.08;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(tangent + roll);

    // 链环本体。
    const metal = ctx.createLinearGradient(-rx, -ry, rx, ry);
    metal.addColorStop(0, '#17161c');
    metal.addColorStop(0.22, '#47434f');
    metal.addColorStop(0.48, '#9b98a4');
    metal.addColorStop(0.62, '#5c5863');
    metal.addColorStop(0.84, '#292731');
    metal.addColorStop(1, '#111015');
    ctx.fillStyle = metal;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // 中空孔洞，制造真正“链环”的感觉。
    ctx.fillStyle = '#170d1d';
    ctx.beginPath();
    ctx.ellipse(0, 0, rx * 0.48, Math.max(2.0, ry * 0.42), 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#0a090d';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();

    // 金属磨损高光。
    ctx.strokeStyle = 'rgba(232,228,238,0.48)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(-rx * 0.13, -ry * 0.05, rx * 0.68, Math.PI * 1.05, Math.PI * 1.72);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(118, 52, 150, 0.38)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, ry * 1.1, Math.PI * 0.12, Math.PI * 0.9);
    ctx.stroke();

    ctx.restore();
  }

  // 缠绕链身的紫色气息：细、卷曲、分层，不做成直线光束。
  for (let q = 0; q < 4; q++) {
    ctx.strokeStyle = q === 1
      ? 'rgba(173, 93, 220, 0.38)'
      : 'rgba(92, 43, 138, ' + (0.16 + q * 0.025) + ')';
    ctx.lineWidth = 1.2 + q * 0.45;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      const p = pathPoint(t);
      const swirl = Math.sin(phase * (1.45 + q * 0.16) + t * Math.PI * (5.5 + q * 0.8) + q * 1.8);
      const offset = (6 + q * 2.2) * swirl;
      const px = p.x + Math.cos(pathTangent(t) + Math.PI / 2) * offset;
      const py = p.y + Math.sin(pathTangent(t) + Math.PI / 2) * offset;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // 紫气卷成的小型“雾团”，间隔出现，避免过于霓虹。
  for (let i = 0; i < 7; i++) {
    const t = (0.08 + ((phase * 0.08 + i * 0.17) % 0.84));
    const p = pathPoint(t);
    const a = pathTangent(t) + Math.PI / 2;
    const side = Math.sin(phase * 1.6 + i * 1.4);
    const px = p.x + Math.cos(a) * side * (7 + level * 0.25);
    const py = p.y + Math.sin(a) * side * (7 + level * 0.25);
    ctx.fillStyle = 'rgba(168, 90, 206, 0.18)';
    ctx.beginPath();
    ctx.arc(px, py, 2.2 + 0.35 * Math.sin(phase * 2 + i), 0, Math.PI * 2);
    ctx.fill();
  }

  // 吸血能量从敌机端向玩家端移动。
  const pulseT = 1 - ((phase * 0.46) % 1);
  const pulseP = pathPoint(pulseT);
  ctx.fillStyle = '#c58be1';
  ctx.beginPath();
  ctx.arc(pulseP.x, pulseP.y, 2.4 + level * 0.08, 0, Math.PI * 2);
  ctx.fill();

  // 两端的金属锁扣。
  for (const t of [0, 1]) {
    const p = pathPoint(t);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(pathTangent(t));
    ctx.fillStyle = '#2a2730';
    ctx.beginPath(); ctx.arc(0, 0, 6.5 + level * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8b8492'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function drawBladeStormFx(w) {
  if (!w.blades || !w.blades.length) return;
  const lv = w.level;
  ctx.save();
  ctx.globalAlpha = 0.26;
  ctx.strokeStyle = 'rgba(160,40,90,0.7)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.arc(player.x, player.y, 72 + lv * 8.8, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  for (let i = 0; i < w.blades.length; i++) {
    const b = w.blades[i];
    const rot = -b.a + Math.PI * 0.15;
    drawScytheBlade(b.x, b.y, b.r * 1.15, rot, '#ff5a8a', true);
  }

  // 高速旋转产生短促的非发光金属切痕。
  ctx.save();
  ctx.globalAlpha = 0.38;
  ctx.strokeStyle = '#8f294f';
  ctx.lineWidth = 2.2;
  for (let i = 0; i < 12; i++) {
    const a = time * (8 + lv * 0.45) + i * Math.PI * 2 / 12;
    const r0 = 62 + lv * 7.2;
    const r1 = r0 + 16 + lv * 1.6;
    ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(a) * r0, player.y + Math.sin(a) * r0);
    ctx.lineTo(player.x + Math.cos(a + 0.05) * r1, player.y + Math.sin(a + 0.05) * r1);
    ctx.stroke();
  }
  ctx.restore();
}

/* ==================== 武器特效 ==================== */
function drawWeaponFx() {
  /* ---- 原子吐息：全程等亮度巨型原子光束 ---- */
  for (let i = 0; i < player.weapons.length; i++) {
    const w = player.weapons[i];
    if (w.key !== 'atombreath' || !w.beam) continue;
    const godzillaX = player.x;
    const godzillaY = player.y - 58;
    drawGodzilla(godzillaX, godzillaY, 1.1);

    const bottomY = player.y - 30;
    const topY = 24;
    const totalH = bottomY - topY;
    const lv = w.level;
    const halfW = 17 + lv * 2.9;
    const segs = 18;
    const leftEdge = [], rightEdge = [];

    for (let s2 = 0; s2 <= segs; s2++) {
      const t = s2 / segs;
      const y = bottomY - t * totalH;
      const wave = Math.sin(time * 20 + t * 18) * (2.4 + t * 2.5);
      leftEdge.push({ x: player.x - halfW + wave, y });
      rightEdge.push({ x: player.x + halfW + wave, y });
    }

    ctx.save();

    // 外圈：从近到远保持相同透明度，不再出现明显的深浅渐变。
    ctx.fillStyle = 'rgba(56, 190, 210, 0.62)';
    ctx.beginPath();
    ctx.moveTo(leftEdge[0].x - 7, leftEdge[0].y);
    for (let s2 = 1; s2 < leftEdge.length; s2++) ctx.lineTo(leftEdge[s2].x - 7, leftEdge[s2].y);
    for (let s2 = rightEdge.length - 1; s2 >= 0; s2--) ctx.lineTo(rightEdge[s2].x + 7, rightEdge[s2].y);
    ctx.closePath();
    ctx.fill();

    // 主光束：整条保持稳定青白亮度。
    ctx.fillStyle = 'rgba(194, 252, 255, 0.98)';
    ctx.beginPath();
    ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
    for (let s2 = 1; s2 < leftEdge.length; s2++) ctx.lineTo(leftEdge[s2].x, leftEdge[s2].y);
    for (let s2 = rightEdge.length - 1; s2 >= 0; s2--) ctx.lineTo(rightEdge[s2].x, rightEdge[s2].y);
    ctx.closePath();
    ctx.fill();

    // 稳定横截面，让远端也有足够的“原子密度”。
    ctx.globalAlpha = 0.40;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.90)';
    ctx.lineWidth = 2;
    for (let band = 0; band < 12; band++) {
      const t = (band + 0.5) / 12;
      const y = bottomY - t * totalH;
      const half = halfW * (0.56 + 0.10 * Math.sin(time * 8 + band));
      ctx.beginPath();
      ctx.moveTo(player.x - half, y);
      ctx.lineTo(player.x + half, y + Math.sin(time * 18 + band) * 1.2);
      ctx.stroke();
    }

    // 固定亮边，避免任何距离造成的整体变暗。
    ctx.globalAlpha = 0.82;
    ctx.strokeStyle = 'rgba(112, 232, 242, 0.92)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
    for (let s2 = 1; s2 < leftEdge.length; s2++) ctx.lineTo(leftEdge[s2].x, leftEdge[s2].y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightEdge[0].x, rightEdge[0].y);
    for (let s2 = 1; s2 < rightEdge.length; s2++) ctx.lineTo(rightEdge[s2].x, rightEdge[s2].y);
    ctx.stroke();

    ctx.restore();
  }

  /* ---- 天元突破：仅保留中央机械巨钻 ---- */
  for (let i = 0; i < player.weapons.length; i++) {
    const w = player.weapons[i];
    if (w.key !== 'tenyuan' || !w.beam) continue;
    const lv = w.level;
    const baseY = player.y - 30;
    const topY = 18;
    const reach = baseY - topY;
    const len = Math.min(250 + lv * 9, reach * 0.82);
    const spin = time * (15 + lv * 1.1);
    drawTenyuanDrill(player.x, baseY, 1.28 + lv * 0.018, 0, spin, len);
  }

  /* ---- 地狱锁链：真实链节 + 吸血回流 ---- */
  for (let i = 0; i < player.weapons.length; i++) {
    const w = player.weapons[i];
    if (w.key !== 'linkbeam' || !w.links || !w.links.length) continue;
    const lv = w.level;
    for (let k = 0; k < w.links.length; k++) {
      const e = w.links[k];
      if (!e || !enemies.includes(e)) continue;
      drawHellChain(player.x, player.y, e.x, e.y, w.pulse + k * 0.37, 0.78, lv);
      ctx.save();
      ctx.globalAlpha = 0.65;
      ctx.strokeStyle = '#ff304a'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5 + 2 * Math.sin(w.pulse * 5 + k), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.25 * Math.sin(w.pulse * 8);
    ctx.strokeStyle = '#ff4055'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, 22 + lv * 1.3, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  /* ---- 镰刀风暴：完整环绕武器实体 ---- */
  for (let i = 0; i < player.weapons.length; i++) {
    const w = player.weapons[i];
    if (w.key === 'bladestorm') drawBladeStormFx(w);
  }
}

/* ==================== 普通电锯绘制 ==================== */
function drawSawNormal(w) {
  const x = player.x;
  const bottomY = player.y - 22;
  const topY = bottomY - w.len;
  const hw = w.halfW;
  ctx.save();
  const glowGrad = ctx.createLinearGradient(0, bottomY, 0, topY);
  glowGrad.addColorStop(0, 'rgba(220,220,255,0.30)');
  glowGrad.addColorStop(1, 'rgba(180,180,255,0.04)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.moveTo(x - hw - 8, bottomY + 6);
  ctx.lineTo(x + hw + 8, bottomY + 6);
  ctx.lineTo(x + hw + 3, topY - 8);
  ctx.lineTo(x - hw - 3, topY - 8);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - hw, bottomY);
  ctx.lineTo(x + hw, bottomY);
  ctx.lineTo(x + hw * 0.85, topY + 6);
  ctx.lineTo(x, topY);
  ctx.lineTo(x - hw * 0.85, topY + 6);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, bottomY, 0, topY);
  grad.addColorStop(0, '#707080');
  grad.addColorStop(0.5, '#4a4a58');
  grad.addColorStop(1, '#282832');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#b0b0c8'; ctx.lineWidth = 1.8; ctx.stroke();
  const spinPhase = time * 10;
  const teeth = Math.floor(w.len / 9);
  for (let t = 0; t < teeth; t++) {
    const tt = (t + (spinPhase % 1)) / teeth;
    const ty = bottomY - w.len * tt;
    const spread = hw * (1 - tt * 0.15);
    ctx.beginPath(); ctx.moveTo(x + spread, ty); ctx.lineTo(x + spread + 7, ty - 2.8); ctx.lineTo(x + spread + 7, ty + 2.8); ctx.closePath();
    ctx.fillStyle = '#e8e8f4'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - spread, ty); ctx.lineTo(x - spread - 7, ty - 2.8); ctx.lineTo(x - spread - 7, ty + 2.8); ctx.closePath();
    ctx.fillStyle = '#e8e8f4'; ctx.fill();
  }
  ctx.restore();
}

/* ==================== 龙形电锯 ==================== */
function drawSawDragon(w) {
  const x = player.x;
  const bottomY = player.y - 22;
  const totalH = w.len;
  const topY = bottomY - totalH;
  const bite = Math.sin(time * 4) * 18;
  const wobble = Math.sin(time * 3) * 10;

  ctx.save();

  const glowGrad = ctx.createLinearGradient(0, bottomY, 0, topY);
  glowGrad.addColorStop(0,   'rgba(255,120,60,0.45)');
  glowGrad.addColorStop(0.4, 'rgba(255,80,40,0.30)');
  glowGrad.addColorStop(0.8, 'rgba(255,180,60,0.15)');
  glowGrad.addColorStop(1,   'rgba(255,40,20,0.05)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.moveTo(x - 52, bottomY + 10);
  ctx.lineTo(x + 52, bottomY + 10);
  ctx.quadraticCurveTo(x + 44 + wobble, topY + 120, x + 30 + wobble, topY + 30);
  ctx.quadraticCurveTo(x + 14 + wobble, topY + bite, x, topY - 26 + bite);
  ctx.quadraticCurveTo(x - 14 + wobble, topY + bite, x - 30 + wobble, topY + 30);
  ctx.quadraticCurveTo(x - 44 + wobble, topY + 120, x - 52, bottomY + 10);
  ctx.closePath();
  ctx.fill();

  const layers = 20;
  for (let s = 0; s < layers; s++) {
    const t = s / layers;
    const y = bottomY - totalH * t;
    const halfW = (28 + t * 8) * (1 - t * 0.35) + wobble * t;
    const offset = Math.sin(time * 5 + t * 6) * 8 * t;
    ctx.beginPath();
    ctx.moveTo(x - halfW + offset, y);
    ctx.quadraticCurveTo(x + offset, y - 12, x + halfW + offset, y);
    ctx.quadraticCurveTo(x + offset, y + 8, x - halfW + offset, y);
    ctx.closePath();
    const bodyGrad = ctx.createLinearGradient(x - halfW, y, x + halfW, y);
    bodyGrad.addColorStop(0, '#2a0808');
    bodyGrad.addColorStop(0.3, '#802020');
    bodyGrad.addColorStop(0.5, '#e04848');
    bodyGrad.addColorStop(0.7, '#802020');
    bodyGrad.addColorStop(1, '#2a0808');
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,80,0.55)';
    ctx.lineWidth = 1.4; ctx.stroke();
    if (s % 2 === 0 && s > 0) {
      const fs = 8 + t * 16;
      ctx.beginPath();
      ctx.moveTo(x - halfW + offset - 2, y);
      ctx.lineTo(x - halfW + offset - fs, y - fs * 0.85);
      ctx.lineTo(x - halfW + offset + 2, y - 5);
      ctx.closePath();
      ctx.fillStyle = '#ff6020'; ctx.fill();
      ctx.strokeStyle = '#ffd080'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + halfW + offset + 2, y);
      ctx.lineTo(x + halfW + offset + fs, y - fs * 0.85);
      ctx.lineTo(x + halfW + offset - 2, y - 5);
      ctx.closePath();
      ctx.fillStyle = '#ff6020'; ctx.fill();
      ctx.strokeStyle = '#ffd080'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(x + offset, y - 2, 3 + t * 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,240,180,' + (0.5 + t * 0.4) + ')';
    ctx.fill();
  }

  const headY = topY + 5 + bite;
  const headW = 36;
  const headH = 32;
  const jawOpen = 10 + Math.abs(Math.sin(time * 4)) * 16;

  ctx.beginPath();
  ctx.moveTo(x - headW + wobble, headY);
  ctx.lineTo(x + headW + wobble, headY);
  ctx.lineTo(x + headW * 0.82 + wobble, headY + headH);
  ctx.lineTo(x - headW * 0.82 + wobble, headY + headH);
  ctx.closePath();
  ctx.fillStyle = '#c02828'; ctx.fill();
  ctx.strokeStyle = '#ff8040'; ctx.lineWidth = 2.4; ctx.stroke();

  const eyeGlow = 0.6 + 0.4 * Math.sin(time * 8);
  ctx.beginPath(); ctx.arc(x - 14 + wobble, headY + 12, 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,220,80,' + eyeGlow + ')'; ctx.fill();
  ctx.beginPath(); ctx.arc(x + 14 + wobble, headY + 12, 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,220,80,' + eyeGlow + ')'; ctx.fill();
  ctx.beginPath(); ctx.arc(x - 14 + wobble, headY + 12, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#ff2000'; ctx.fill();
  ctx.beginPath(); ctx.arc(x + 14 + wobble, headY + 12, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#ff2000'; ctx.fill();

  ctx.restore();
}

/* ==================== 绘制：敌机 ==================== */
function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.type === 'boss') {
      drawZodiacBoss(e, e.hitFlash > 0);
    } else {
      let pal;
      if (e.type === 'small') pal = ENEMY_SMALL_PAL;
      else if (e.type === 'medium') pal = ENEMY_MEDIUM_PAL;
      else pal = ENEMY_HEAVY_PAL;
      const form = e.modelForm || 'base';
      const scale = e.modelScale || 1;
      ctx.save();
      ctx.scale(scale, scale);
      if (e.isElite) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 4);
        ctx.beginPath(); ctx.arc(0, 0, 38 + pulse * 5, 0, Math.PI * 2);
        ctx.strokeStyle = e.eliteColor + '99'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 48 + pulse * 7, 0, Math.PI * 2);
        ctx.strokeStyle = e.eliteColor + '44'; ctx.lineWidth = 1.5; ctx.stroke();
      }
      const flashOn = e.hitFlash > 0;
      if (flashOn) ctx.globalAlpha = 0.7;
      drawPlaneModel(form, e.isElite ? {
        body: e.eliteColor, stroke: '#ffffff', cockpit: pal.cockpit,
        flame: pal.flame, accent: '#ffffff', glow: 'rgba(255,255,255,0.5)', core: e.eliteColor
      } : pal, Math.PI);
      if (flashOn) ctx.globalAlpha = 1;
      ctx.restore();
    }
    ctx.restore();
  }
}

/* ==================== 绘制：子弹 ==================== */
function drawBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (b.laserCannon) {
      ctx.save();
      ctx.translate(b.x, b.y);
      const beamH = 1100;
      const pulse = 0.85 + 0.15 * Math.sin(time * 30);

      const outerGrad = ctx.createLinearGradient(-46 * pulse, 0, 46 * pulse, 0);
      outerGrad.addColorStop(0, 'rgba(255,150,255,0)');
      outerGrad.addColorStop(0.5, 'rgba(255,150,255,0.35)');
      outerGrad.addColorStop(1, 'rgba(255,150,255,0)');
      ctx.fillStyle = outerGrad;
      ctx.fillRect(-46 * pulse, -beamH, 92 * pulse, beamH);

      const midGrad = ctx.createLinearGradient(-26 * pulse, 0, 26 * pulse, 0);
      midGrad.addColorStop(0, 'rgba(255,120,255,0)');
      midGrad.addColorStop(0.5, 'rgba(255,180,255,0.75)');
      midGrad.addColorStop(1, 'rgba(255,120,255,0)');
      ctx.fillStyle = midGrad;
      ctx.fillRect(-26 * pulse, -beamH, 52 * pulse, beamH);

      const coreGrad = ctx.createLinearGradient(-10, 0, 10, 0);
      coreGrad.addColorStop(0, 'rgba(255,240,255,0)');
      coreGrad.addColorStop(0.5, 'rgba(255,255,255,0.95)');
      coreGrad.addColorStop(1, 'rgba(255,240,255,0)');
      ctx.fillStyle = coreGrad;
      ctx.fillRect(-10, -beamH, 20, beamH);

      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.fillRect(-2, -beamH, 4, beamH);

      ctx.beginPath();
      ctx.arc(0, 0, 26 + pulse * 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,200,255,0.85)';
      ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 40 + pulse * 10, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,150,255,0.45)';
      ctx.lineWidth = 1.8; ctx.stroke();

      ctx.restore();
    } else if (b.fireball) {
      ctx.save();
      ctx.translate(b.x, b.y);
      const pulse = 0.85 + 0.15 * Math.sin(time * 25 + b.x * 0.1);

      const glowR = 20 * pulse;
      const og = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
      og.addColorStop(0, 'rgba(255, 220, 100, 0.7)');
      og.addColorStop(0.4, 'rgba(255, 120, 30, 0.5)');
      og.addColorStop(1, 'rgba(255, 40, 10, 0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI * 2); ctx.fill();

      const bg = ctx.createRadialGradient(0, -2, 0, 0, 0, b.r * pulse);
      bg.addColorStop(0, '#fff8d0');
      bg.addColorStop(0.35, '#ffb040');
      bg.addColorStop(0.75, '#ff5020');
      bg.addColorStop(1, '#801008');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(0, 0, b.r * pulse, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,220,0.95)';
      ctx.beginPath(); ctx.arc(-1, -1, b.r * 0.3, 0, Math.PI * 2); ctx.fill();

      for (let f = 0; f < 3; f++) {
        const fa = time * 10 + f * 2.1;
        const fr = b.r * (1.2 + 0.4 * Math.sin(time * 15 + f));
        ctx.beginPath();
        ctx.arc(Math.cos(fa) * b.r * 0.6, Math.sin(fa) * b.r * 0.6, fr * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,180,60,0.5)';
        ctx.fill();
      }

      ctx.restore();
    } else if (b.laser) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
      ctx.fillStyle = b.glow;
      ctx.beginPath(); ctx.ellipse(0, 0, b.r * 2.6, b.r * 5.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(0, 0, b.r * 0.9, b.r * 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(0, 0, b.r * 0.35, b.r * 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (b.sword) {
      /* 帝王剑：金刃 / 十字护手 / 缠绳剑柄 / 宝石剑首 */
      ctx.save();
      ctx.globalAlpha = b.alpha || 0.68;
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + b.angle * 0.15);
      const L = b.r * 5.2;   /* 护手 → 剑尖的刃长 */
      const hw = b.r * 0.28; /* 刃身半宽 */
      const sh = 0.75 + 0.25 * Math.sin(time * 14 + b.x * 0.05);

      /* 圣光灵气 */
      const aura = ctx.createRadialGradient(L * 0.35, 0, 0, L * 0.35, 0, b.r * 2.6);
      aura.addColorStop(0, 'rgba(255,242,180,' + (0.5 * sh) + ')');
      aura.addColorStop(0.5, 'rgba(255,205,90,' + (0.22 * sh) + ')');
      aura.addColorStop(1, 'rgba(255,170,40,0)');
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(L * 0.35, 0, b.r * 2.6, 0, Math.PI * 2); ctx.fill();

      /* 剑刃：金色渐变刃身 + 收锋剑尖 */
      const blade = ctx.createLinearGradient(0, -hw * 1.15, 0, hw * 1.15);
      blade.addColorStop(0, '#fff7d6');
      blade.addColorStop(0.45, '#ffe98a');
      blade.addColorStop(1, '#c8871a');
      ctx.fillStyle = blade;
      ctx.beginPath();
      ctx.moveTo(L, 0);
      ctx.lineTo(L * 0.86, -hw * 0.55);
      ctx.lineTo(L * 0.12, -hw);
      ctx.lineTo(0, -hw * 1.15);
      ctx.lineTo(0, hw * 1.15);
      ctx.lineTo(L * 0.12, hw);
      ctx.lineTo(L * 0.86, hw * 0.55);
      ctx.closePath(); ctx.fill();
      /* 刃脊亮线 */
      ctx.strokeStyle = 'rgba(255,252,235,0.95)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(L * 0.9, 0); ctx.lineTo(2, 0); ctx.stroke();

      /* 十字护手 + 中心红宝石 */
      ctx.fillStyle = '#f7b733';
      roundRect(ctx, -b.r * 0.62, -hw * 2.6, b.r * 0.34, hw * 5.2, b.r * 0.12); ctx.fill();
      ctx.strokeStyle = 'rgba(110,55,0,0.75)'; ctx.lineWidth = 1.2;
      roundRect(ctx, -b.r * 0.62, -hw * 2.6, b.r * 0.34, hw * 5.2, b.r * 0.12); ctx.stroke();
      ctx.fillStyle = '#ffdf8a';
      roundRect(ctx, -b.r * 0.76, -hw * 3.3, b.r * 0.2, hw * 6.6, b.r * 0.08); ctx.fill();
      ctx.fillStyle = '#e02440';
      ctx.beginPath(); ctx.arc(-b.r * 0.45, 0, b.r * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(-b.r * 0.5, -b.r * 0.05, b.r * 0.05, 0, Math.PI * 2); ctx.fill();

      /* 剑柄：深红缠绳 + 金色缠环 */
      ctx.fillStyle = '#5c0f1e';
      roundRect(ctx, -b.r * 1.14, -b.r * 0.12, b.r * 0.52, b.r * 0.24, b.r * 0.1); ctx.fill();
      ctx.strokeStyle = '#d9a13a'; ctx.lineWidth = 1.2;
      for (let g2 = 0; g2 < 3; g2++) {
        const gx = -b.r * 1.06 + g2 * b.r * 0.16;
        ctx.beginPath(); ctx.moveTo(gx, -b.r * 0.11); ctx.lineTo(gx + b.r * 0.09, b.r * 0.11); ctx.stroke();
      }

      /* 剑首：金球 + 血玉 */
      ctx.fillStyle = '#f7b733';
      ctx.beginPath(); ctx.arc(-b.r * 1.24, 0, b.r * 0.19, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff3050';
      ctx.beginPath(); ctx.arc(-b.r * 1.24, 0, b.r * 0.1, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    } else if (b.rot) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4;
        const rr = k % 2 === 0 ? b.r * 1.4 : b.r * 0.6;
        if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = b.glow; ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(0, 0, b.r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, b.r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = b.glow;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.4, 0, Math.PI * 2); ctx.fill();
      if (b.bounces > 0) {
        ctx.strokeStyle = 'rgba(160,255,180,0.75)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4.5, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
}

function drawEnemyBullets() {
  for (let i = 0; i < ebullets.length; i++) {
    const b = ebullets[i];
    const col = b.color || '#ff4d6d';
    ctx.fillStyle = col + '55';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.66, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.2, b.y - b.r * 0.2, b.r * 0.24, 0, Math.PI * 2); ctx.fill();
  }
}

/* ==================== 拾取物 / 经验 ==================== */
function drawPickups() {
  for (let i = 0; i < pickups.length; i++) {
    const p = pickups[i];
    const st = p.p;
    ctx.save();
    ctx.translate(p.x, p.y);
    const isTreasure = st.k === 'treasure';
    ctx.rotate(isTreasure ? Math.sin(p.t * 2) * 0.18 : Math.sin(p.t * 3) * 0.32);
    if (isTreasure) {
      const pulse = 1 + Math.sin(p.t * 6) * 0.08;
      ctx.scale(pulse, pulse);
      ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,220,70,0.16)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,235,150,0.7)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -20); ctx.lineTo(18, 0); ctx.lineTo(0, 20); ctx.lineTo(-18, 0); ctx.closePath();
      ctx.fillStyle = '#ffd84d'; ctx.fill();
      ctx.strokeStyle = '#fff7c2'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#5a3a00';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('宝', 0, 1);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, p.r + 6, 0, Math.PI * 2);
      ctx.fillStyle = st.color + '33'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fillStyle = st.color; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#12202e';
      ctx.font = 'bold 15px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(st.label, 0, 1);
    }
    ctx.restore();
  }
}

function drawOrbs() {
  for (let i = 0; i < orbs.length; i++) {
    const o = orbs[i];
    const pulse = 0.75 + 0.25 * Math.sin(o.t * 8);
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse + 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(120,255,200,0.22)'; ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#6effc0'; ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x - o.r * 0.25, o.y - o.r * 0.25, o.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
  }
}

/* ==================== 粒子 / 冲击波 ==================== */
function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.9), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBossEntranceOverlay() {
  const boss = enemies.find(function (e) { return e.type === 'boss' && e.intro > 0; });
  if (!boss) return;
  const elapsed = boss.introTotal - boss.intro;
  const pulse = 0.5 + 0.5 * Math.sin(elapsed * 11);
  const alpha = 0.10 + pulse * 0.07;
  ctx.fillStyle = 'rgba(24,0,8,' + alpha + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,70,90,' + (0.35 + pulse * 0.35) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(24, 196); ctx.lineTo(W - 24, 196); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24, 224); ctx.lineTo(W - 24, 224); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff5a6e';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText('⚠  生肖 BOSS 来袭  ⚠', W / 2, 180);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillText(boss.bossName || 'BOSS', W / 2, 210);
  ctx.fillStyle = 'rgba(255,220,230,0.78)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('十二生肖 · 随缘降临', W / 2, 245);
}

function drawBombRings() {
  for (let i = 0; i < bombRings.length; i++) {
    const r = bombRings[i];
    const a = Math.max(0, r.life / r.max);
    const col = r.color || '160,240,255';
    const thick = r.thick || 6;
    ctx.strokeStyle = 'rgba(' + col + ',' + (a * 0.85) + ')';
    ctx.lineWidth = thick * a + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.5) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.75, 0, Math.PI * 2); ctx.stroke();
  }
}

/* ==================== 世界和平万岁字幕 ==================== */
function drawPeaceBanner() {
  if (peaceBannerTimer <= 0) return;
  const a = Math.min(1, peaceBannerTimer / 0.6);
  const scale = 1 + (1 - a) * 0.15;
  const pulse = 0.85 + 0.15 * Math.sin(time * 12);

  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cy = H / 2 - 40;

  ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.42 * a) + ')';
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createLinearGradient(0, cy - 60, 0, cy + 60);
  g.addColorStop(0,   'rgba(255, 100, 100, ' + (0.35 * a) + ')');
  g.addColorStop(0.25,'rgba(255, 200, 80, ' + (0.35 * a) + ')');
  g.addColorStop(0.5, 'rgba(120, 255, 140, ' + (0.35 * a) + ')');
  g.addColorStop(0.75,'rgba(100, 200, 255, ' + (0.35 * a) + ')');
  g.addColorStop(1,   'rgba(200, 120, 255, ' + (0.35 * a) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, cy - 62, W, 124);

  ctx.save();
  ctx.translate(W / 2, cy);
  ctx.scale(scale, scale);

  const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 220);
  glow.addColorStop(0, 'rgba(255, 230, 200, ' + (0.55 * pulse * a) + ')');
  glow.addColorStop(0.5, 'rgba(255, 180, 120, ' + (0.28 * a) + ')');
  glow.addColorStop(1, 'rgba(255, 120, 60, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 220, 0, Math.PI * 2); ctx.fill();

  ctx.font = 'bold 46px system-ui, sans-serif';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(120, 0, 60, ' + (0.9 * a) + ')';
  ctx.strokeText('世 界 和 平 万 岁', 0, 0);

  const textGrad = ctx.createLinearGradient(0, -30, 0, 30);
  textGrad.addColorStop(0,   '#fff5c0');
  textGrad.addColorStop(0.4, '#ffd24a');
  textGrad.addColorStop(0.7, '#ff8030');
  textGrad.addColorStop(1,   '#ff4060');
  ctx.fillStyle = textGrad;
  ctx.fillText('世 界 和 平 万 岁', 0, 0);

  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255, 240, 200, ' + (0.9 * a) + ')';
  ctx.fillText('NO MORE NUKES · 愿世间再无战争', 0, 36);

  ctx.restore();
  ctx.restore();
}

/* ==================== 暂停菜单 ==================== */
function getPauseButtons() {
  return [
    { id: 'resume', x: W/2 - 110, y: H/2 + 20,  w: 220, h: 52, label: '继续游戏',   color: '#8fe3ff' },
    { id: 'exit',   x: W/2 - 110, y: H/2 + 86,  w: 220, h: 52, label: '返回主菜单', color: '#ff5a6e' },
    { id: 'debug',  x: W/2 - 110, y: H/2 + 152, w: 220, h: 44, label: '调试面板 (D)', color: '#c08aff' }
  ];
}
function hitPauseButton(px, py) {
  const btns = getPauseButtons();
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b;
  }
  return null;
}

function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(3,8,18,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillText('已暂停', W / 2, H / 2 - 50);
  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText('点击下方按钮选择操作', W / 2, H / 2 - 20);
  const btns = getPauseButtons();
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    ctx.fillStyle = b.color + '22';
    roundRect(ctx, b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = b.color; ctx.lineWidth = 2;
    roundRect(ctx, b.x, b.y, b.w, b.h, 10); ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
}

/* ==================== 调试面板 ==================== */
function getDebugWeaponButtons() {
  debugWeaponBtns = [];
  const keys = Object.keys(WEAPON_DEFS);
  const marginX = 8;
  const bw = W - marginX * 2;
  const bh = 20, gapY = 2;
  const startY = 88;
  for (let i = 0; i < keys.length; i++) {
    const y = startY + i * (bh + gapY);
    debugWeaponBtns.push({
      x: marginX, y: y, w: bw, h: bh, key: keys[i],
      minusX: marginX + bw - 74, minusW: 32,
      plusX: marginX + bw - 36, plusW: 32

function hitDebugWeaponButton(px, py) {
  const btns = getDebugWeaponButtons();
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    if (px >= b.minusX && px <= b.minusX + b.minusW && py >= b.y + 2 && py <= b.y + b.h - 2) {
      return { key: b.key, action: 'minus' };
    }
    if (px >= b.plusX && px <= b.plusX + b.plusW && py >= b.y + 2 && py <= b.y + b.h - 2) {
      return { key: b.key, action: 'plus' };
    }
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
      return { key: b.key, action: 'plus' };
    }
  }
  return null;
}
function hitDebugActionButton(px, py) {

  for (let i = 0; i < btns.length; i++) {

    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b;

function doDebugWeapon(key, action) {
  const def = WEAPON_DEFS[key];
  const own = player.weapons.find(function (w) { return w.key === key; });
  if (action === 'minus') {
    if (!own) { sfx('deny'); return; }
    if (own.level > 1) { own.level--; sfx('pickup'); }
    else {
      const idx = player.weapons.indexOf(own);
      if (idx >= 0) player.weapons.splice(idx, 1);
      sfx('pickup');
    }
  } else {
    if (own) {
      if (own.level < def.max) own.level++;
      else sfx('deny');
    } else {
      if (player.weapons.length >= MAX_SLOTS) {
        const idx = player.weapons.findIndex(function (w) { return FUSION_KEYS.indexOf(w.key) < 0; });
        if (idx >= 0) player.weapons.splice(idx, 1);
      }
      player.weapons.push({ key: key, level: 1, cd: 0, angle: 0, orbs: [], tick: 0 });
      sfx('pickup');
    }
  }
}
function doDebugAction(id) {
  if (id === 'coins') { SAVE.coins += 1000; persist(); sfx('pickup'); }
  else if (id === 'nodrops') {
    debugNoDrops = !debugNoDrops;
    if (debugNoDrops) { pickups.length = 0; orbs.length = 0; } // 立即清掉场上已有的掉落物和经验珠
    sfx(debugNoDrops ? 'pickup' : 'deny');
  }
  else if (id === 'fullhp') { player.hp = player.maxHp; player.shield = Math.max(player.shield, 6); sfx('pickup'); }
  else if (id === 'lvlup10') {
    for (let i = 0; i < 10; i++) { player.level++; pendingLevels++; }
    player.xpNeed = xpNeedFor(player.level);
    sfx('evolution');
    toast = { text:'调试：+10 级', sub:'已升至 Lv.' + player.level, timer:1.6, color:'#ffaa00' };
  }
  else if (id === 'lvl50') {
    const need = 50 - player.level;
    if (need > 0) {
      for (let i = 0; i < need; i++) { player.level++; pendingLevels++; }
      player.xpNeed = xpNeedFor(player.level);
      sfx('cyber');
      toast = { text:'调试：跳到 50 级', sub:'超级赛博机器人已激活', timer:2, color:'#7fffff' };
      player.evolveFlash = 1.8;
    }
  }
  else if (id === 'lvl100') {
    const need = 100 - player.level;
    if (need > 0) {
      for (let i = 0; i < need; i++) { player.level++; pendingLevels++; }
      player.xpNeed = xpNeedFor(player.level);
      sfx('ascend');
      toast = { text:'调试：跳到 100 级', sub:'超超超级赛博进化人降临', timer:2.5, color:'#ffd24a' };
      player.evolveFlash = 2.2;
      flash = Math.max(flash, 0.5);
    }
  }
  else if (id === 'fuse') {
    const map = {
      'nukepiece': ['littleboy', 'fatman'],
      'judgment':  ['mg', 'scythe'],
      'atombreath':['laser', 'spread'],
      'linkbeam':  ['aura', 'homing'],
      'tenyuan':['saw', 'mg'],
      'bladestorm': ['boomer', 'scythe']
    };
    let done = false;
    for (const k in map) {
      if (player.weapons.some(function (w) { return w.key === k; })) continue;
      const pair = map[k];
      const wa = player.weapons.find(function (w) { return w.key === pair[0]; });
      const wb = player.weapons.find(function (w) { return w.key === pair[1]; });
      if (!wa || !wb) continue;
      wa.level = WEAPON_DEFS[pair[0]].max;
      wb.level = WEAPON_DEFS[pair[1]].max;
      pickChoice({ kind: 'fuse', key: k });
      done = true;
      break;
    }
    if (!done) {
      const pairs = [['littleboy','fatman'], ['mg','scythe'], ['laser','spread'], ['aura','homing'], ['saw','mg'], ['boomer','scythe']];
      const pick = pairs[Math.floor(Math.random() * pairs.length)];
      for (let i = 0; i < pick.length; i++) {
        const key = pick[i];
        const own = player.weapons.find(function (w) { return w.key === key; });
        if (own) own.level = WEAPON_DEFS[key].max;
        else {
          if (player.weapons.length >= MAX_SLOTS) {
            const idx = player.weapons.findIndex(function (w) { return FUSION_KEYS.indexOf(w.key) < 0; });
            if (idx >= 0) player.weapons.splice(idx, 1);
          }
          player.weapons.push({ key: key, level: WEAPON_DEFS[key].max, cd: 0, angle: 0, orbs: [], tick: 0 });
        }
      }
      sfx('fuse');
    }
  }
}

    ctx.fillStyle = buffs[i].color;
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillText(buffs[i].name + ' ' + v.toFixed(1) + 's', 14, by2);

}

  for (let i = 0; i < btns.length; i++) {
    const b = btns[i], d = b.diff;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    roundRect(ctx, b.x, b.y, b.w, b.h, 8); ctx.fill();
    ctx.strokeStyle = d.color; ctx.lineWidth = 2;
    roundRect(ctx, b.x, b.y, b.w, b.h, 8); ctx.stroke();
    ctx.fillStyle = d.color;
    roundRect(ctx, b.x + 6, b.y + 8, 5, b.h - 16, 3); ctx.fill();

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = d.color;
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText(d.label, b.x + 26, b.y + b.h / 2 - 5);
    ctx.fillStyle = 'rgba(200,225,255,0.55)';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText(d.desc, b.x + 26, b.y + b.h / 2 + 15);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText('x' + d.scoreMul.toFixed(1), b.x + b.w - 14, b.y + b.h / 2);
  }

  const sb = getShopBtn();
  ctx.fillStyle = 'rgba(255,210,74,0.10)';
  roundRect(ctx, sb.x, sb.y, sb.w, sb.h, 8); ctx.fill();
  ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2;
  roundRect(ctx, sb.x, sb.y, sb.w, sb.h, 8); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 19px system-ui, sans-serif';
  ctx.fillText('研发中心  ·  金币 ' + SAVE.coins, W / 2, sb.y + sb.h / 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(150,200,255,0.55)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText(mobileMode ? '触摸选择难度 · 自动开火 · 收集经验升级' : '点击选择难度 · 自动开火 · 收集经验升级', W / 2, H - 62);
  ctx.fillStyle = 'rgba(150,200,255,0.4)';
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('20→精英 · 30→进阶 · 40→机甲 · 50→赛博 · 100→终极', W / 2, H - 38);
  ctx.fillText('P 暂停 · M 静音 · 空格炸弹 · D 调试', W / 2, H - 18);
}

/* ==================== 研发中心 ==================== */
function getShopRows() {
  const rows = [];
  const cols = 3, xGap = 7, x0 = 10, w = (W - 20 - xGap * 2) / cols;
  const y0 = 94, h = 76, gap = 6;
  for (let i = 0; i < META_DEFS.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = x0 + col * (w + xGap);
    const y = y0 + row * (h + gap);
    rows.push({
      x, y, w, h, def: META_DEFS[i],
      bx: x + w - 57, by: y + 17, bw: 49, bh: 25
    });
  }
  return rows;
}
function getShopBack() { return { x: W / 2 - 90, y: H - 62, w: 180, h: 44 }; }

function drawShop() {
  ctx.fillStyle = 'rgba(3,8,18,0.95)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText('研发中心', W / 2, 52);
  ctx.fillStyle = 'rgba(200,225,255,0.8)';
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillText('金币  ' + SAVE.coins, W / 2, 80);

  const rows = getShopRows();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], d = r.def;
    const lv = mLv(d.key);
    const maxed = lv >= d.max;
    const cost = mCost(d);
    const can = !maxed && SAVE.coins >= cost;
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    roundRect(ctx, r.x, r.y, r.w, r.h, 8); ctx.fill();
    ctx.strokeStyle = maxed ? 'rgba(120,255,180,0.5)' : 'rgba(120,200,255,0.22)';
    ctx.lineWidth = 1.4;
    roundRect(ctx, r.x, r.y, r.w, r.h, 8); ctx.stroke();

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#dff3ff'; ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText(d.name, r.x + 8, r.y + 20);
    ctx.fillStyle = 'rgba(180,210,240,0.62)'; ctx.font = '10px system-ui, sans-serif';
    wrapText(d.desc, r.x + 8, r.y + 35, r.w - 66, 11);

    // 等级点：紧凑排列，12级以内完整可见。
    const dotCount = Math.min(d.max, 12);
    const dotGap = Math.min(9.5, (r.w - 68) / Math.max(1, dotCount - 1));
    for (let k = 0; k < dotCount; k++) {
      const px = r.x + 8 + k * dotGap;
      const py = r.y + 61;
      ctx.beginPath(); ctx.arc(px, py, 2.8, 0, Math.PI * 2);
      ctx.fillStyle = k < Math.min(lv, dotCount) ? '#4ade80' : 'rgba(255,255,255,0.15)'; ctx.fill();
    }
    if (d.max > dotCount) {
      ctx.fillStyle = 'rgba(180,210,240,0.55)'; ctx.font = '10px system-ui, sans-serif';
      ctx.fillText('Lv.' + lv + '/' + d.max, r.x + 8, r.y + 72);
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (maxed) {
      ctx.fillStyle = 'rgba(120,255,180,0.15)'; roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(120,255,180,0.6)'; ctx.lineWidth = 1.3; roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.stroke();
      ctx.fillStyle = '#7fffb4'; ctx.font = 'bold 10px system-ui, sans-serif'; ctx.fillText('已满级', r.bx + r.bw / 2, r.by + r.bh / 2);
    } else {
      ctx.fillStyle = can ? 'rgba(255,210,74,0.14)' : 'rgba(255,255,255,0.05)'; roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.fill();
      ctx.strokeStyle = can ? '#ffd24a' : 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.3; roundRect(ctx, r.bx, r.by, r.bw, r.bh, 6); ctx.stroke();
      ctx.fillStyle = can ? '#ffd24a' : 'rgba(255,255,255,0.3)'; ctx.font = 'bold 9px system-ui, sans-serif';
      ctx.fillText('◈' + cost, r.bx + r.bw / 2, r.by + r.bh / 2);
    }
  }
  const bb = getShopBack();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRect(ctx, bb.x, bb.y, bb.w, bb.h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(140,220,255,0.6)'; ctx.lineWidth = 1.5;
  roundRect(ctx, bb.x, bb.y, bb.w, bb.h, 8); ctx.stroke();
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('返回', W / 2, bb.y + bb.h / 2);
}

/* ==================== 升级界面 ==================== */
function getLevelCards() {
  const list = [];
  const n = levelChoices.length;
  if (!n) return list;
  const cw = 140, ch = 196, gap = 10;
  const totalW = cw * n + gap * (n - 1);
  const x0 = (W - totalW) / 2;
  const y0 = 244;
  for (let i = 0; i < n; i++) {
    list.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch, c: levelChoices[i] });
  }
  return list;
}

function drawLevelUp() {
  ctx.fillStyle = 'rgba(3,8,18,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const treasureMode = treasureRewardsRemaining > 0;
  ctx.fillStyle = treasureMode ? '#ffd84d' : '#7fe9ff';
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillText(treasureMode ? '大  秘  宝' : '升  级', W / 2, 130);
  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText(treasureMode
    ? '第 ' + (treasureRewardsTotal - treasureRewardsRemaining + 1) + ' / ' + treasureRewardsTotal + ' 次三选一'
    : '选择一项强化 · Lv.' + player.level, W / 2, 162);
  ctx.fillStyle = 'rgba(160,200,240,0.45)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText(treasureMode
    ? '秘宝强化 · 每次仍为三选一'
    : '武器槽 ' + player.weapons.length + ' / ' + MAX_SLOTS +
      (mobileMode ? '' : '   （按 1 / 2 / 3 快速选择）'), W / 2, 188);

  const cards = getLevelCards();
  for (let i = 0; i < cards.length; i++) {
    const cd = cards[i];
    const info = choiceInfo(cd.c);
    const hot = hotCard === i;
    const isFuse = cd.c.kind === 'fuse';
    ctx.fillStyle = hot ? 'rgba(255,255,255,0.10)' : 'rgba(10,24,44,0.92)';
    roundRect(ctx, cd.x, cd.y, cd.w, cd.h, 12); ctx.fill();
    if (isFuse) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 4);
      ctx.save();
      ctx.globalAlpha = 0.3 + pulse * 0.4;
      ctx.fillStyle = '#ff44aa';
      roundRect(ctx, cd.x - 3, cd.y - 3, cd.w + 6, cd.h + 6, 14); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = info.color;
    ctx.lineWidth = hot ? 3 : 2;
    roundRect(ctx, cd.x, cd.y, cd.w, cd.h, 12); ctx.stroke();
    ctx.fillStyle = info.color;
    roundRect(ctx, cd.x, cd.y, cd.w, 6, 3); ctx.fill();
    ctx.beginPath();
    ctx.arc(cd.x + cd.w / 2, cd.y + 58, 26, 0, Math.PI * 2);
    ctx.fillStyle = info.color + '22'; ctx.fill();
    ctx.strokeStyle = info.color + '99'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = info.color;
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(info.icon, cd.x + cd.w / 2, cd.y + 59);
    ctx.fillStyle = 'rgba(180,210,240,0.6)';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.fillText(info.sub, cd.x + cd.w / 2, cd.y + 100);
    ctx.fillStyle = info.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText(info.title, cd.x + cd.w / 2, cd.y + 124);
    ctx.fillStyle = 'rgba(200,225,255,0.72)';
    ctx.font = '11px system-ui, sans-serif';
    wrapText(info.desc, cd.x + cd.w / 2, cd.y + 150, cd.w - 20, 15);
    if (!mobileMode) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.fillText('[' + (i + 1) + ']', cd.x + cd.w / 2, cd.y + cd.h - 12);
    }
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function wrapText(text, cx, y, maxW, lh) {
  const chars = String(text).split('');
  let line = '', lines = [];
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = chars[i]; }
    else line = test;
  }
  if (line) lines.push(line);
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i * lh);
}

/* ==================== 游戏结束 ==================== */
function drawGameOver() {
  ctx.fillStyle = 'rgba(3,8,18,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ff5a6e';
  ctx.font = 'bold 42px system-ui, sans-serif';
  ctx.fillText('游戏结束', W / 2, H / 2 - 100);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillText('最终得分：' + score, W / 2, H / 2 - 34);
  ctx.fillStyle = 'rgba(190,220,255,0.85)';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText('最高得分：' + SAVE.best, W / 2, H / 2 + 2);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillText('获得金币 +' + gainCoins, W / 2, H / 2 + 40);
  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText('抵达等级 Lv.' + player.level + ' · 难度 ' + currentDiff.label, W / 2, H / 2 + 70);
  if (Math.floor(time * 2) % 2 === 0) {
    ctx.fillStyle = '#7fe9ff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText(mobileMode ? '点击屏幕重新开始' : '点击画面 或 按 R 键 重新开始', W / 2, H / 2 + 128);
  }
  ctx.fillStyle = 'rgba(150,180,215,0.5)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('金币可在主菜单「研发中心」购买永久强化', W / 2, H - 30);
}

/* ==================== 渲染主函数 ==================== */
let hotCard = -1;

function render() {
  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawBackground();
  drawOrbs();
  drawPickups();
  drawEnemies();
  drawEnemySims();
  drawBullets();
  drawEnemyBullets();
  drawWeaponFx();
  drawLightningBolts();
  drawPlayer();
  drawParticles();
  drawBombRings();
  ctx.restore();

  if (state === 'playing') drawBossEntranceOverlay();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, flash) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (state !== 'menu' && state !== 'shop') drawHUD();
  if (state === 'playing') drawMobileControls();

  if (peaceBannerTimer > 0 && state === 'playing') drawPeaceBanner();

  if (state === 'menu')     drawMenu();
  if (state === 'shop')     drawShop();
  if (state === 'levelup')  drawLevelUp();
  if (state === 'paused')   drawPauseOverlay();
  if (state === 'gameover') drawGameOver();

  if (debugMode) drawDebugPanel();
}

/* ==================== 退出主菜单 ==================== */
function doExitToMenu() {
  if (state === 'playing' || state === 'paused' || state === 'levelup' || state === 'gameover') {
    if (state !== 'gameover') {
      gainCoins = Math.floor(score / 80 * bonusCoin());
      SAVE.coins += gainCoins;
      if (score > SAVE.best) SAVE.best = score;
      persist();
    }
    bullets.length = 0; enemies.length = 0; ebullets.length = 0;
    pickups.length = 0; orbs.length = 0; particles.length = 0;
    bombRings.length = 0; enemySims.length = 0; lightningBolts.length = 0;
    pendingLevels = 0; levelChoices = []; toast = null;
    treasureRewardsRemaining = 0; treasureRewardsTotal = 0;
    peaceBannerTimer = 0; fatmanSurrenderShown = false;
    debugNoDrops = false;
    touchCtrl.active = false; touchCtrl.id = null;
    debugMode = false;
    state = 'menu';
  } else {
    state = 'menu';
  }
}

/* ==================== 输入 ==================== */
function handlePointerDown(x, y) {
  initAudio();
  hotCard = -1;

  if (debugMode) {
    const wb = hitDebugWeaponButton(x, y);
    if (wb) { doDebugWeapon(wb.key, wb.action); return true; }
    const ab = hitDebugActionButton(x, y);
    if (ab) { doDebugAction(ab.id); return true; }
    if (y < 80) { debugMode = false; return true; }
    return false;
  }

  if (state === 'menu') {
    const btns = getMenuButtons();
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        currentDiff = b.diff;
        resetGame();
        return true;
      }
    }
    const sb = getShopBtn();
    if (x >= sb.x && x <= sb.x + sb.w && y >= sb.y && y <= sb.y + sb.h) {
      state = 'shop';
      return true;
    }
    return false;
  }

  if (state === 'shop') {
    const rows = getShopRows();
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (x >= r.bx && x <= r.bx + r.bw && y >= r.by && y <= r.by + r.bh) {
        const d = r.def, lv = mLv(d.key), cost = mCost(d);
        if (lv < d.max && SAVE.coins >= cost) {
          SAVE.coins -= cost;
          SAVE.meta[d.key] = lv + 1;
          persist();
          sfx('pickup');
        } else sfx('deny');
        return true;
      }
    }
    const bb = getShopBack();
    if (x >= bb.x && x <= bb.x + bb.w && y >= bb.y && y <= bb.y + bb.h) {
      state = 'menu';
      return true;
    }
    return false;
  }

  if (state === 'levelup') {
    const cards = getLevelCards();
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        pickChoice(c.c);
        return true;
      }
    }
    return false;
  }

  if (state === 'paused') {
    const btn = hitPauseButton(x, y);
    if (btn) {
      if (btn.id === 'resume') state = 'playing';
      else if (btn.id === 'exit') doExitToMenu();
      else if (btn.id === 'debug') { debugMode = true; }
      return true;
    }
    return false;
  }

  if (state === 'gameover') { resetGame(); return true; }
  return false;
}

canvas.addEventListener('mousemove', function (e) {
  const p = toGame(e.clientX, e.clientY);
  if (state === 'playing' && !debugMode) { player.tx = p.x; player.ty = p.y; }
  else if (state === 'levelup') {
    hotCard = -1;
    const cards = getLevelCards();
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) { hotCard = i; break; }
    }
  }
});

canvas.addEventListener('mousedown', function (e) {
  initAudio();
  const p = toGame(e.clientX, e.clientY);
  if (state === 'playing' && !debugMode) {
    if (e.button === 2) { useBomb(); return; }
    return;
  }
  handlePointerDown(p.x, p.y);
});

canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  initAudio();
  mobileMode = true;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const p = toGame(t.clientX, t.clientY);
    if (debugMode) {
      const wb = hitDebugWeaponButton(p.x, p.y);
      if (wb) { doDebugWeapon(wb.key, wb.action); continue; }
      const ab = hitDebugActionButton(p.x, p.y);
      if (ab) { doDebugAction(ab.id); continue; }
      if (p.y < 80) { debugMode = false; }
      continue;
    }
    if (state === 'playing') {
      const btn = hitMobileButton(p.x, p.y);
      if (btn) { doMobileButton(btn.id); continue; }
      if (!touchCtrl.active) {
        let offX = player.x - p.x;
        let offY = player.y - p.y;
        const d = Math.sqrt(offX * offX + offY * offY);
        const MAX_OFF = 130;
        if (d > MAX_OFF) { offX = 0; offY = -52; }
        touchCtrl.offsetX = offX;
        touchCtrl.offsetY = offY;
        touchCtrl.active = true;
        touchCtrl.id = t.identifier;
      }
      continue;
    }
    if (handlePointerDown(p.x, p.y)) return;
  }
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (state !== 'playing' || !touchCtrl.active || debugMode) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchCtrl.id) {
      const p = toGame(t.clientX, t.clientY);
      player.tx = p.x + touchCtrl.offsetX;
      player.ty = p.y + touchCtrl.offsetY;
      break;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchCtrl.id) { touchCtrl.active = false; touchCtrl.id = null; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

window.addEventListener('keydown', function (e) {
  initAudio();
  const k = e.key.toLowerCase();
  if (k === 'd') { debugMode = !debugMode; return; }
  if (debugMode) { if (k === 'escape') debugMode = false; return; }
  if (state === 'levelup') {
    if (k === '1' || k === '2' || k === '3') {
      const idx = parseInt(k, 10) - 1;
      if (levelChoices[idx]) pickChoice(levelChoices[idx]);
    }
    return;
  }
  if (state === 'shop') { if (k === 'escape') state = 'menu'; return; }
  if (k === ' ' || k === 'spacebar') { e.preventDefault(); useBomb(); }
  else if (k === 'p' || k === 'escape') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  else if (k === 'm') muted = !muted;
  else if (k === 'r') { if (state === 'gameover') resetGame(); }
});

/* ==================== 主循环 ==================== */
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 1 / 30) dt = 1 / 30;
  time += dt;
  if (state === 'playing' && !debugMode) updateGame(dt);
  updateEffects(dt);
  render();
  requestAnimationFrame(loop);
}

clouds.length = 0;
for (let i = 0; i < 16; i++) clouds.push(newCloud(true));

requestAnimationFrame(loop);

})();
</script>
