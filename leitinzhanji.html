<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆1942 — 终极版</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 40%, #101c33 0%, #05070f 70%);
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(60,160,255,0.35), 0 0 0 1px rgba(120,200,255,0.25);
    cursor: crosshair;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function () {
'use strict';

/* =========================================================
   雷霆1942 —— 终极版
   新增：
   - 4 档难度选择（简单 / 普通 / 困难 / 地狱）
   - 5 种射击模式：普通 / 激光 / 螺旋 / 反弹 / 刀镰（按 Q 切换）
   - 我方子弹可反弹（撞墙反弹）并击落敌方子弹
   - 激光穿透敌机、穿透敌弹
   - 僚机最多 4 架，自动索敌射击
   - 旋转刀镰环绕玩家造成持续伤害
   ========================================================= */

/* ==================== 常量 ==================== */
const W = 480;
const H = 720;

/* ==================== 画布 ==================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ==================== 工具 ==================== */
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function circleHit(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, rr = a.r + b.r;
  return dx * dx + dy * dy < rr * rr;
}

/* ==================== 音频合成 ==================== */
let actx = null, muted = false, lastShotSound = 0;

function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { actx = null; }
}

function sfx(type) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  try {
    if (type === 'shoot') {
      if (t - lastShotSound < 0.055) return;
      lastShotSound = t;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(430, t + 0.05);
      g.gain.setValueAtTime(0.016, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.06);
    } else if (type === 'explode') {
      const dur = 0.22;
      const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = actx.createBufferSource(); src.buffer = buf;
      const flt = actx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 1100;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.09, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(actx.destination);
      src.start(t);
    } else if (type === 'hit') {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.19);
    } else if (type === 'pickup') {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(540, t);
      o.frequency.exponentialRampToValueAtTime(1080, t + 0.12);
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.17);
    } else if (type === 'bomb') {
      const dur = 0.55;
      const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.4);
      const src = actx.createBufferSource(); src.buffer = buf;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(g); g.connect(actx.destination);
      src.start(t);
    } else if (type === 'warn') {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(320, t);
      o.frequency.setValueAtTime(470, t + 0.11);
      g.gain.setValueAtTime(0.035, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.25);
    } else if (type === 'over') {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(400, t);
      o.frequency.exponentialRampToValueAtTime(80, t + 0.9);
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 1.0);
    } else if (type === 'mode') {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(660, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + 0.1);
      g.gain.setValueAtTime(0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.15);
    }
  } catch (e) { /* ignore */ }
}

/* ==================== 难度定义 ==================== */
const DIFFS = [
  { key: 'easy',   label: '简单', color: '#4ade80', desc: '休闲飞行，敌机较弱',
    spawn: 1.4,  hp: 0.7,  speed: 0.85, scoreMul: 0.8 },
  { key: 'normal', label: '普通', color: '#5ad1ff', desc: '标准难度，均衡体验',
    spawn: 1.0,  hp: 1.0,  speed: 1.0,  scoreMul: 1.0 },
  { key: 'hard',   label: '困难', color: '#ffb03a', desc: '敌机更强更快',
    spawn: 0.72, hp: 1.4,  speed: 1.15, scoreMul: 1.5 },
  { key: 'hell',   label: '地狱', color: '#ff5a6e', desc: '疯狂弹幕，挑战极限',
    spawn: 0.5,  hp: 1.9,  speed: 1.3,  scoreMul: 2.2 }
];
let currentDiff = DIFFS[1];

/* ==================== 射击模式定义 ==================== */
const MODES = [
  { key: 'normal', label: '普通', color: '#8fe3ff',
    tip: '标准弹幕，可反弹 2 次' },
  { key: 'laser',  label: '激光', color: '#ff5aff',
    tip: '高速穿透，击穿敌弹与敌机' },
  { key: 'spiral', label: '螺旋', color: '#a0ffb0',
    tip: '左右摆动的螺旋弹幕' },
  { key: 'bounce', label: '反弹', color: '#ffd24a',
    tip: '大量弹丸，最多反弹 5 次' },
  { key: 'scythe', label: '刀镰', color: '#ff5a8a',
    tip: '环绕战机的旋转刀镰' }
];

/* ==================== 游戏状态 ==================== */
let state = 'menu';        // menu | playing | paused | gameover
let score = 0;
let best = Number(localStorage.getItem('sky1942_best') || 0);
let time = 0;
let difficulty = 0;
let spawnTimer = 0;
let bossTimer = 30;
let shake = 0;
let flash = 0;
let bombRings = [];
let modeToast = null;      // 模式切换提示

/* ==================== 玩家 ==================== */
const player = {
  x: W / 2, y: H - 110,
  tx: W / 2, ty: H - 110,
  r: 12,
  hp: 100, maxHp: 100,
  weapon: 1,             // 武器等级 1~5
  mode: 'normal',        // 射击模式
  shield: 0,
  fireCd: 0,
  invuln: 0,
  bombs: 1,
  combo: 0,
  comboTimer: 0,
  spiralAngle: 0,        // 螺旋模式累计角度
  wingmen: [],           // 僚机
  wingCd: 0
};

/* ==================== 实体数组 ==================== */
let bullets   = [];   // 我方子弹
let orbitals  = [];   // 环绕刀镰
let enemies   = [];   // 敌机
let ebullets  = [];   // 敌机子弹
let powerups  = [];   // 道具
let particles = [];   // 粒子
let clouds    = [];   // 背景云

/* ==================== 子弹工厂 ==================== */
function makeBullet(x, y, vx, vy, opts) {
  const b = {
    x: x, y: y, vx: vx, vy: vy,
    r: 4, dmg: 1,
    bounces: 0,       // 剩余反弹次数
    pierce: 0,        // 剩余穿透次数
    life: 5,
    color: '#eaffff',
    glowColor: 'rgba(120,235,255,0.35)',
    laser: false,
    rotating: false,
    angle: 0
  };
  if (opts) Object.assign(b, opts);
  return b;
}

/* ==================== 云层 ==================== */
function newCloud(init) {
  return {
    x: rand(-40, W + 40),
    y: init ? rand(-140, H + 60) : rand(-280, -110),
    r: rand(28, 92),
    sp: rand(20, 85),
    a: rand(0.05, 0.18)
  };
}

/* ==================== 重置 ==================== */
function resetGame() {
  state = 'playing';
  score = 0;
  time = 0;
  difficulty = 0;
  spawnTimer = 0.8;
  bossTimer = 30;
  shake = 0;
  flash = 0;
  modeToast = null;
  bombRings.length = 0;

  bullets.length = 0;
  orbitals.length = 0;
  enemies.length = 0;
  ebullets.length = 0;
  powerups.length = 0;
  particles.length = 0;

  player.x = player.tx = W / 2;
  player.y = player.ty = H - 110;
  player.hp = player.maxHp;
  player.weapon = 1;
  player.mode = 'normal';
  player.shield = 0;
  player.fireCd = 0;
  player.invuln = 0;
  player.bombs = 1;
  player.combo = 0;
  player.comboTimer = 0;
  player.spiralAngle = 0;
  player.wingmen = [];
  player.wingCd = 0;

  clouds.length = 0;
  for (let i = 0; i < 16; i++) clouds.push(newCloud(true));
}

/* ==================== 输入 ==================== */
function toGame(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (W / r.width),
    y: (clientY - r.top)  * (H / r.height)
  };
}

/* 菜单按钮（用于点击检测） */
function getMenuButtons() {
  const list = [];
  const bx = W / 2 - 150;
  const bw = 300, bh = 52;
  for (let i = 0; i < DIFFS.length; i++) {
    list.push({
      x: bx, y: 250 + i * 66, w: bw, h: bh,
      diff: DIFFS[i]
    });
  }
  return list;
}

/* 鼠标移动 */
canvas.addEventListener('mousemove', (e) => {
  if (state !== 'playing') return;
  const p = toGame(e.clientX, e.clientY);
  player.tx = p.x;
  player.ty = p.y;
});

/* 鼠标按下 */
canvas.addEventListener('mousedown', (e) => {
  initAudio();
  const p = toGame(e.clientX, e.clientY);

  if (state === 'menu') {
    const btns = getMenuButtons();
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        currentDiff = b.diff;
        resetGame();
        return;
      }
    }
    return;
  }

  if (e.button === 2) { useBomb(); return; }
  if (state === 'gameover') { resetGame(); return; }
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* 触摸 */
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  const t = e.touches[0];
  const p = toGame(t.clientX, t.clientY);

  if (state === 'menu') {
    const btns = getMenuButtons();
    for (let i = 0; i < btns.length; i++) {
      const b = btns[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        currentDiff = b.diff;
        resetGame();
        return;
      }
    }
    return;
  }
  if (state === 'gameover') { resetGame(); return; }
  player.tx = p.x; player.ty = p.y;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (state !== 'playing') return;
  const t = e.touches[0];
  const p = toGame(t.clientX, t.clientY);
  player.tx = p.x; player.ty = p.y;
}, { passive: false });

/* 键盘 */
window.addEventListener('keydown', (e) => {
  initAudio();
  const k = e.key.toLowerCase();

  if (k === ' ' || k === 'spacebar') { e.preventDefault(); useBomb(); }
  else if (k === 'p' || k === 'escape') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  else if (k === 'm') muted = !muted;
  else if (k === 'q') {
    if (state === 'playing') cycleMode();
  }
  else if (k === 'r') {
    if (state === 'gameover') resetGame();
  }
});

/* ==================== 切换射击模式 ==================== */
function cycleMode() {
  const idx = MODES.findIndex(function (m) { return m.key === player.mode; });
  const next = MODES[(idx + 1) % MODES.length];
  player.mode = next.key;
  orbitals.length = 0;   // 清空旧刀镰
  modeToast = { text: next.label, tip: next.tip, timer: 1.5 };
  sfx('mode');
}

/* ==================== 粒子 / 爆炸 ==================== */
function addExplosion(x, y, count, color, speedScale) {
  speedScale = speedScale || 1;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(40, 290) * speedScale;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.25, 0.8),
      max: 0.8,
      r: rand(1.5, 4.5),
      color: color
    });
  }
}

function addSparks(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(30, 130);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.1, 0.3),
      max: 0.3,
      r: rand(1, 2.5),
      color: '#bff6ff'
    });
  }
}

/* ==================== 玩家射击（5 种模式） ==================== */
function playerShoot() {
  const bx = player.x;
  const by = player.y - 22;
  const lvl = player.weapon;

  switch (player.mode) {

    /* ---------- 普通：向上散射，可反弹 ---------- */
    case 'normal': {
      const SPEED = 740;
      const shots = [];
      if (lvl === 1) {
        shots.push([0, 0, 0]);
      } else if (lvl === 2) {
        shots.push([-8, 0, 0], [8, 0, 0]);
      } else if (lvl === 3) {
        shots.push([0, -4, 0], [-12, 4, -0.16], [12, 4, 0.16]);
      } else if (lvl === 4) {
        shots.push([-6, -4, 0], [6, -4, 0], [-15, 6, -0.22], [15, 6, 0.22]);
      } else {
        shots.push([0, -6, 0], [-8, -2, -0.12], [8, -2, 0.12],
                   [-19, 8, -0.30], [19, 8, 0.30]);
      }
      for (let i = 0; i < shots.length; i++) {
        const s = shots[i];
        bullets.push(makeBullet(
          bx + s[0], by + s[1],
          Math.sin(s[2]) * SPEED, -Math.cos(s[2]) * SPEED,
          { r: 4, dmg: 1, bounces: 2, pierce: 0, life: 4,
            color: '#eaffff', glowColor: 'rgba(120,235,255,0.35)' }
        ));
      }
      break;
    }

    /* ---------- 激光：高速穿透敌机与敌弹 ---------- */
    case 'laser': {
      const SPEED = 1250;
      const count = Math.min(lvl, 3);
      for (let i = 0; i < count; i++) {
        const off = (i - (count - 1) / 2) * 11;
        bullets.push(makeBullet(bx + off, by, 0, -SPEED,
          { r: 3, dmg: 2, pierce: 3, bounces: 0, life: 3,
            color: '#ff5aff', glowColor: 'rgba(255,120,255,0.4)',
            laser: true }
        ));
      }
      break;
    }

    /* ---------- 螺旋：左右摆动的扇形弹幕 ---------- */
    case 'spiral': {
      player.spiralAngle += 0.5;
      const n = 3 + lvl;
      const SPEED = 660;
      for (let i = 0; i < n; i++) {
        const off = Math.sin(player.spiralAngle + i * 0.65) * 0.55;
        const a = -Math.PI / 2 + off;
        bullets.push(makeBullet(bx, by,
          Math.cos(a) * SPEED, Math.sin(a) * SPEED,
          { r: 4, dmg: 1, bounces: 1, life: 4,
            color: '#a0ffb0', glowColor: 'rgba(120,255,150,0.4)' }
        ));
      }
      break;
    }

    /* ---------- 反弹：大量弹丸，强反弹 ---------- */
    case 'bounce': {
      const n = 3 + lvl * 2;
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.3;
        const sp = 500 + Math.random() * 110;
        bullets.push(makeBullet(bx, by,
          Math.cos(a) * sp, Math.sin(a) * sp,
          { r: 5, dmg: 1, bounces: 5, life: 4.5,
            color: '#ffd24a', glowColor: 'rgba(255,220,120,0.4)' }
        ));
      }
      break;
    }

    /* ---------- 刀镰：向斜前方掷出旋转刃（环绕刃由 updateOrbitals 维护） ---------- */
    case 'scythe': {
      const n = 2 + Math.floor(lvl / 2);
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.7;
        bullets.push(makeBullet(bx, by,
          Math.cos(a) * 430, Math.sin(a) * 430,
          { r: 9, dmg: 2, bounces: 3, life: 3,
            color: '#ff5a8a', glowColor: 'rgba(255,100,150,0.4)',
            rotating: true, angle: 0 }
        ));
      }
      break;
    }
  }
}

/* ==================== 僚机 ==================== */
// 4 个编队位置
const WING_POS = [
  { dx: -38, dy:  10 },
  { dx:  38, dy:  10 },
  { dx: -60, dy:  32 },
  { dx:  60, dy:  32 }
];

function findNearestEnemy(x, y) {
  let target = null, bestD = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dx = e.x - x, dy = e.y - y;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; target = e; }
  }
  return target;
}

function wingShoot(w) {
  const target = findNearestEnemy(w.x, w.y);
  if (!target) return;
  const a = Math.atan2(target.y - w.y, target.x - w.x);
  bullets.push(makeBullet(w.x, w.y,
    Math.cos(a) * 620, Math.sin(a) * 620,
    { r: 3, dmg: 1, bounces: 1, life: 3,
      color: '#a8f0ff', glowColor: 'rgba(140,230,255,0.35)' }
  ));
}

function updateWingmen(dt) {
  const wm = player.wingmen;
  for (let i = 0; i < wm.length; i++) {
    const w = wm[i];
    const pos = WING_POS[i] || WING_POS[0];
    const tx = player.x + pos.dx;
    const ty = player.y + pos.dy + Math.sin(time * 4 + i) * 3;
    w.x += (tx - w.x) * Math.min(1, dt * 14);
    w.y += (ty - w.y) * Math.min(1, dt * 14);
    w.t = (w.t || 0) + dt;
    if (w.t >= 0.3) { w.t = 0; wingShoot(w); }
  }
}

/* ==================== 旋转刀镰（环绕） ==================== */
function updateOrbitals(dt) {
  // 刀镰模式下自动生成环绕刃
  if (player.mode === 'scythe') {
    const want = 2 + Math.floor(player.weapon * 0.8);
    while (orbitals.length < want) {
      orbitals.push({
        angle: Math.random() * Math.PI * 2,
        dist: 58,
        speed: 3.8,
        r: 13,
        dmg: 2,
        x: player.x, y: player.y
      });
    }
    while (orbitals.length > want) orbitals.pop();
  } else if (orbitals.length > 0) {
    orbitals.length = 0;
  }

  for (let i = 0; i < orbitals.length; i++) {
    const o = orbitals[i];
    o.angle += o.speed * dt;
    o.x = player.x + Math.cos(o.angle) * o.dist;
    o.y = player.y + Math.sin(o.angle) * o.dist;

    // 伤害检测（带 0.22 秒单敌冷却）
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!e.bladeCd) e.bladeCd = 0;
      if (circleHit(o, e)) {
        if (time - e.bladeCd > 0.22) {
          e.hp -= o.dmg;
          e.hitFlash = 0.08;
          e.bladeCd = time;
          addSparks(o.x, o.y, 3);
          if (e.hp <= 0) killEnemy(j);
        }
      }
    }
  }
}

/* ==================== 敌机生成 ==================== */
function spawnEnemy() {
  if (enemies.length > 16) return;

  const d = difficulty;
  const dm = currentDiff;

  const r = Math.random();
  let type;
  if (r < 0.62 - d * 0.26)      type = 'small';
  else if (r < 0.90 - d * 0.05) type = 'medium';
  else                          type = 'heavy';

  const x = rand(50, W - 50);
  const e = {
    type: type,
    x: x, y: -60,
    vx: 0, vy: 0,
    t: 0,
    hitFlash: 0,
    bladeCd: 0,
    shootCd: rand(0.5, 1.6),
    shootInterval: 2,
    behavior: 'straight',
    hoverY: 200
  };

  if (type === 'small') {
    e.r = 14;
    e.hp = Math.ceil(2 * (1 + d * 0.5) * dm.hp);
    e.vy = (rand(110, 165) + d * 40) * dm.speed;
    e.vx = rand(-45, 45);
    e.score = 10;
    e.shootInterval = rand(1.6, 3.0);
    e.behavior = Math.random() < 0.5 ? 'sine' : 'straight';
  } else if (type === 'medium') {
    e.r = 22;
    e.hp = Math.ceil(8 * (1 + d * 0.6) * dm.hp);
    e.vy = (rand(70, 105) + d * 25) * dm.speed;
    e.vx = rand(-55, 55);
    e.score = 30;
    e.shootInterval = rand(1.2, 2.0);
    e.behavior = Math.random() < 0.4 ? 'hover' : 'straight';
    e.hoverY = rand(120, 300);
  } else {
    e.r = 34;
    e.hp = Math.ceil(24 * (1 + d * 0.7) * dm.hp);
    e.vy = (rand(45, 68) + d * 15) * dm.speed;
    e.vx = rand(-30, 30);
    e.score = 80;
    e.shootInterval = rand(1.4, 2.2);
    e.behavior = 'straight';
  }

  e.maxHp = e.hp;
  enemies.push(e);

  // 高难度成对刷新
  if (d > 0.7 && Math.random() < 0.3) {
    const e2 = Object.assign({}, e);
    e2.x = clamp(e.x + rand(-70, 70), 40, W - 40);
    e2.y = e.y - rand(30, 80);
    e2.hp = e2.maxHp = e.maxHp;
    e2.shootCd = rand(0.5, 1.6);
    e2.bladeCd = 0;
    enemies.push(e2);
  }
}

/* ==================== BOSS ==================== */
function spawnBoss() {
  const hp = (220 + Math.floor(score / 12)) * currentDiff.hp;
  enemies.push({
    type: 'boss',
    x: W / 2, y: -140,
    vx: 70, vy: 70,
    r: 60,
    hp: hp, maxHp: hp,
    score: 500,
    t: 0,
    hitFlash: 0,
    bladeCd: 0,
    hovering: false,
    shootCd: 1.4,
    shootInterval: 1.6,
    behavior: 'boss'
  });
  sfx('warn');
}

/* ==================== 敌机开火 ==================== */
function makeEB(x, y, angle, speed, dmg, color) {
  return {
    x: x, y: y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: 6,
    dmg: dmg,
    color: color || '#ff4d6d'
  };
}

function enemyShoot(e) {
  const speedMul = currentDiff.speed;
  if (e.type === 'boss') {
    const base = Math.atan2(player.y - e.y, player.x - e.x);
    for (let i = -3; i <= 3; i++) {
      ebullets.push(makeEB(e.x, e.y + 46, base + i * 0.16, 215 * speedMul, 10, '#ff7a5a'));
    }
  } else if (e.type === 'heavy') {
    const base = Math.atan2(player.y - e.y, player.x - e.x);
    for (let i = -1; i <= 1; i++) {
      ebullets.push(makeEB(e.x, e.y + 20, base + i * 0.24, 235 * speedMul, 14, '#c07aff'));
    }
  } else if (e.type === 'medium') {
    const a = Math.atan2(player.y - e.y, player.x - e.x) + rand(-0.1, 0.1);
    ebullets.push(makeEB(e.x, e.y + 16, a, 255 * speedMul, 10, '#ffb03a'));
  } else {
    const a = Math.atan2(player.y - e.y, player.x - e.x) + rand(-0.2, 0.2);
    ebullets.push(makeEB(e.x, e.y + 12, a, 240 * speedMul, 8, '#ff5a8a'));
  }
}

/* ==================== 道具 ==================== */
const POWER_TYPES = [
  { type: 'weapon', w: 26 },
  { type: 'shield', w: 20 },
  { type: 'bomb',   w: 16 },
  { type: 'wing',   w: 22 },
  { type: 'life',   w: 16 }
];
const POWER_TOTAL = POWER_TYPES.reduce(function (s, p) { return s + p.w; }, 0);

function randomPowerType() {
  let r = Math.random() * POWER_TOTAL;
  for (let i = 0; i < POWER_TYPES.length; i++) {
    r -= POWER_TYPES[i].w;
    if (r <= 0) return POWER_TYPES[i].type;
  }
  return 'weapon';
}

function dropPowerup(x, y, forceType) {
  powerups.push({
    x: x, y: y,
    vy: 78,
    r: 15,
    type: forceType || randomPowerType(),
    t: 0
  });
}

function applyPowerup(type) {
  sfx('pickup');
  if (type === 'weapon') {
    if (player.weapon < 5) player.weapon++;
    else score += 60;
  } else if (type === 'shield') {
    player.shield = Math.min(12, player.shield + 8);
  } else if (type === 'bomb') {
    if (player.bombs < 5) player.bombs++;
    else bombEffect();
  } else if (type === 'wing') {
    if (player.wingmen.length < 4) {
      player.wingmen.push({ x: player.x, y: player.y, t: 0 });
    } else {
      score += 80;
    }
  } else if (type === 'life') {
    player.hp = Math.min(player.maxHp, player.hp + 30);
  }
  addExplosion(player.x, player.y, 12, '#7ff', 0.7);
}

/* ==================== 主动炸弹 ==================== */
function useBomb() {
  if (state !== 'playing') return;
  if (player.bombs <= 0) return;
  player.bombs--;
  bombEffect();
}

function bombEffect() {
  sfx('bomb');
  for (let i = 0; i < ebullets.length; i++) {
    addExplosion(ebullets[i].x, ebullets[i].y, 3, '#ffee88', 0.5);
  }
  ebullets.length = 0;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 30;
    e.hitFlash = 0.15;
    if (e.hp <= 0) killEnemy(i);
  }

  bombRings.push({ x: player.x, y: player.y, r: 0, life: 0.55, max: 0.55 });
  flash = 0.7;
  shake = 16;
}

/* ==================== 击杀敌机 ==================== */
function killEnemy(idx) {
  const e = enemies[idx];
  if (!e) return;
  enemies.splice(idx, 1);

  // 连击
  player.combo++;
  player.comboTimer = 2.2;
  const mult = 1 + Math.min(player.combo / 10, 2.5);
  score += Math.floor(e.score * mult * currentDiff.scoreMul);

  const isBoss = e.type === 'boss';

  addExplosion(e.x, e.y,
    isBoss ? 90 : (e.type === 'heavy' ? 40 : 18),
    isBoss ? '#ffd36b' : '#ffb03a',
    isBoss ? 2.2 : 1);
  shake = Math.max(shake, isBoss ? 18 : (e.type === 'heavy' ? 7 : 3));
  sfx('explode');

  if (isBoss) {
    dropPowerup(e.x - 50, e.y, 'weapon');
    dropPowerup(e.x,      e.y, 'shield');
    dropPowerup(e.x + 50, e.y, 'bomb');
    dropPowerup(e.x,      e.y - 40, 'wing');
    flash = 0.5;
  } else {
    const chance = e.type === 'heavy' ? 0.58
                 : e.type === 'medium' ? 0.26
                 : 0.10;
    if (Math.random() < chance) dropPowerup(e.x, e.y);
  }
}

/* ==================== 玩家受伤 ==================== */
function damagePlayer(dmg) {
  if (player.invuln > 0) return;

  if (player.shield > 0) {
    player.shield = Math.max(0, player.shield - 2.5);
    player.invuln = 0.5;
    addExplosion(player.x, player.y, 10, '#6ce8ff', 0.8);
    return;
  }

  player.hp -= dmg;
  player.invuln = 1.2;
  addExplosion(player.x, player.y, 16, '#ff9a5a');
  shake = Math.max(shake, 10);
  sfx('hit');

  player.combo = 0;
  player.comboTimer = 0;

  if (player.hp <= 0) {
    player.hp = 0;
    gameOver();
  }
}

function gameOver() {
  state = 'gameover';
  addExplosion(player.x, player.y, 60, '#ffd36b', 1.8);
  shake = 22;
  sfx('over');
  if (score > best) {
    best = score;
    localStorage.setItem('sky1942_best', String(best));
  }
}

/* ==================== 主更新 ==================== */
function updateGame(dt) {
  difficulty = Math.min(2.0, score / 1200);

  // 平滑跟随
  const k = 1 - Math.pow(0.72, dt * 60);
  player.x += (player.tx - player.x) * k;
  player.y += (player.ty - player.y) * k;
  player.x = clamp(player.x, player.r + 8, W - player.r - 8);
  player.y = clamp(player.y, player.r + 8, H - player.r - 8);

  if (player.invuln > 0) player.invuln -= dt;
  if (player.shield > 0) player.shield -= dt;

  if (player.comboTimer > 0) {
    player.comboTimer -= dt;
    if (player.comboTimer <= 0) player.combo = 0;
  }

  // 模式提示
  if (modeToast) {
    modeToast.timer -= dt;
    if (modeToast.timer <= 0) modeToast = null;
  }

  // 自动射击（刀镰模式不需要额外射击）
  player.fireCd -= dt;
  if (player.fireCd <= 0) {
    if (player.mode !== 'scythe') {
      playerShoot();
      sfx('shoot');
      player.fireCd = player.mode === 'laser' ? 0.09 : 0.12;
    } else {
      player.fireCd = 0.2;
    }
  }

  updateWingmen(dt);
  updateOrbitals(dt);

  // 敌机刷新
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    const base = Math.max(0.35, (0.9 - difficulty * 0.3)) * currentDiff.spawn;
    spawnTimer = base * rand(0.7, 1.35);
  }

  // BOSS 刷新
  const hasBoss = enemies.some(function (e) { return e.type === 'boss'; });
  if (!hasBoss) {
    bossTimer -= dt;
    if (bossTimer > 0 && bossTimer < 3 &&
        Math.floor(bossTimer * 2) !== Math.floor((bossTimer + dt) * 2)) {
      sfx('warn');
    }
    if (bossTimer <= 0) {
      spawnBoss();
      bossTimer = 45 + rand(0, 15);
    }
  }

  updateBullets(dt);
  updateEnemies(dt);
  updateEnemyBullets(dt);
  updatePowerups(dt);

  // 炸弹冲击波
  for (let i = bombRings.length - 1; i >= 0; i--) {
    const r = bombRings[i];
    r.life -= dt;
    r.r = (1 - r.life / r.max) * 620;
    if (r.life <= 0) bombRings.splice(i, 1);
  }

  handleCollisions();

  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
}

/* ---- 子弹更新（含反弹） ---- */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.rotating) b.angle += dt * 14;

    // 墙壁反弹
    if (b.bounces > 0) {
      if (b.x - b.r < 0)          { b.x = b.r;          b.vx = Math.abs(b.vx);  b.bounces--; }
      else if (b.x + b.r > W)     { b.x = W - b.r;      b.vx = -Math.abs(b.vx); b.bounces--; }
      if (b.y - b.r < 0)          { b.y = b.r;          b.vy = Math.abs(b.vy);  b.bounces--; }
      else if (b.y + b.r > H)     { b.y = H - b.r;      b.vy = -Math.abs(b.vy); b.bounces--; }
    }

    // 越界 / 过期
    if (b.x < -80 || b.x > W + 80 || b.y < -80 || b.y > H + 80 || b.life <= 0) {
      bullets.splice(i, 1);
    }
  }
}

/* ---- 敌机更新 ---- */
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    if (e.type === 'boss') {
      if (!e.hovering) {
        e.y += e.vy * dt;
        if (e.y >= 118) { e.y = 118; e.hovering = true; }
      } else {
        e.x += e.vx * dt;
        if (e.x < 95)     { e.x = 95;     e.vx = Math.abs(e.vx); }
        if (e.x > W - 95) { e.x = W - 95; e.vx = -Math.abs(e.vx); }
        e.y = 118 + Math.sin(e.t * 1.2) * 12;
      }
    } else {
      if (e.behavior === 'sine') {
        e.x += e.vx * dt + Math.sin(e.t * 4) * 70 * dt;
        e.y += e.vy * dt;
      } else if (e.behavior === 'hover') {
        if (e.y < e.hoverY) e.y += e.vy * dt;
        else e.x += Math.sin(e.t * 1.6) * 60 * dt;
      } else {
        e.x += e.vx * dt;
        e.y += e.vy * dt;
      }
      if (e.x < e.r)     { e.x = e.r;     e.vx = Math.abs(e.vx); }
      if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); }
    }

    if (e.y > 0 && e.y < H - 60) {
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        enemyShoot(e);
        e.shootCd = e.shootInterval * rand(0.75, 1.25);
      }
    }

    if (e.y > H + 90 || e.x < -140 || e.x > W + 140) {
      enemies.splice(i, 1);
    }
  }
}

/* ---- 敌弹更新 ---- */
function updateEnemyBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) {
      ebullets.splice(i, 1);
    }
  }
}

/* ---- 道具更新（带磁吸） ---- */
function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.t += dt;

    const dx = player.x - p.x, dy = player.y - p.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < 120 * 120) {
      const d = Math.sqrt(d2) || 1;
      const pull = 320 * dt;
      p.x += (dx / d) * pull;
      p.y += (dy / d) * pull;
    } else {
      p.y += p.vy * dt;
      p.x += Math.sin(p.t * 2) * 30 * dt;
    }
    if (p.y > H + 40) powerups.splice(i, 1);
  }
}

/* ==================== 碰撞检测 ==================== */

/* 我方子弹 vs 敌机 */
function handleBulletsVsEnemies() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    if (i >= bullets.length) continue;
    const b = bullets[i];
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (!circleHit(b, e)) continue;

      e.hp -= b.dmg;
      e.hitFlash = 0.08;
      addSparks(b.x, b.y, 3);

      const killed = e.hp <= 0;

      if (b.pierce > 0) {
        b.pierce--;
      } else {
        bullets.splice(i, 1);
      }

      if (killed) killEnemy(j);

      if (b.pierce < 0) break;
      if (b.pierce === 0 && bullets[i] !== b) break;
    }
  }
}

/* 我方子弹 vs 敌方子弹（可击落敌弹） */
function handleBulletsVsEnemyBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    if (i >= bullets.length) continue;
    const b = bullets[i];
    for (let j = ebullets.length - 1; j >= 0; j--) {
      const eb = ebullets[j];
      if (!circleHit(b, eb)) continue;

      addSparks(eb.x, eb.y, 4);
      score += 2;
      ebullets.splice(j, 1);

      if (b.pierce > 0) {
        b.pierce--;
      } else {
        bullets.splice(i, 1);
        break;
      }
    }
  }
}

/* 敌机 / 敌弹 / 道具 vs 玩家 */
function handleCollisions() {
  handleBulletsVsEnemies();
  handleBulletsVsEnemyBullets();

  // 敌机撞击玩家
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (circleHit(e, player)) {
      const dmg = e.type === 'boss' ? 40 : (e.type === 'heavy' ? 25 : 15);
      damagePlayer(dmg);
      if (e.type !== 'boss') {
        e.hp -= 20;
        if (e.hp <= 0) killEnemy(i);
      }
    }
  }

  // 敌弹击中玩家
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (circleHit(b, player)) {
      damagePlayer(b.dmg);
      ebullets.splice(i, 1);
    }
  }

  // 道具拾取
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    if (circleHit(p, player)) {
      applyPowerup(p.type);
      powerups.splice(i, 1);
    }
  }
}

/* ==================== 特效更新 ==================== */
function updateEffects(dt) {
  if (state === 'playing') {
    const speedUp = 1 + Math.min(1, score / 6000);
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.y += c.sp * dt * speedUp;
      if (c.y - c.r > H + 80) clouds[i] = newCloud(false);
    }
  }

  if (state === 'paused') return;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const damp = Math.pow(0.9, dt * 60);
    p.vx *= damp;
    p.vy *= damp;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ==================== 绘制：背景 ==================== */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#0a1c3d');
  g.addColorStop(0.45, '#123a63');
  g.addColorStop(1,    '#2a6a9a');
  ctx.fillStyle = g;
  ctx.fillRect(-40, -40, W + 80, H + 80);

  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    const rg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    rg.addColorStop(0,   'rgba(205,232,255,' + c.a + ')');
    rg.addColorStop(0.6, 'rgba(180,215,250,' + (c.a * 0.5) + ')');
    rg.addColorStop(1,   'rgba(180,215,250,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ==================== 绘制：玩家 / 僚机 ==================== */
function drawPlayer() {
  if (player.hp <= 0) return;
  const p = player;

  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.invuln > 0 && Math.floor(time * 20) % 2 === 0) ctx.globalAlpha = 0.35;

  // 尾焰
  const flame = 10 + Math.random() * 12;
  ctx.beginPath();
  ctx.moveTo(-5, 16);
  ctx.lineTo(0, 16 + flame);
  ctx.lineTo(5, 16);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,190,80,0.9)';
  ctx.fill();

  // 机身
  const body = [
    [0, -26], [5, -8], [20, 4], [20, 12], [6, 9], [7, 20],
    [0, 17], [-7, 20], [-6, 9], [-20, 12], [-20, 4], [-5, -8]
  ];
  ctx.beginPath();
  ctx.moveTo(body[0][0], body[0][1]);
  for (let i = 1; i < body.length; i++) ctx.lineTo(body[i][0], body[i][1]);
  ctx.closePath();
  ctx.fillStyle = '#8fe3ff';
  ctx.fill();
  ctx.strokeStyle = '#2ea9dd';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 座舱
  ctx.beginPath();
  ctx.ellipse(0, -8, 5, 9, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#1d4f7a';
  ctx.fill();

  // 护盾
  if (p.shield > 0) {
    const a = 0.25 + 0.2 * Math.sin(time * 12);
    ctx.beginPath();
    ctx.arc(0, 0, p.r + 16, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,220,255,' + (a * 0.4) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,235,255,' + (a + 0.35) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.restore();

  // 僚机
  for (let i = 0; i < p.wingmen.length; i++) {
    const w = p.wingmen[i];
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(8, 8);
    ctx.lineTo(0, 4);
    ctx.lineTo(-8, 8);
    ctx.closePath();
    ctx.fillStyle = '#a8f0ff';
    ctx.fill();
    ctx.strokeStyle = '#2ea9dd';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#0b3a55';
    ctx.fill();
    ctx.restore();
  }
}

/* ==================== 绘制：环绕刀镰 ==================== */
function drawOrbitals() {
  for (let i = 0; i < orbitals.length; i++) {
    const o = orbitals[i];
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.angle * 2);

    // 外光晕
    ctx.beginPath();
    ctx.arc(0, 0, o.r + 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,90,150,0.18)';
    ctx.fill();

    // 六角刃
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3;
      const rr = k % 2 === 0 ? o.r : o.r * 0.55;
      if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,90,150,0.7)';
    ctx.fill();
    ctx.strokeStyle = '#ffb0d0';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 中心
    ctx.beginPath();
    ctx.arc(0, 0, o.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    ctx.restore();
  }
}

/* ==================== 绘制：敌机 ==================== */
function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    ctx.save();
    ctx.translate(e.x, e.y);
    const flashOn = e.hitFlash > 0;

    if (e.type === 'small') {
      ctx.beginPath();
      ctx.moveTo(0, e.r);
      ctx.lineTo(-e.r, -e.r * 0.6);
      ctx.lineTo(-e.r * 0.4, -e.r * 0.95);
      ctx.lineTo(0, -e.r * 0.4);
      ctx.lineTo(e.r * 0.4, -e.r * 0.95);
      ctx.lineTo(e.r, -e.r * 0.6);
      ctx.closePath();
      ctx.fillStyle = flashOn ? '#ffffff' : '#ff7a5a';
      ctx.fill();
      ctx.strokeStyle = '#8a2b18';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -e.r * 0.1, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe6c0';
      ctx.fill();

    } else if (e.type === 'medium') {
      ctx.beginPath();
      ctx.moveTo(0, e.r);
      ctx.lineTo(-e.r * 0.7, e.r * 0.2);
      ctx.lineTo(-e.r, -e.r * 0.5);
      ctx.lineTo(-e.r * 0.45, -e.r);
      ctx.lineTo(e.r * 0.45, -e.r);
      ctx.lineTo(e.r, -e.r * 0.5);
      ctx.lineTo(e.r * 0.7, e.r * 0.2);
      ctx.closePath();
      ctx.fillStyle = flashOn ? '#ffffff' : '#ffb03a';
      ctx.fill();
      ctx.strokeStyle = '#a35b0a';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -e.r * 0.8);
      ctx.lineTo(0, e.r * 0.7);
      ctx.strokeStyle = 'rgba(255,240,200,0.7)';
      ctx.lineWidth = 3;
      ctx.stroke();

    } else if (e.type === 'heavy') {
      ctx.beginPath();
      ctx.moveTo(0, e.r);
      ctx.lineTo(-e.r * 0.5, e.r * 0.45);
      ctx.lineTo(-e.r, e.r * 0.1);
      ctx.lineTo(-e.r * 0.85, -e.r * 0.7);
      ctx.lineTo(-e.r * 0.3, -e.r);
      ctx.lineTo(e.r * 0.3, -e.r);
      ctx.lineTo(e.r * 0.85, -e.r * 0.7);
      ctx.lineTo(e.r, e.r * 0.1);
      ctx.lineTo(e.r * 0.5, e.r * 0.45);
      ctx.closePath();
      ctx.fillStyle = flashOn ? '#ffffff' : '#c07aff';
      ctx.fill();
      ctx.strokeStyle = '#5e2ea3';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#ff5a8a';
      ctx.beginPath(); ctx.arc(-e.r * 0.45, e.r * 0.55, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( e.r * 0.45, e.r * 0.55, 5, 0, Math.PI * 2); ctx.fill();

    } else {
      // BOSS
      ctx.beginPath();
      ctx.moveTo(0, 70);
      ctx.lineTo(-38, 30);
      ctx.lineTo(-72, 16);
      ctx.lineTo(-62, -34);
      ctx.lineTo(-26, -62);
      ctx.lineTo(26, -62);
      ctx.lineTo(62, -34);
      ctx.lineTo(72, 16);
      ctx.lineTo(38, 30);
      ctx.closePath();
      ctx.fillStyle = flashOn ? '#ffffff' : '#8e5cf0';
      ctx.fill();
      ctx.strokeStyle = '#4a1e9e';
      ctx.lineWidth = 3;
      ctx.stroke();

      const pulse = 0.5 + 0.5 * Math.sin(time * 6);
      ctx.beginPath();
      ctx.arc(0, -6, 20 + pulse * 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,80,120,' + (0.6 + pulse * 0.35) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, -6, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe36b';
      ctx.fill();

      ctx.fillStyle = '#4a1e9e';
      ctx.beginPath(); ctx.arc(-52, 10, 10, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( 52, 10, 10, 0, Math.PI * 2); ctx.fill();

      const ratio = e.hp / e.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(-60, -88, 120, 10);
      ctx.fillStyle = ratio > 0.5 ? '#ff5a5a' : (ratio > 0.2 ? '#ffb03a' : '#ff3b3b');
      ctx.fillRect(-60, -88, 120 * ratio, 10);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-60, -88, 120, 10);
    }
    ctx.restore();
  }
}

/* ==================== 绘制：子弹 ==================== */
function drawBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];

    if (b.laser) {
      // 激光：细长胶囊
      ctx.save();
      ctx.translate(b.x, b.y);
      const ang = Math.atan2(b.vy, b.vx) + Math.PI / 2;
      ctx.rotate(ang);
      ctx.fillStyle = b.glowColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.r * 2.6, b.r * 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.r * 0.9, b.r * 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.ellipse(0, 0, b.r * 0.35, b.r * 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

    } else if (b.rotating) {
      // 旋转刃
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4;
        const rr = k % 2 === 0 ? b.r * 1.4 : b.r * 0.6;
        if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = b.glowColor;
      ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

    } else {
      // 普通圆形
      ctx.fillStyle = b.glowColor;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.4, 0, Math.PI * 2);
      ctx.fill();

      // 反弹剩余次数小标记
      if (b.bounces > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 4.5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }
}

/* ==================== 绘制：敌方子弹 ==================== */
function drawEnemyBullets() {
  for (let i = 0; i < ebullets.length; i++) {
    const b = ebullets[i];
    const col = b.color || '#ff4d6d';
    ctx.fillStyle = col + '55';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.66, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.2, b.y - b.r * 0.2, b.r * 0.24, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ==================== 绘制：道具 ==================== */
function drawPowerups() {
  const STYLE = {
    weapon: { col: '#ffd24a', label: 'W' },
    shield: { col: '#5ad1ff', label: 'S' },
    bomb:   { col: '#ff6b6b', label: 'B' },
    wing:   { col: '#8effa0', label: 'D' },
    life:   { col: '#ff9ad5', label: '+' }
  };
  for (let i = 0; i < powerups.length; i++) {
    const p = powerups[i];
    const st = STYLE[p.type] || STYLE.weapon;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.sin(p.t * 3) * 0.32);

    ctx.beginPath();
    ctx.arc(0, 0, p.r + 5, 0, Math.PI * 2);
    ctx.fillStyle = st.col + '33';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fillStyle = st.col;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#12202e';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(st.label, 0, 1);

    ctx.restore();
  }
}

/* ==================== 绘制：粒子 / 冲击波 ==================== */
function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.9), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBombRings() {
  for (let i = 0; i < bombRings.length; i++) {
    const r = bombRings[i];
    const a = Math.max(0, r.life / r.max);
    ctx.strokeStyle = 'rgba(160,240,255,' + (a * 0.85) + ')';
    ctx.lineWidth = 6 * a + 1;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.5) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r * 0.75, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/* ==================== 绘制：HUD ==================== */
function drawHUD() {
  // 血条
  const bw = 170, bh = 12, bx = 14, by = 14;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);

  const hpRatio = player.hp / player.maxHp;
  const hpColor = hpRatio > 0.5 ? '#4ade80'
                : hpRatio > 0.25 ? '#facc15'
                : '#ef4444';
  ctx.fillStyle = hpColor;
  ctx.fillRect(bx, by, bw * hpRatio, bh);

  if (hpRatio <= 0.25 && Math.floor(time * 6) % 2 === 0) {
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 2, by - 2, bw + 4, bh + 4);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);

  ctx.fillStyle = '#dff3ff';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('HP', bx + 4, by + bh / 2 + 0.5);

  // 分数
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillText(String(score).padStart(6, '0'), W - 14, 30);

  ctx.fillStyle = 'rgba(200,225,255,0.7)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('最高 ' + best, W - 14, 48);

  // 难度标记
  ctx.textAlign = 'right';
  ctx.fillStyle = currentDiff.color;
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillText(currentDiff.label, W - 14, 66);

  // 武器等级
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText('武器 Lv.' + player.weapon, 14, 48);

  // 当前模式
  const curMode = MODES.find(function (m) { return m.key === player.mode; }) || MODES[0];
  ctx.fillStyle = curMode.color;
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText('模式 ' + curMode.label + '  [Q]', 14, 66);

  // 护盾 / 僚机
  let hy = 84;
  if (player.shield > 0) {
    ctx.fillStyle = '#5ad1ff';
    ctx.fillText('护盾 ' + player.shield.toFixed(1) + 's', 14, hy);
    hy += 18;
  }
  if (player.wingmen.length > 0) {
    ctx.fillStyle = '#8effa0';
    ctx.fillText('僚机 x' + player.wingmen.length, 14, hy);
  }

  // 炸弹数量
  const bombY = H - 30;
  for (let i = 0; i < 5; i++) {
    const cx = 22 + i * 26;
    ctx.beginPath();
    ctx.arc(cx, bombY, 9, 0, Math.PI * 2);
    if (i < player.bombs) {
      ctx.fillStyle = '#ff6b6b';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('B', cx, bombY + 0.5);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    } else {
      ctx.strokeStyle = 'rgba(255,107,107,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(220,235,255,0.55)';
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillText('空格/右键', 22 + 5 * 26 + 6, bombY + 4);

  // 连击
  if (player.combo >= 2) {
    const a = Math.min(1, player.comboTimer / 0.6);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe36b';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText('x' + player.combo, W / 2, 130);

    const mult = 1 + Math.min(player.combo / 10, 2.5);
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('得分倍率 ' + mult.toFixed(1) + 'x', W / 2, 150);
    ctx.restore();
  }

  // BOSS 警告
  const hasBoss = enemies.some(function (e) { return e.type === 'boss'; });
  if (!hasBoss && bossTimer > 0 && bossTimer < 3.2) {
    if (Math.floor(time * 8) % 2 === 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3b5c';
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.fillText('WARNING', W / 2, H / 2 - 40);
      ctx.fillStyle = 'rgba(255,180,190,0.9)';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText('BOSS 接近中', W / 2, H / 2 - 14);
    }
  }

  // 模式切换提示
  if (modeToast) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, modeToast.timer / 0.5);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8fe3ff';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(modeToast.text, W / 2, H / 2 + 50);
    ctx.fillStyle = 'rgba(200,225,255,0.75)';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText(modeToast.tip, W / 2, H / 2 + 76);
    ctx.restore();
  }

  // 顶部细线
  ctx.fillStyle = 'rgba(120,200,255,0.25)';
  ctx.fillRect(0, 100, W, 1);

  // 静音提示
  if (muted) {
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('静音中 (M)', W - 14, 84);
  }
}

  }

// 圆角矩形辅助
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ==================== 暂停 / 结束 ==================== */
function drawPauseOverlay() {

  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillText('已暂停', W / 2, H / 2);
  ctx.fillStyle = 'rgba(200,225,255,0.8)';
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillText('按 P 或 Esc 继续', W / 2, H / 2 + 36);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(3,8,18,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#ff5a6e';
  ctx.font = 'bold 42px system-ui, sans-serif';
  ctx.fillText('游戏结束', W / 2, H / 2 - 88);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillText('最终得分：' + score, W / 2, H / 2 - 16);

  ctx.fillStyle = 'rgba(190,220,255,0.85)';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText('最高得分：' + best, W / 2, H / 2 + 22);

  ctx.fillStyle = currentDiff.color;
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillText('难度：' + currentDiff.label, W / 2, H / 2 + 52);

  if (Math.floor(time * 2) % 2 === 0) {
    ctx.fillStyle = '#7fe9ff';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillText('点击画面 或 按 R 键 重新开始', W / 2, H / 2 + 110);
  }

  ctx.fillStyle = 'rgba(150,180,215,0.5)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('鼠标移动战机 · 空格/右键炸弹 · Q 切换模式 · P 暂停 · M 静音',
    W / 2, H - 30);
}

/* ==================== 渲染主函数 ==================== */
function render() {
  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawBackground();
  drawPowerups();
  drawEnemies();
  drawBullets();
  drawEnemyBullets();
  drawOrbitals();
  drawPlayer();
  drawParticles();
  drawBombRings();

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, flash) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (state !== 'menu') drawHUD();

  if (state === 'menu')     drawMenu();
  if (state === 'paused')   drawPauseOverlay();
  if (state === 'gameover') drawGameOver();
}

/* ==================== 主循环 ==================== */
let lastTime = performance.now();

function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 1 / 30) dt = 1 / 30;

  time += dt;

  if (state === 'playing') {
    updateGame(dt);
  }
  updateEffects(dt);

  render();
  requestAnimationFrame(loop);
}

/* ==================== 启动 ==================== */
// 菜单状态先构建云层
clouds.length = 0;
for (let i = 0; i < 16; i++) clouds.push(newCloud(true));

requestAnimationFrame(loop);

})();
</script>
